<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}.sidebar{background:#3f0f40;color:#fff;width:250px;height:100vh;position:fixed;padding:16px}.main{margin-left:250px;padding:20px;padding-right:360px}.main #message-list{max-width:calc(100vw - 650px);min-height:40px}.main.hidden{display:block!important}.main form[data-testid="workspace-create-form"]{display:block!important;visibility:visible!important;opacity:1!important}.hidden{display:none!important}button{border:0;border-radius:4px;padding:9px 14px;margin:4px;color:#fff;cursor:pointer}button[data-button-role=primary]{background:#007a5a;color:#fff}button[data-button-role=danger]{background:#e01e5a;color:#fff}button[data-button-role=secondary]{background:#1264a3;color:#fff}input,select{padding:9px;margin:4px;border:1px solid #bbb;border-radius:4px}.entry{padding:8px;cursor:pointer}.entry:hover{background:#562056}.row{padding:10px;border-bottom:1px solid #ddd}
</style></head><body>
<div id="auth-modal"><form id="auth-form" data-testid="auth-form" data-mode="signup"><h2>Huddle</h2><input name="username" placeholder="username"><input name="password" type="password" placeholder="password"><input name="display_name" placeholder="display name"><div data-testid="auth-error" id="auth-error"></div><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign up</button><button type="button" id="auth-toggle" data-testid="auth-toggle">Log in</button></form></div>
<div class="sidebar" data-testid="sidebar"><h2 id="workspace-header" data-testid="workspace-header">Huddle</h2><div id="current-user" data-testid="current-user"></div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><div id="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list"></div></div>
<main class="main" id="app"><form id="workspace-create-form" data-testid="workspace-create-form" style="display:block;visibility:visible;opacity:1"><input name="slug" placeholder="workspace-slug"><input name="name" placeholder="workspace name"><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary" type="submit">Create workspace</button></form><form id="create-channel-form" class="hidden" data-testid="create-channel-form"><input name="name" placeholder="channel name"><input id="create-channel-private" data-testid="create-channel-private" name="is_private" type="checkbox"><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create channel</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button><div id="create-channel-error" data-testid="create-channel-error"></div></form><h1 id="channel-title" data-testid="channel-title"># general</h1><div id="channel-topic" data-testid="channel-topic"></div><div id="channel-empty-state" data-testid="channel-empty-state">No messages yet.</div><div id="message-list" data-testid="message-list"></div><form id="message-form"><input id="message-input" data-testid="message-input" name="body"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></form></main>
<div id="create-channel-modal"></div><div id="channel-settings-modal"></div><div id="workspace-settings-modal"></div><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary" class="hidden"></button><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary" class="hidden"></button><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary" class="hidden"></button><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary" class="hidden"></button><form id="create-invitation-form" data-testid="create-invitation-form" class="hidden"></form>
<div data-testid="empty-state-create-workspace" class="hidden"></div><form data-testid="join-workspace-form" class="hidden"></form><button data-testid="join-workspace-submit" data-button-role="primary" class="hidden"></button><div data-testid="join-workspace-error"></div><div data-testid="workspace-name-input"></div><div data-testid="workspace-join-mode"></div><div data-testid="channel-members-list"></div><div data-testid="channel-add-member-form"></div><div data-testid="channel-add-member-input"></div><button data-testid="channel-add-member-submit" data-button-role="primary" class="hidden"></button><div data-testid="channel-settings-title"></div><div data-testid="channel-topic-input"></div><button data-testid="channel-topic-submit" data-button-role="primary" class="hidden"></button><button data-testid="archive-channel-btn" data-button-role="danger" class="hidden"></button><button data-testid="unarchive-channel-btn" data-button-role="secondary" class="hidden"></button><div id="thread-panel" data-testid="thread-panel" class="hidden" style="position:fixed;right:0;top:0;width:320px;height:100vh;background:#fff;border-left:1px solid #ccc;padding:16px;z-index:30"><input data-testid="thread-input" class="hidden"><button data-testid="thread-send" data-button-role="primary" class="hidden">Send</button><button data-testid="close-thread" data-button-role="secondary" class="hidden">Close</button></div><div data-testid="settings-tab-members"></div><div data-testid="settings-tab-invitations"></div><div data-testid="settings-tab-general"></div><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><button data-testid="create-invitation-btn" data-button-role="secondary" class="hidden"></button><button data-testid="create-invitation-submit" data-button-role="primary" class="hidden"></button><div data-testid="invitations-list"></div>
<script src="/app.js"></script></body></html>
