<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>body{margin:0;font:14px Arial;background:#f8f8f8;color:#222}button{border:0;padding:9px 14px;border-radius:4px;background:#007a5a;color:#fff}.app{display:flex;height:100vh}.side{width:240px;background:#3f0e40;color:white;padding:20px}.main{flex:1;padding:24px}.modal{max-width:420px;margin:60px auto;background:white;padding:24px;border-radius:8px;box-shadow:0 2px 10px #bbb}input,textarea{display:block;width:100%;box-sizing:border-box;margin:8px 0;padding:10px}</style></head><body><div id="app"><div class="modal" id="auth-modal"><h1>Huddle</h1><form data-testid="auth-form"><input name="username" placeholder="Username"><input name="password" type="password" placeholder="Password"><button data-testid="auth-submit" data-button-role="primary">Sign in</button><button type="button" data-testid="auth-toggle" data-button-role="secondary">Create account</button><div id="auth-error"></div></form></div></div><script>const A='/api';let token=localStorage.getItem('huddle.token');document.querySelector('[data-testid=auth-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),r=await fetch(A+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.get('username'),password:f.get('password')})}),d=await r.json();if(!r.ok){document.querySelector('#auth-error').textContent=d.error||'Invalid login';return}localStorage.setItem('huddle.token',d.token);location.reload()};if(token)document.querySelector('#app').innerHTML='<div class="app"><aside class="side"><h2 data-testid="workspace-header">Huddle</h2><button data-testid="logout-btn" data-button-role="danger" onclick="localStorage.clear();location.reload()">Logout</button></aside><main class="main"><h1 data-testid="channel-title"># general</h1><div data-testid="message-list"></div><input data-testid="message-input"><button data-testid="send-btn" data-button-role="primary">Send</button></main></div>';</script></body></html>
