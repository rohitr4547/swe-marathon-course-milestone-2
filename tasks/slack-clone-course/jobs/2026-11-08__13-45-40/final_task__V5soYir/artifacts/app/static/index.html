tor('[data-testid=open-thread-btn]').onclick=()=>{q('thread-panel').style.display='block';q('thread-panel').dataset.parent=m.id;api2('/messages/'+m.id+'/replies').then(j=>(j.replies||[]).forEach(x=>q('thread-panel').insertAdjacentHTML('beforeend','<div class="thread-reply">'+x.body+'</div>')))}}

<script>
