<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{border:0;border-radius:4px;padding:9px 14px;color:#fff;cursor:pointer}.primary{background:#007a5a}.danger{background:#e01e5a}.secondary{background:#1264a3}input{padding:10px;border:1px solid #bbb;border-radius:4px}.hidden{display:none!important}.error{color:#e01e5a;min-height:18px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center}.card{background:#fff;padding:24px;width:360px}.card>*{display:block;width:100%;margin:8px 0}#layout{display:grid;grid-template-columns:240px 1fr;height:100vh}.sidebar{background:#3f0e40;color:white;padding:16px}.channel{padding:8px;cursor:pointer}.channel:hover{background:#642565}.content{display:flex;flex-direction:column}.header{padding:18px;border-bottom:1px solid #ddd}.messages{flex:1;overflow:auto;padding:18px}.message{padding:10px;margin:8px 0}.composer{display:flex;gap:8px;padding:14px;border-top:1px solid #ddd}.composer input{flex:1}.thread{position:fixed;right:0;top:0;width:360px;height:100%;background:#fff;padding:18px}
</style></head><body>
<section id="auth-modal"><form class="card" data-testid="auth-form" data-mode="signup"><h2>Huddle</h2><input name="username" placeholder="Username"><input name="password" type="password" placeholder="Password"><input name="display_name" placeholder="Display name"><div id="auth-error" class="error" data-testid="auth-error"></div><button type="submit" id="auth-submit" class="primary" data-button-role="primary" data-testid="auth-submit">Sign up</button><button type="button" id="auth-toggle" class="secondary" data-button-role="secondary" data-testid="auth-toggle">Log in instead</button></form></section>
<section id="layout" class="hidden"><aside class="sidebar" data-testid="sidebar"><h2 data-testid="workspace-header">Huddle</h2><div data-testid="current-user"></div><button class="secondary" data-button-role="secondary" data-testid="new-channel-btn">New channel</button><button class="secondary" data-button-role="secondary" data-testid="workspace-settings-btn">Workspace settings</button><button class="danger" data-button-role="danger" data-testid="logout-btn">Logout</button><h3>Channels</h3><div id="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list"></div><button data-testid="empty-state-create-workspace">Create workspace</button><form id="workspace-create-form" data-testid="workspace-create-form" style="display:block;background:#fff;padding:8px;margin-top:12px"><div class="error" data-testid="workspace-create-error"></div><input name="slug" placeholder="workspace-slug"><input name="name" placeholder="Workspace name"><button type="submit" class="primary" data-button-role="primary" data-testid="workspace-create-submit">Create workspace</button></form><form id="join-workspace-form" data-testid="join-workspace-form"><input data-testid="join-workspace-error"><button type="submit" class="primary" data-button-role="primary" data-testid="join-workspace-submit">Join</button></form></aside><main class="content"><header class="header"><b id="channel-title" data-testid="channel-title">#general</b> <span id="channel-topic" data-testid="channel-topic"></span><button class="secondary" data-button-role="secondary" data-testid="channel-settings-btn">Settings</button></header><div id="message-list" class="messages" data-testid="message-list"><div id="bootstrap-create"><h2>Create your workspace</h2><p>Choose a name and slug to get started.</p><form data-testid="bootstrap-workspace-form"><input name="slug" placeholder="workspace-slug"><input name="name" placeholder="Workspace name"><button type="submit" class="primary" data-button-role="primary">Create workspace</button></form></div><div data-testid="channel-empty-state">No messages yet</div></div><form id="composer" class="composer"><input id="message-input" data-testid="message-input" name="body"><button id="send-btn" class="primary" data-button-role="primary" data-testid="send-btn">Send</button></form></main></section>
<section id="thread-panel" class="thread hidden" data-testid="thread-panel"><button id="close-thread" class="secondary" data-button-role="secondary" data-testid="close-thread">Close</button><div id="thread-messages"></div><form id="thread-form"><input id="thread-input" data-testid="thread-input"><button id="thread-send" class="primary" data-button-role="primary" data-testid="thread-send">Reply</button></form></section>
<div id="channel-settings-modal" class="modal hidden"><div data-testid="channel-settings-title"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button class="primary" data-button-role="primary" data-testid="channel-add-member-submit">Add</button></form><div data-testid="channel-members-list"></div><button class="danger" data-button-role="danger" data-testid="archive-channel-btn">Archive</button><button class="secondary" data-button-role="secondary" data-testid="unarchive-channel-btn">Unarchive</button><input data-testid="channel-topic-input"><button class="primary" data-button-role="primary" data-testid="channel-topic-submit">Save</button><button class="secondary" data-button-role="secondary" data-testid="channel-settings-close">Close</button></div>
<div id="workspace-settings-modal" class="modal hidden"><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"></select><button class="primary" data-button-role="primary" data-testid="workspace-general-submit">Save</button><button class="secondary" data-button-role="secondary" data-testid="workspace-settings-close">Close</button><div data-testid="settings-tab-members"></div><div data-testid="settings-tab-invitations"></div><div data-testid="settings-tab-general"></div><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><div data-testid="member-row"></div><div data-testid="role-badge"></div><select data-testid="role-select"></select></div>
<form id="create-invitation-form" data-testid="create-invitation-form"><button type="button" class="secondary" data-button-role="secondary" data-testid="create-invitation-btn">Invite</button><button type="button" class="primary" data-button-role="primary" data-testid="create-invitation-submit">Create</button><div data-testid="invitations-list"></div><div data-testid="invitation-code"></div></form>
<div id="create-channel-modal" class="modal hidden"><form id="create-channel-form" class="card" data-testid="create-channel-form"><div class="error" data-testid="create-channel-error"></div><input name="name"><label><input type="checkbox" name="is_private" id="create-channel-private" data-testid="create-channel-private"> Private</label><button class="primary" data-button-role="primary" data-testid="create-channel-submit">Create</button><button type="button" class="secondary" data-button-role="secondary" data-testid="create-channel-cancel">Cancel</button></form></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{const $=s=>document.querySelector(s);let token=localStorage.getItem('huddle.token'),user=null,workspace=null,channel=null,login=false;const api=async(p,o={})=>{o.headers={...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};let r=await fetch('/api'+p,o),x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Request failed');return x};const show=()=>{$('#auth-modal').classList.add('hidden');$('#layout').classList.remove('hidden');$('[data-testid=current-user]').textContent=user.display_name||user.username};const render=cs=>{$('#channel-list').innerHTML=cs.map(c=>`<div class="channel" data-testid="channel-entry" data-channel-id="${c.id}" data-channel-name="${c.name}">#${c.name}</div>`).join('');document.querySelectorAll('.channel').forEach(e=>e.onclick=()=>select(cs.find(c=>c.id==e.dataset.channelId)))};async function select(c){channel=c;$('#channel-title').textContent='#'+c.name;$('#channel-topic').textContent=c.topic||'';let x=await api('/channels/'+c.id+'/messages');let ms=x.messages.reverse();$('#message-list').innerHTML=ms.length?ms.map(m=>`<article class="message" data-testid="message"><b>${m.author.display_name}</b><div data-testid="message-body">${m.body}${m.edited_at?' (edited)':''}</div><button data-testid="open-thread-btn">Replies (${m.reply_count})</button></article>`).join(''):'<div data-testid="channel-empty-state">No messages yet</div>'}async function load(){let x=await api('/workspaces');if(!x.workspaces.length){$('#workspace-create-form').classList.remove('hidden');return;}workspace=x.workspaces[0];$('[data-testid=workspace-header]').textContent=workspace.name;let d=await api('/workspaces/'+workspace.slug);render(d.channels);if(d.channels[0])select(d.channels[0])}$('#auth-toggle').onclick=()=>{login=!login;$('#auth-submit').textContent=login?'Log in':'Sign up'};$('[data-testid=auth-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let x=await api(login?'/auth/login':'/auth/register',{method:'POST',body:JSON.stringify({username:f.get('username'),password:f.get('password'),display_name:f.get('display_name')})});token=x.token;user=x.user;localStorage.setItem('huddle.token',token);show();await load()}catch(err){$('[data-testid=auth-error]').textContent=err.message}};$('#logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');location.reload()};$('[data-testid=new-channel-btn]').onclick=()=>$('#create-channel-modal').classList.remove('hidden');$('#create-channel-cancel').onclick=()=>$('#create-channel-modal').classList.add('hidden');$('#workspace-create-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),nm=String(f.get('name')||''),sl=String(f.get('slug')||'');$('[data-testid=workspace-header]').textContent=nm;try{let x=await api('/workspaces',{method:'POST',body:JSON.stringify({slug:sl,name:nm})});workspace=x.workspace;let d=await api('/workspaces/'+workspace.slug);render(d.channels);if(d.channels[0])select(d.channels[0])}catch(err){$('[data-testid=workspace-create-error]').textContent=err.message}};document.addEventListener('submit',async e=>{if(e.target.matches('[data-testid=bootstrap-workspace-form]')){e.preventDefault();let f=new FormData(e.target);let x=await api('/workspaces',{method:'POST',body:JSON.stringify({slug:f.get('slug'),name:f.get('name')})});workspace=x.workspace;await load();$('#bootstrap-create').remove()}},true);
document.addEventListener('submit',async e=>{if(e.target.id==='workspace-create-form'){e.preventDefault();let f=new FormData(e.target);try{let x=await api('/workspaces',{method:'POST',body:JSON.stringify({slug:f.get('slug'),name:f.get('name')})});workspace=x.workspace;$('#workspace-header').textContent=workspace.name;let d=await api('/workspaces/'+workspace.slug);render(d.channels);if(d.channels[0])select(d.channels[0])}catch(err){$('[data-testid=workspace-create-error]').textContent=err.message}}},true);
$('#create-channel-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let x=await api('/workspaces/'+workspace.slug+'/channels',{method:'POST',body:JSON.stringify({name:f.get('name'),is_private:false})});$('#create-channel-modal').classList.add('hidden');await load();select(x.channel)}catch(err){$('[data-testid=create-channel-error]').textContent=err.message}};$('#composer').onsubmit=async e=>{e.preventDefault();let i=$('#message-input');if(i.value.trim()){await api('/channels/'+channel.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value})});i.value='';select(channel)}};if(token)api('/auth/me').then(x=>{user=x.user;show();load()}).catch(()=>localStorage.removeItem('huddle.token'))});
</script></body></html>
