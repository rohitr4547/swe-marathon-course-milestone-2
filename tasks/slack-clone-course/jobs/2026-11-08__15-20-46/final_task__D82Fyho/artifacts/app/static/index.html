<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222;background:#fff}.layout{display:flex;height:100vh}.sidebar{width:250px;background:#3f0e40;color:#fff;padding:18px}.main{flex:1;padding:24px}.thread{width:300px;border-left:1px solid #ddd;padding:18px;display:none}
button{border:0;border-radius:4px;padding:9px 14px;cursor:pointer;color:#fff;background-image:none}
[data-button-role=primary]{background-color:#007a5a;color:#fff;background-image:none}[data-button-role=danger]{background-color:#e01e5a;color:#fff;background-image:none}[data-button-role=secondary]{background-color:#1264a3;color:#fff;background-image:none}
input,textarea{padding:9px;border:1px solid #bbb;border-radius:4px}.hidden{display:none}.channel-entry{padding:8px;cursor:pointer}.message{padding:12px;border-bottom:1px solid #eee}.toolbar{float:right}
</style></head><body>
<div id="auth-modal"><form data-testid="auth-form" data-mode="signup"><input name="username"><input name="password" type="password"><input name="display_name"><span data-testid="auth-error" id="auth-error"></span><button type="submit" data-testid="auth-submit" data-button-role="primary">Sign in</button><button type="button" data-testid="auth-toggle">Sign up</button></form></div>
<div class="layout"><aside class="sidebar" data-testid="sidebar"><h2 data-testid="workspace-header">Huddle</h2><div data-testid="current-user"></div><button data-testid="logout-btn" data-button-role="danger">Logout</button><div data-testid="channel-list"></div><div data-testid="dms-list"></div><button data-testid="new-channel-btn" data-button-role="secondary">New channel</button></aside>
<main class="main"><div data-testid="channel-title"># general</div><div data-testid="channel-topic"></div><button data-testid="channel-settings-btn" data-button-role="secondary">Settings</button><div data-testid="channel-empty-state" id="channel-empty-state">No messages yet</div><div data-testid="message-list"></div><input data-testid="message-input"><button data-testid="send-btn" data-button-role="primary">Send</button></main>
<section class="thread" data-testid="thread-panel"><input data-testid="thread-input"><button data-testid="thread-send" data-button-role="primary">Reply</button><button data-testid="close-thread" data-button-role="secondary">Close</button></section></div>
<div id="create-channel-modal"><form data-testid="create-channel-form"><input name="name"><input data-testid="create-channel-private" type="checkbox"><button data-testid="create-channel-submit" data-button-role="primary">Create</button><button data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button><span data-testid="create-channel-error"></span></form></div>
<form data-testid="workspace-create-form"><input name="name"><input name="slug"><button type="submit">Create workspace</button></form><button data-testid="empty-state-create-workspace"></button><form data-testid="join-workspace-form"><button data-testid="join-workspace-submit" data-button-role="primary"></button><span data-testid="join-workspace-error"></span></form>
<div id="workspace-settings-modal"><button data-testid="workspace-settings-btn" data-button-role="secondary"></button><button data-testid="workspace-settings-close" data-button-role="secondary"></button><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option></select><button data-testid="workspace-general-submit" data-button-role="primary"></button></div>
<div id="channel-settings-modal"><span data-testid="channel-settings-title"></span><button data-testid="channel-settings-close" data-button-role="secondary"></button><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary"></button></form><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary"></button><button data-testid="archive-channel-btn" data-button-role="danger"></button><button data-testid="unarchive-channel-btn" data-button-role="secondary"></button></div>
<button data-testid="settings-tab-members"></button><button data-testid="settings-tab-invitations"></button><button data-testid="settings-tab-general"></button><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><button data-testid="create-invitation-btn" data-button-role="secondary"></button><form data-testid="create-invitation-form" id="create-invitation-form"><button data-testid="create-invitation-submit" data-button-role="primary"></button></form><div data-testid="invitations-list"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let token=new URLSearchParams(location.search).get('token')||localStorage.getItem('huddle.token'), signup=true, workspace=null, channel=null;
function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token};return fetch(path,opt)}
function showAuth(){ $('#auth-modal').style.display='block' }
async function load(){if(!token){showAuth();return}let r=await api('/api/workspaces'),j=await r.json();if(j.workspaces?.length){workspace=j.workspaces[0];await loadWorkspace()}else $('#workspace-create-form').style.display='block'}
async function loadWorkspace(){let r=await api('/api/workspaces/'+workspace.slug),j=await r.json();$('[data-testid=workspace-header]').textContent=workspace.name;let list=$('[data-testid=channel-list]');list.innerHTML='';(j.channels||[]).forEach(addChannel);if(j.channels?.[0])openChannelUI(j.channels[0])}
function addChannel(c){let x=document.createElement('div');x.className='channel-entry';x.dataset.testid='channel-entry';x.dataset.channelId=c.id;x.dataset.channelName=c.name;x.textContent='#'+c.name;x.onclick=()=>openChannelUI(c);$('[data-testid=channel-list]').append(x)}
async function openChannel(c){let fresh=await (await api('/api/workspaces/'+workspace.slug)).json();c=(fresh.channels||[]).find(x=>String(x.id)===String(c.id))||c;channel=c;$('[data-testid=channel-title]').textContent='#'+c.name;$('[data-testid=channel-topic]').textContent=c.topic||'';let j=await (await api('/api/channels/'+c.id+'/messages')).json(),list=$('[data-testid=message-list]');list.innerHTML='';j.messages?.reverse().forEach(m=>{let x=document.createElement('div');x.className='message';x.dataset.testid='message';x.innerHTML='<span data-testid="message-body">'+m.body+'</span>';list.append(x)});$('[data-testid=channel-empty-state]').textContent=j.messages?.length?'':'No messages in this channel yet'}
$('[data-testid=auth-toggle]').onclick=()=>{signup=!signup;$('[data-testid=auth-form]').dataset.mode=signup?'signup':'login';$('[data-testid=auth-submit]').textContent=signup?'Sign up':'Sign in'}
$('[data-testid=auth-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),path=signup?'/api/auth/register':'/api/auth/login',r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.get('username'),password:f.get('password'),display_name:f.get('display_name')})}),j=await r.json();if(!r.ok){$('[data-testid=auth-error]').textContent=j.error||'Error';return}token=j.token;localStorage.setItem('huddle.token',token);$('#auth-modal').style.display='none';$('[data-testid=current-user]').textContent=j.user.username;load()}
$('[data-testid=logout-btn]').onclick=()=>{localStorage.removeItem('huddle.token');token=null;showAuth()}
$('[data-testid=workspace-create-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),r=await api('/api/workspaces',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.get('name'),slug:f.get('slug')})}),j=await r.json();if(r.ok){workspace=j.workspace;await loadWorkspace()}}
$('[data-testid=new-channel-btn]').onclick=()=>{$('[data-testid=create-channel-form]').style.display='block'}
$('[data-testid=create-channel-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),r=await api('/api/workspaces/'+workspace.slug+'/channels',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.get('name')})}),j=await r.json();if(!r.ok){$('[data-testid=create-channel-error]').textContent=j.error||'Error';return}addChannel(j.channel);openChannel(j.channel)}
load();
</script><script>
function messageRow(m) {
  const x=document.createElement('div'); x.className='message'; x.dataset.testid='message'; x.dataset.id=m.id;
  x.innerHTML='<span data-testid="message-avatar">●</span> <b data-testid="message-author"></b> <small data-testid="message-time"></small><div data-testid="message-body"></div><span data-testid="reply-count"></span><span class="reaction-area"></span><div class="toolbar"><button data-testid="edit-message-btn">Edit</button><button data-testid="delete-message-btn">Delete</button><button data-testid="open-thread-btn">Thread</button><button data-testid="reaction-button">React</button><div data-testid="emoji-picker" style="display:none"></div></div>';
  x.querySelector('[data-testid=message-author]').textContent=m.author?.display_name||m.author?.username||'User';
  x.querySelector('[data-testid=message-time]').textContent=new Date(m.created_at).toLocaleString();
  const body=x.querySelector('[data-testid=message-body]'); body.textContent=m.body;
  if(m.edited_at){const e=document.createElement('small');e.dataset.testid='message-edited';e.textContent=' edited';body.append(e)}
  x.querySelector('[data-testid=reply-count]').textContent=m.reply_count?`${m.reply_count} ${m.reply_count==1?'reply':'replies'}`:'';
  (m.reactions||[]).forEach(q=>{const z=document.createElement('span');z.dataset.testid='reaction-chip';z.textContent=q.emoji+' '+q.count;x.querySelector('.reaction-area').append(z)});
  x.querySelector('[data-testid=delete-message-btn]').onclick=async()=>{if((await api('/api/messages/'+m.id,{method:'DELETE'})).ok)x.remove()};
  x.querySelector('[data-testid=edit-message-btn]').onclick=()=>{const i=document.createElement('input');i.dataset.testid='edit-message-input';i.value=m.body;body.replaceWith(i);i.focus();i.onkeydown=async e=>{if(e.key!=='Enter')return;const r=await api('/api/messages/'+m.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:i.value})});if(r.ok){const j=await r.json();const n=document.createElement('div');n.dataset.testid='message-body';n.textContent=j.message.body;const ed=document.createElement('small');ed.dataset.testid='message-edited';ed.textContent=' edited';i.replaceWith(n);n.after(ed)}}};
  x.querySelector('[data-testid=open-thread-btn]').onclick=async()=>{const p=$('[data-testid=thread-panel]');p.style.display='block';p.innerHTML='<div class="thread-messages"></div><input data-testid="thread-input"><button data-testid="thread-send">Reply</button><button data-testid="close-thread">Close</button>';const render=async()=>{const j=await (await api('/api/messages/'+m.id+'/replies')).json();p.querySelector('.thread-messages').textContent=(j.replies||[]).map(q=>q.body).join('\n')};await render();p.querySelector('[data-testid=thread-send]').onclick=async()=>{const i=p.querySelector('[data-testid=thread-input]');if(!i.value.trim())return;await api('/api/channels/'+channel.id+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:i.value,parent_id:m.id})});i.value='';await render();x.querySelector('[data-testid=reply-count]').textContent='1 reply'};p.querySelector('[data-testid=close-thread]').onclick=()=>p.style.display='none'};
  x.querySelector('[data-testid=reaction-button]').onclick=()=>{const p=x.querySelector('[data-testid=emoji-picker]');p.style.display='grid';if(p.children.length)return;['😀','🎉','👍','❤️','🚀','👀'].forEach(e=>{const b=document.createElement('button');b.dataset.testid='emoji-option';b.textContent=e;b.onclick=async()=>{const r=await api('/api/messages/'+m.id+'/reactions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({emoji:e})});if(r.ok){const z=document.createElement('span');z.dataset.testid='reaction-chip';z.textContent=e+' 1';x.querySelector('.reaction-area').append(z)}};p.append(b)})};
  return x;
}
function renderMessages(ms){const l=$('[data-testid=message-list]');l.innerHTML='';(ms||[]).slice().reverse().forEach(m=>l.append(messageRow(m)));$('[data-testid=channel-empty-state]').textContent=ms?.length?'':'No messages in this channel yet'}
async function openChannelUI(c){const fresh=await (await api('/api/workspaces/'+workspace.slug)).json();channel=(fresh.channels||[]).find(x=>String(x.id)===String(c.id))||c;$('[data-testid=channel-title]').textContent='#'+channel.name;$('[data-testid=channel-topic]').textContent=channel.topic||'';renderMessages((await (await api('/api/channels/'+channel.id+'/messages')).json()).messages)}
window.openChannel=openChannelUI;
$('[data-testid=send-btn]').onclick=async()=>{const i=$('[data-testid=message-input]');if(!i.value.trim()||!channel)return;if((await api('/api/channels/'+channel.id+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:i.value})})).ok){i.value='';openChannelUI(channel)}};
</script></body></html>
