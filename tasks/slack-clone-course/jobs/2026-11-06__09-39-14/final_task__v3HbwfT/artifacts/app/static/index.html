<!doctype html><html><head><meta charset=utf-8><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}.layout{display:flex;height:100vh}.sidebar{width:250px;background:#3f0f40;color:white;padding:18px}.main{flex:1;display:flex;flex-direction:column}.messages{flex:1;padding:20px;overflow:auto}.thread{width:320px;border-left:1px solid #ddd;padding:15px}.hidden{display:none!important}button{border:0;padding:9px 14px;border-radius:4px;color:#fff;cursor:pointer}[data-button-role="primary"]{background-color:#007a5a;background-image:none}[data-button-role="danger"]{background-color:#e01e5a;background-image:none}[data-button-role="secondary"]{background-color:#1264a3;background-image:none}.channel-entry{display:block;width:100%;text-align:left;background:transparent;color:#fff;margin:5px 0}.message{padding:10px;border-bottom:1px solid #eee}.toolbar{display:none}.message:hover .toolbar{display:block}.auth{padding:40px;max-width:400px;margin:auto}input,textarea{padding:9px;margin:4px;width:90%}.modal{padding:15px;border:1px solid #ddd;background:#fff}
</style></head><body><div id="auth-modal" class=auth><form data-testid="auth-form" data-mode=signup><h1>Huddle</h1><input name=username placeholder=username><input name=password type=password placeholder=password><input name=display_name placeholder=display name><div data-testid="auth-error"></div><button data-testid="auth-submit" data-button-role="primary">Sign up</button><button type=button data-testid="auth-toggle">Log in</button></form></div>
<div class="layout hidden" id="app"><aside class=sidebar data-testid="sidebar"><h2 data-testid="workspace-header"></h2><div data-testid="current-user"></div><div data-testid="channel-list"></div><div data-testid="dms-list"></div><button data-testid="new-channel-btn" data-button-role="secondary">New channel</button><button data-testid="logout-btn" data-button-role="danger">Logout</button></aside><main class=main><header><h2 id="channel-title" data-testid="channel-title"></h2><span id="channel-topic" data-testid="channel-topic"></span><button data-testid="workspace-settings-btn" data-button-role="secondary">Settings</button><button data-testid="channel-settings-btn" data-button-role="secondary">Channel</button></header><section class=messages id="message-list" data-testid="message-list"><div data-testid="channel-empty-state"></div></section><form id="sendform"><input data-testid="message-input"><button data-testid="send-btn" data-button-role="primary">Send</button></form></main><aside class="thread hidden" data-testid="thread-panel"><button data-testid="close-thread" data-button-role="secondary">Close</button><div id="threadmsgs"></div><input data-testid="thread-input"><button data-testid="thread-send" data-button-role="primary">Reply</button></aside></div>
<div id="create-channel-modal" class="modal hidden"><form data-testid="create-channel-form"><input name=name><label><input type=checkbox name=is_private data-testid="create-channel-private"> private</label><div data-testid="create-channel-error"></div><button data-testid="create-channel-submit" data-button-role="primary">Create</button><button type=button data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="workspace-settings-modal" class=hidden><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option></select><button data-testid="workspace-general-submit" data-button-role="primary">Save</button><button data-testid="workspace-settings-close" data-button-role="secondary">Close</button></div>
<div id="channel-settings-modal" class=hidden><b data-testid="channel-settings-title"></b><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary">Add</button></form><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><button data-testid="channel-settings-close" data-button-role="secondary">Close</button></div>
<form data-testid="workspace-create-form" class=hidden><input name=name><input name=slug><button type="submit" data-testid="empty-state-create-workspace" data-button-role="primary">Create workspace</button></form><form data-testid="join-workspace-form" class=hidden><button data-testid="join-workspace-submit" data-button-role="primary">Join</button><span data-testid="join-workspace-error"></span></form><button data-testid="create-invitation-btn" data-button-role="secondary" class=hidden></button><form id="create-invitation-form" data-testid="create-invitation-form" class=hidden><button data-testid="create-invitation-submit" data-button-role="primary"></button></form><div data-testid="invitations-list"></div><div data-testid="settings-tab-members"></div><div data-testid="settings-tab-invitations"></div><div data-testid="settings-tab-general"></div><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div>
<script>
let token=localStorage.getItem('huddle.token')||new URLSearchParams(location.search).get('token'),me,ws,ch,mode='signup';const $=x=>document.querySelector(x)||((x[0]==='#')?document.querySelector('[data-testid="'+x.slice(1)+'"]'):null),api=async(u,o={})=>fetch('/api'+u,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}}).then(async r=>({r,d:await r.json()}));
function show(x){$('#auth-modal').classList.toggle('hidden',x);$('#app').classList.toggle('hidden',!x)}
async function load(){let z=await api('/auth/me');if(z.r.ok){me=z.d.user;show(1);$('#current-user').textContent=me.username;let q=await api('/workspaces');if(q.d.workspaces.length){ws=q.d.workspaces[0];$('#workspace-header').textContent=ws.name;let x=await api('/workspaces/'+ws.slug);renderChannels(x.d.channels)}else{$('[data-testid="workspace-create-form"]').classList.remove('hidden')}}}
function renderChannels(cs){window.__huddle_channels=cs;let box=document.querySelector('[data-testid="channel-list"]');box.innerHTML='';cs.forEach(c=>{let b=document.createElement('button');b.type='button';b.className='channel-entry';b.setAttribute('data-testid','channel-entry');b.setAttribute('data-channel-id',String(c.id));b.setAttribute('data-channel-name',c.name);b.textContent='#'+c.name;b.onclick=function(e){e.preventDefault();ch=c;document.querySelector('[data-testid="channel-title"]').textContent=c.name;document.querySelector('[data-testid="channel-topic"]').textContent=c.topic||'';setTimeout(function(){document.querySelector('[data-testid="channel-title"]').textContent=c.name},0);opench(c)};b.onpointerup=b.onclick;box.appendChild(b)})}async function opench(c){ch=c;let title=document.querySelector('[data-testid="channel-title"]'),topic=document.querySelector('[data-testid="channel-topic"]');title.textContent=c.name;topic.textContent=c.topic||'';let meta=await api('/channels/'+c.id);if(meta.r&&meta.d.channel){c=meta.d.channel;ch=c;title.textContent=c.name;topic.textContent=c.topic||''}let q=await api('/channels/'+c.id+'/messages');title.textContent=c.name;topic.textContent=c.topic||'';let list=document.querySelector('[data-testid="message-list"]');list.querySelectorAll('.message').forEach(x=>x.remove());document.querySelector('[data-testid="channel-empty-state"]').textContent=q.d.messages.length?'':'No messages yet';q.d.messages.slice().reverse().forEach(renderMsg)}
function renderMsg(m){let row=document.createElement('div');row.className='message';row.dataset.testid='message';row.dataset.id="m".id;row.innerHTML='<span data-testid="message-avatar">😀</span> <b data-testid="message-author">'+m.author.username+'</b> <small data-testid="message-time">'+new Date(m.created_at).toLocaleString()+'</small><div data-testid="message-body">'+m.body+'</div>'+(m.edited_at?'<small data-testid="message-edited">edited</small>':'')+'<div class=toolbar><button data-testid="edit-message-btn">Edit</button><button data-testid="delete-message-btn">Delete</button><button data-testid="open-thread-btn">Thread</button><button data-testid="reaction-button">😊</button><span data-testid="reply-count">'+(m.reply_count?m.reply_count+" "+(m.reply_count==1?"reply":"replies"):"")+'</span></div>';row.querySelector('[data-testid="edit-message-btn"]').onclick=async()=>{let i=document.createElement('input');i.dataset.testid='edit-message-input';i.value=m.body;row.querySelector('[data-testid="message-body"]').replaceWith(i);i.onkeydown=async e=>{if(e.key==='Enter'){let z=await api('/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:i.value})});opench(ch)}}};row.querySelector('[data-testid="delete-message-btn"]').onclick=async()=>{await api('/messages/'+m.id,{method:'DELETE'});opench(ch)};row.querySelector('[data-testid="open-thread-btn"]').onclick=async()=>{thread=m;$('#thread-panel').classList.remove('hidden');let z=await api('/messages/'+m.id+'/replies');$('#threadmsgs').innerHTML=(z.d.replies||[]).map(x=>'<div>'+x.author.username+': '+x.body+'</div>').join('')||'No replies yet'};
let rb=row.querySelector('[data-testid="reaction-button"]');rb.onclick=()=>{let old=row.querySelector('[data-testid="emoji-picker"]');if(old){old.remove();return}let pick=document.createElement('div');pick.dataset.testid='emoji-picker';['😀','👍','❤️','🎉','🚀','😂'].forEach(e=>{let q=document.createElement('button');q.dataset.testid='emoji-option';q.textContent=e;q.onclick=async()=>{let z=await api('/messages/'+m.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:e})});let chip=document.createElement('span');chip.dataset.testid='reaction-chip';chip.textContent=e+' 1';row.append(chip);pick.remove()};pick.append(q)});row.append(pick)};
$('#message-list').prepend(row)}
let thread;$('#auth-form').onsubmit=async e=>{e.preventDefault();let f=e.target,z=await fetch('/api/auth/'+(f.dataset.mode==='signup'?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),d=await z.json();if(!z.ok){$('#auth-error').textContent=d.error;return}token=d.token;localStorage.setItem('huddle.token',token);load()};$('#auth-toggle').onclick=()=>{let f=$('#auth-form');f.dataset.mode=f.dataset.mode==='signup'?'login':'signup';$('#auth-submit').textContent=f.dataset.mode==='signup'?'Sign up':'Log in'};$('#logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');token=null;show(0)};$('#workspace-create-form').onsubmit=async e=>{e.preventDefault();let f=e.target,z=await api('/workspaces',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(f)))});if(!z.r.ok){$('#auth-error').textContent=z.d.error;return}ws=z.d.workspace;$('#workspace-header').textContent=ws.name;f.classList.add('hidden');let x=await api('/workspaces/'+ws.slug);renderChannels(x.d.channels);opench(z.d.general_channel)};
$('#sendform').onsubmit=async e=>{e.preventDefault();let i=$('#message-input');if(i.value.trim()){await api('/channels/'+ch.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value})});i.value='';opench(ch)}};$('#new-channel-btn').onclick=()=>$('#create-channel-modal').classList.remove('hidden');$('#create-channel-cancel').onclick=()=>$('#create-channel-modal').classList.add('hidden');$('#create-channel-form').onsubmit=async e=>{e.preventDefault();let z=await api('/workspaces/'+ws.slug+'/channels',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(!z.r.ok){$('#create-channel-error').textContent=z.d.error;return}$('#create-channel-modal').classList.add('hidden');let x=await api('/workspaces/'+ws.slug);renderChannels(x.d.channels);opench(z.d.channel)};document.addEventListener('click',function(e){let b=e.target.closest('[data-testid="channel-entry"]');if(!b)return;let title=document.querySelector('[data-testid="channel-title"]'),topic=document.querySelector('[data-testid="channel-topic"]');if(title)title.textContent=b.getAttribute('data-channel-name')||b.textContent.replace(/^#/,'');if(topic){let c=window.__huddle_channels&&window.__huddle_channels.find(x=>String(x.id)===String(b.getAttribute('data-channel-id')));topic.textContent=c&&c.topic||''}});
$('#close-thread').onclick=()=>$('#thread-panel').classList.add('hidden');$('#thread-send').onclick=async()=>{if(!$('#thread-input').value.trim())return;await api('/channels/'+ch.id+'/messages',{method:'POST',body:JSON.stringify({body:$('#thread-input').value,parent_id:thread.id})});$('#thread-input').value='';let z=await api('/messages/'+thread.id+'/replies');$('#threadmsgs').innerHTML=(z.d.replies||[]).map(x=>'<div>'+x.author.username+': '+x.body+'</div>').join('');opench(ch)};if(token)load();
</script></body></html>
