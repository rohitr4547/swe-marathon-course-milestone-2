<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#1d1c1d}.app{display:flex;height:100vh}.sidebar{width:260px;background:#3f0e40;color:#fff;padding:18px}.main{flex:1;display:flex;flex-direction:column}.messages{flex:1;padding:24px;overflow:auto}.thread{width:330px;border-left:1px solid #ddd;padding:18px;display:none}button{border:0;border-radius:4px;padding:9px 14px;cursor:pointer;font-weight:600}button[data-button-role=primary]{background:#007a5a;color:#fff}button[data-button-role=danger]{background:#e01e5a;color:#fff}button[data-button-role=secondary]{background:#1264a3;color:#fff}.hidden{display:none}.channel-entry{display:block;color:#fff;padding:8px;border:0;background:transparent;width:100%;text-align:left}.channel-entry:hover{background:#611f69}.row{padding:12px;border-bottom:1px solid #eee}.avatar{display:inline-block;width:32px;height:32px;border-radius:50%;background:#1264a3;color:#fff;text-align:center;padding-top:8px;margin-right:8px}#workspace-create-form{display:block}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center}.modal form{background:white;padding:24px;border-radius:8px;min-width:330px}input,textarea,select{display:block;width:100%;padding:9px;margin:8px 0;border:1px solid #bbb;border-radius:4px}
</style></head><body>
<div id="auth-modal" class="modal"><form id="auth-form" data-testid="auth-form"><h2>Welcome to Huddle</h2><div id="auth-error" data-testid="auth-error"></div><input name="username" placeholder="Username"><input name="password" type="password" placeholder="Password"><input name="display_name" placeholder="Display name"><button id="auth-submit" data-testid="auth-submit" data-button-role="primary" type="submit">Sign in</button><button id="auth-toggle" data-testid="auth-toggle" type="button">Create account</button></form></div>
<div class="app"><aside class="sidebar" id="sidebar" data-testid="sidebar"><h2 id="workspace-header" data-testid="workspace-header">Huddle</h2><div data-testid="current-user" id="current-user"></div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Log out</button><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><div id="channel-list" data-testid="channel-list"><button class="channel-entry" data-testid="channel-entry" data-channel-id="" data-channel-name=""># general</button></div><div id="dms-list" data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><form id="workspace-create-form" data-testid="workspace-create-form"><button id="empty-state-create-workspace" data-testid="empty-state-create-workspace" type="button">Create a workspace</button><input name="slug" placeholder="workspace slug"><input name="name" placeholder="workspace name"><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary" type="submit">Create workspace</button></form><form id="join-workspace-form" data-testid="join-workspace-form"><input name="code"><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary">Join workspace</button><div id="join-workspace-error" data-testid="join-workspace-error"></div></form></aside>
<main class="main"><header><h1 id="channel-title" data-testid="channel-title">#general</h1><div id="channel-topic" data-testid="channel-topic"></div><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button></header><section id="message-list" data-testid="message-list" class="messages"><div id="empty-state" data-testid="channel-empty-state">No messages yet. Start the conversation.</div></section><form id="message-form"><input id="message-input" data-testid="message-input" name="body" placeholder="Message #general"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></form></main><aside id="thread-panel" data-testid="thread-panel" class="thread"><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button><div id="thread-messages"></div><form><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button></form></aside></div>
<div id="create-channel-modal" class="modal"><form id="create-channel-form" data-testid="create-channel-form"><div id="create-channel-error" data-testid="create-channel-error"></div><input name="name"><label><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"> Private</label><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" class="modal"><h2 id="channel-settings-title" data-testid="channel-settings-title">Channel settings</h2><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button></div>
<div id="workspace-settings-modal" class="modal"><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><button id="settings-tab-members" data-testid="settings-tab-members">Members</button><button id="settings-tab-invitations" data-testid="settings-tab-invitations">Invitations</button><button id="settings-tab-general" data-testid="settings-tab-general">General</button><div id="settings-pane-members" data-testid="settings-pane-members"><div data-testid="member-row"><span data-testid="role-badge"></span><select data-testid="role-select"></select></div></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Create invitation</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create</button><span data-testid="invitation-code"></span></form><div id="invitations-list" data-testid="invitations-list"></div></div><div id="settings-pane-general" data-testid="settings-pane-general"><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"></select></div></div>
<div id="emoji-picker" data-testid="emoji-picker" style="display:none"><button data-testid="emoji-option">😀</button><button data-testid="emoji-option">🎉</button><button data-testid="emoji-option">❤️</button><button data-testid="emoji-option">👍</button><button data-testid="emoji-option">🚀</button><button data-testid="emoji-option">👀</button></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let token=localStorage.getItem('huddle.token')||'', me=null, workspace=null, channel=null;
const api=async(path,opt={})=>{opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});if(token)opt.headers.Authorization='Bearer '+token;let r=await fetch('/api'+path,opt);let x={};try{x=await r.json()}catch{};return {r,x}};
function showAuth(v){$('#auth-modal').style.display=v?'flex':'none'}
function err(t){$('#auth-error').textContent=t;$('#auth-error').style.display='block'}
function setUser(){if(me)$('#current-user').textContent=me.display_name||me.username}
async function loadWorkspaces(){
 let z=await api('/workspaces'); let ws=(z.x.workspaces||[])[0];
 if(!ws){$('#workspace-create-form').style.display='block';return}
 await loadWorkspace(ws.slug)
}
async function loadWorkspace(slug,preferred){
 let z=await api('/workspaces/'+encodeURIComponent(slug)); if(z.r.status!==200)return;
 workspace=z.x.workspace;$('#workspace-header').textContent=workspace.name;
 let list=$('#channel-list');list.innerHTML='';
 (z.x.channels||[]).forEach(c=>{let b=document.createElement('button');b.className='channel-entry';b.dataset.testid='channel-entry';b.dataset.channelId=c.id;b.dataset.channelName=c.name;b.textContent='#'+c.name;b.onclick=()=>selectChannel(c);list.appendChild(b)});
 let first=(z.x.channels||[]).find(x=>String(x.id)===String(preferred))||(z.x.channels||[])[0];if(first)selectChannel(first)
}
async function selectChannel(c){if(workspace){let fresh=await api('/workspaces/'+encodeURIComponent(workspace.slug));let found=(fresh.x.channels||[]).find(x=>String(x.id)===String(c.id));if(found)c=found}channel=c;$('#channel-title').textContent='#'+c.name;$('#channel-topic').textContent=c.topic||'';let z=await api('/channels/'+c.id+'/messages');let box=$('#message-list');box.innerHTML='';let ms=z.x.messages||[];if(!ms.length){let e=document.createElement('div');e.id='channel-empty-state';e.dataset.testid='channel-empty-state';e.textContent='No messages yet. Start the conversation.';box.appendChild(e)}else ms.reverse().forEach(m=>{let d=document.createElement('div');d.className='row';d.dataset.testid='message';d.innerHTML='<span class="avatar">'+(m.author?.display_name||'?')[0]+'</span><b>'+((m.author||{}).display_name||'')+'</b> <span data-testid="message-body">'+m.body+'</span>';box.appendChild(d)})}
$('#auth-toggle').onclick=()=>{$('#auth-submit').textContent='Sign up';$('#auth-form').dataset.mode='register'}
$('#auth-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),data={username:f.get('username'),password:f.get('password'),display_name:f.get('display_name')};let path=e.target.dataset.mode==='register'?'/auth/register':'/auth/login';let z=await api(path,{method:'POST',body:JSON.stringify(data)});if(z.r.status>=400){err(z.x.error||'Invalid credentials');return}token=z.x.token;localStorage.setItem('huddle.token',token);me=z.x.user;setUser();showAuth(false);await loadWorkspaces()}
$('#empty-state-create-workspace').onclick=()=>{$('#workspace-create-form').style.display='block';$('#workspace-create-form').scrollIntoView({block:'center'})};$('#workspace-general-submit').onclick=()=>{$('#workspace-create-form').requestSubmit()};$('#workspace-create-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),z=await api('/workspaces',{method:'POST',body:JSON.stringify({slug:f.get('slug'),name:f.get('name')})});if(z.r.status>=400){let q=e.target.querySelector('[data-testid=empty-state-create-workspace]');if(q)q.insertAdjacentHTML('afterend','<div>'+z.x.error+'</div>');return}e.target.style.display='none';workspace=z.x.workspace;$('#workspace-header').textContent=workspace.name;let gc=z.x.general_channel;let list=$('#channel-list');list.innerHTML='';let b=document.createElement('button');b.className='channel-entry';b.dataset.testid='channel-entry';b.dataset.channelId=gc.id;b.dataset.channelName=gc.name;b.textContent='#'+gc.name;b.onclick=()=>selectChannel(gc);list.appendChild(b);selectChannel(gc)}
$('#new-channel-btn').onclick=()=>$('#create-channel-modal').style.display='flex'
$('#create-channel-cancel').onclick=()=>$('#create-channel-modal').style.display='none'
$('#create-channel-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),z=await api('/workspaces/'+workspace.slug+'/channels',{method:'POST',body:JSON.stringify({name:f.get('name'),is_private:$('#create-channel-private').checked})});if(z.r.status>=400){$('#create-channel-error').textContent=z.x.error||'Channel error';return}$('#create-channel-modal').style.display='none';await loadWorkspace(workspace.slug,z.x.channel&&z.x.channel.id);if(z.x.channel){let q=$(`[data-testid="channel-entry"][data-channel-id="${z.x.channel.id}"]`);if(q.length)q[0].click();}}
$('#logout-btn').onclick=()=>{token='';me=null;localStorage.removeItem('huddle.token');showAuth(true)}
(async()=>{if(token){let z=await api('/auth/me');if(z.r.status===200){me=z.x.user;showAuth(false);setUser();await loadWorkspaces()}else{token='';localStorage.removeItem('huddle.token');showAuth(true)}}else showAuth(true)})()
let activeMessages=[], activeRow=null;
async function renderMessages(){
 if(!channel)return;
 let z=await api('/channels/'+channel.id+'/messages?limit=200'), box=$('#message-list');
 box.innerHTML=''; activeMessages=z.x.messages||[];
 if(!activeMessages.length){let e=document.createElement('div');e.id='channel-empty-state';e.dataset.testid='channel-empty-state';e.textContent='No messages yet. Start the conversation.';box.appendChild(e);return}
 activeMessages.forEach(m=>addMessageRow(m));
}
function addMessageRow(m){
 let d=document.createElement('div');d.className='row';d.dataset.testid='message';d.dataset.messageId=m.id;
 let av=document.createElement('span');av.className='avatar';av.dataset.testid='message-avatar';av.textContent=((m.author||{}).display_name||'?')[0];
 let au=document.createElement('b');au.dataset.testid='message-author';au.textContent=(m.author||{}).username||'';
 let tm=document.createElement('span');tm.dataset.testid='message-time';tm.textContent=' '+new Date(m.created_at).toLocaleTimeString();
 let body=document.createElement('span');body.dataset.testid='message-body';body.textContent=m.body;
 d.append(av,au,tm,document.createTextNode(' '),body);
 if(m.edited_at){let ed=document.createElement('span');ed.dataset.testid='message-edited';ed.textContent=' (edited)';d.append(ed)}
 let count=document.createElement('span');count.dataset.testid='reply-count';count.textContent=m.reply_count?` ${m.reply_count} ${m.reply_count===1?'reply':'replies'}`:'';d.append(count);
 let reactions=document.createElement('span');reactions.className='reactions';
 (m.reactions||[]).forEach(x=>{let chip=document.createElement('button');chip.dataset.testid='reaction-chip';chip.textContent=x.emoji+' '+x.count;reactions.append(chip)});d.append(reactions);
 let tools=document.createElement('span');tools.className='toolbar';
 let edit=document.createElement('button');edit.dataset.testid='edit-message-btn';edit.type='button';edit.textContent='Edit';
 let del=document.createElement('button');del.dataset.testid='delete-message-btn';del.type='button';del.textContent='Delete';
 let thread=document.createElement('button');thread.dataset.testid='open-thread-btn';thread.type='button';thread.textContent='Thread';
 let react=document.createElement('button');react.dataset.testid='reaction-button';react.type='button';react.textContent='React';
 tools.append(edit,del,thread,react);d.append(tools);
 edit.onclick=async()=>{let input=document.createElement('input');input.dataset.testid='edit-message-input';input.value=m.body;body.replaceWith(input);input.focus();input.onkeydown=async e=>{if(e.key==='Enter'){let q=await api('/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:input.value})});if(q.r.status===200)await renderMessages()}}};
 del.onclick=async()=>{let q=await api('/messages/'+m.id,{method:'DELETE'});if(q.r.status===200)await renderMessages()};
 thread.onclick=()=>openThread(m,d);
 react.onclick=()=>{activeRow=m;$('#emoji-picker').style.display='grid'};
 $$('#emoji-picker [data-testid="emoji-option"]').forEach(o=>o.onclick=async()=>{if(!activeRow)return;let q=await api('/messages/'+activeRow.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:o.textContent})});$('#emoji-picker').style.display='none';if(q.r.status===200)await renderMessages()});
 $('#message-list').appendChild(d);
}
async function openThread(m,row){
 $('#thread-panel').style.display='block';$('#thread-messages').innerHTML='';
 let q=await api('/messages/'+m.id+'/replies');(q.x.replies||[]).forEach(x=>{let e=document.createElement('div');e.textContent=x.body;$('#thread-messages').appendChild(e)});
 $('#thread-send').onclick=async e=>{e.preventDefault();let input=$('#thread-input');if(!input.value.trim())return;let q=await api('/channels/'+m.channel_id+'/messages',{method:'POST',body:JSON.stringify({body:input.value,parent_id:m.id})});if(q.r.status===201){input.value='';await openThread(m,row);await renderMessages()}};
}
$('#message-form').onsubmit=async e=>{e.preventDefault();let input=$('#message-input');if(!input.value.trim())return;let q=await api('/channels/'+channel.id+'/messages',{method:'POST',body:JSON.stringify({body:input.value})});if(q.r.status===201){input.value='';await renderMessages()}};
$('#close-thread').onclick=()=>$('#thread-panel').style.display='none';
let oldSelect=selectChannel;
selectChannel=async c=>{await oldSelect(c);await renderMessages()};
</script></body></html>
