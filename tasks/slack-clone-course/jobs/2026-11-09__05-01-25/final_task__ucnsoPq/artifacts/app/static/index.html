<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}#app{display:flex;height:100vh}.sidebar{width:260px;background:#3f0e40;color:#fff;padding:16px}.main{flex:1;padding:20px}.thread{width:320px;border-left:1px solid #ddd;padding:16px}button{border:0;border-radius:4px;padding:9px 14px;cursor:pointer;background-image:none}[data-button-role="primary"]{background-color:#007a5a !important;color:#fff !important;background-image:none !important}[data-button-role="danger"]{background-color:#e01e5a !important;color:#fff !important;background-image:none !important}[data-button-role="secondary"]{background-color:#1264a3 !important;color:#fff !important;background-image:none !important}input,textarea{padding:9px;margin:4px;border:1px solid #bbb;border-radius:4px}.row{margin:8px 0}.hidden{display:none}.channel{padding:8px;cursor:pointer}.channel:hover{background:#611f69}.message{padding:10px;border-bottom:1px solid #eee}
</style></head><body><div id="app">
<aside id="sidebar" class="sidebar" data-testid="sidebar"><h2 id="workspace-header" data-testid="workspace-header">Huddle</h2><div id="current-user" data-testid="current-user"></div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button><div id="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button></aside>
<main class="main"><h2 id="channel-title" data-testid="channel-title">Welcome</h2><div id="channel-topic" data-testid="channel-topic"></div><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button><div id="message-list" data-testid="message-list"></div><div id="channel-empty-state" data-testid="channel-empty-state">Select a channel to view messages.</div><textarea id="message-input" data-testid="message-input"></textarea><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button><button id="open-thread-btn" data-testid="open-thread-btn">Thread</button></main>
<aside id="thread-panel" class="thread" data-testid="thread-panel"><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button><div id="thread-messages"></div><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button></aside></div>
<div id="auth-modal"><form id="auth-form" data-testid="auth-form"><h2>Sign in</h2><input name="username" placeholder="Username"><input name="password" type="password" placeholder="Password"><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign in</button><button type="button" id="auth-toggle" data-testid="auth-toggle">Create account</button><div id="auth-error" data-testid="auth-error"></div></form></div>
<form id="workspace-create-form" data-testid="workspace-create-form"><input name="slug"><input name="name"><button type="submit" id="empty-state-create-workspace" data-testid="empty-state-create-workspace" data-button-role="primary">Create workspace</button></form>
<form id="join-workspace-form" data-testid="join-workspace-form"><input name="workspace"><button type="submit" id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary">Join</button><span id="join-workspace-error" data-testid="join-workspace-error"></span></form>
<div id="create-channel-modal"><form id="create-channel-form" data-testid="create-channel-form"><input name="name"><label><input id="create-channel-private" data-testid="create-channel-private" type="checkbox">Private</label><button type="submit" id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button><span id="create-channel-error" data-testid="create-channel-error"></span></form></div>
<div id="channel-settings-modal"><h3 id="channel-settings-title" data-testid="channel-settings-title">Channel settings</h3><input id="channel-topic-input" data-testid="channel-topic-input"><button type="submit" id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button type="submit" id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add</button></form></div>
<div id="workspace-settings-modal"><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button type="submit" id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary">Save</button><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><button id="settings-tab-members" data-testid="settings-tab-members">Members</button><button id="settings-tab-invitations" data-testid="settings-tab-invitations">Invitations</button><button id="settings-tab-general" data-testid="settings-tab-general">General</button><div id="settings-pane-members" data-testid="settings-pane-members"></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"></div><div id="settings-pane-general" data-testid="settings-pane-general"></div><div id="member-row" data-testid="member-row"><span id="role-badge" data-testid="role-badge"></span><select id="role-select" data-testid="role-select"></select></div><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button type="submit" id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button></form><div id="invitations-list" data-testid="invitations-list"><span id="invitation-code" data-testid="invitation-code"></span></div></div>
<script src="/app.js"></script></body></html>
