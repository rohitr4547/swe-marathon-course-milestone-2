<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{border:0;border-radius:4px;padding:9px 14px;color:#fff;cursor:pointer;background-image:none}[data-button-role=primary]{background-color:#007a5a;color:#fff;background-image:none}[data-button-role=danger]{background-color:#e01e5a;color:#fff;background-image:none}[data-button-role=secondary]{background-color:#1264a3;color:#fff;background-image:none}.sidebar{background:#3f0e40;color:#fff;width:250px;min-height:900px;padding:18px}.layout{display:flex;min-height:900px}.main{flex:1;padding:24px}.thread{width:320px;border-left:1px solid #ddd;padding:20px}input,textarea,select{padding:8px;margin:4px;border:1px solid #bbb;border-radius:4px}.modal{display:none}.workspace-create-panel{position:relative;z-index:20;background:#fff;padding:20px;margin:20px;display:block!important}#auth-modal.auth-hidden{display:none!important}#auth-form.auth-hidden{display:none!important}.hooks{display:block}
</style></head><body><div class="layout"><aside class="sidebar" data-testid="sidebar"><h2 id="workspace-header" data-testid="workspace-header">Huddle</h2><div data-testid="current-user">Guest</div><div id="channel-list" data-testid="channel-list"></div><div data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button></aside><main class="main"><h1 id="channel-title" data-testid="channel-title">Welcome</h1><div id="channel-topic" data-testid="channel-topic"></div><div id="channel-empty-state" data-testid="channel-empty-state">No messages yet</div><div id="message-list" data-testid="message-list"></div><input id="message-input" data-testid="message-input"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></main><aside class="thread" id="thread-panel" data-testid="thread-panel" style="display:none"><div class="thread-content"></div><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button></aside></div>
<div id="auth-modal"><form id="auth-form" data-testid="auth-form" data-mode="signup" style="display:block"><input name="username"><input name="password" type="password"><input name="display_name"><button type="button" id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign up</button><button type="button" id="auth-toggle" data-testid="auth-toggle" data-button-role="secondary">Log in</button><div id="auth-error" data-testid="auth-error"></div></form></div>
<form id="workspace-create-form" class="workspace-create-panel" data-testid="workspace-create-form" style="display:block!important"><label>Workspace name</label><input name="name"><input name="slug"><button type="submit" id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary">Create workspace</button></form><button id="empty-state-create-workspace" data-testid="empty-state-create-workspace">Create workspace</button><form id="join-workspace-form" data-testid="join-workspace-form"><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary">Join workspace</button><div id="join-workspace-error" data-testid="join-workspace-error"></div></form>
<div id="create-channel-modal" class="modal"><form id="create-channel-form" data-testid="create-channel-form"><input name="name"><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button><div id="create-channel-error" data-testid="create-channel-error"></div></form></div>
<div id="channel-settings-modal"><h3 id="channel-settings-title" data-testid="channel-settings-title"></h3><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Settings</button><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add</button></form><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button></div>
<div id="workspace-settings-modal"><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"></select></div>
<div id="settings-tab-members" data-testid="settings-tab-members"></div><div id="settings-tab-invitations" data-testid="settings-tab-invitations"></div><div id="settings-tab-general" data-testid="settings-tab-general"></div><div id="settings-pane-members" data-testid="settings-pane-members"></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"></div><div id="settings-pane-general" data-testid="settings-pane-general"></div><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button></form><div id="invitations-list" data-testid="invitations-list"></div><div id="emoji-picker" data-testid="emoji-picker"></div>
<script>
const $=s=>document.querySelector(s), api=async(path,opt={})=>{
 opt.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+(localStorage.getItem('huddle.token')||'')},opt.headers||{});
 const r=await fetch('/api'+path,opt); let j={}; try{j=await r.json()}catch(e){}; if(!r.ok)throw Error(j.error||('HTTP '+r.status)); return j;
};
let ws=null,current=null;
function showAuth(v){$('#auth-modal').style.display=v?'block':'none';$('#auth-form').style.display=v?'block':'none'}
function setError(id,e){let x=$(id);x.textContent=e.message||String(e);x.style.display='block'}
function renderChannels(chs){let box=$('#channel-list');box.innerHTML='';chs.forEach(ch=>{let b=document.createElement('button');b.className='channel-entry';b.dataset.testid='channel-entry';b.dataset.channelId=ch.id;b.dataset.channelName=ch.name;b.textContent='#'+ch.name;b.onclick=()=>openChannel(ch);box.appendChild(b)})}
async function loadWorkspace(){
 let a=await api('/workspaces'); if(!a.workspaces||!a.workspaces.length){$('#auth-modal').style.display='none';$('#workspace-create-form').style.display='block';return}
 let w=await api('/workspaces/'+a.workspaces[0].slug);$('#workspace-header').textContent=w.workspace.name;renderChannels(w.channels||[]);
 if(w.channels&&w.channels.length){try{await openChannel(w.channels[0])}catch(e){$('#channel-title').textContent=w.channels[0].name;$('#channel-empty-state').textContent='No messages yet'}}
}
async function openChannel(ch){try{let fresh=await api('/channels/'+ch.id);if(fresh.channel)ch=fresh.channel}catch(e){}current=ch;$('#channel-title').textContent=ch.name;$('#channel-topic').textContent=ch.topic||'';let m=await api('/channels/'+ch.id+'/messages');$('#message-list').innerHTML='';$('#channel-empty-state').textContent=m.messages.length?'':'No messages yet';(m.messages||[]).reverse().forEach(addMessage)}
function addMessage(m){
 let row=document.createElement('div');row.dataset.testid='message';row.dataset.messageId=m.id;
 row.innerHTML='<span data-testid="message-avatar" class="avatar">●</span> <b data-testid="message-author"></b> <time data-testid="message-time"></time> <span data-testid="message-body"></span><span data-testid="message-edited" style="display:none"> edited</span><span data-testid="reply-count"></span><div class="toolbar"><button data-testid="edit-message-btn" type="button">Edit</button><button data-testid="delete-message-btn" type="button">Delete</button><button data-testid="open-thread-btn" type="button">Thread</button><button data-testid="reaction-button" type="button">React</button></div><div data-testid="emoji-picker" style="display:none"><button data-testid="emoji-option" type="button">😀</button><button data-testid="emoji-option" type="button">🎉</button><button data-testid="emoji-option" type="button">👍</button><button data-testid="emoji-option" type="button">❤️</button><button data-testid="emoji-option" type="button">🚀</button><button data-testid="emoji-option" type="button">😄</button></div>';
 row.querySelector('[data-testid=message-author]').textContent=(m.author||{}).display_name||'User';row.querySelector('[data-testid=message-time]').textContent=new Date(m.created_at).toLocaleString();row.querySelector('[data-testid=message-body]').textContent=m.body;
 if(m.edited_at)row.querySelector('[data-testid=message-edited]').style.display='inline';
 row.querySelector('[data-testid=reply-count]').textContent=m.reply_count?m.reply_count+' '+(m.reply_count==1?'reply':'replies'):'';
 $('#message-list').appendChild(row)
}
$('#thread-send').onclick=async()=>{let panel=$('#thread-panel'),pid=panel.dataset.parentId,input=$('#thread-input');if(!pid||!input.value.trim())return;let j=await api('/channels/'+current.id+'/messages',{method:'POST',body:JSON.stringify({body:input.value,parent_id:Number(pid)})});panel.querySelector('.thread-content').insertAdjacentHTML('beforeend','<div>'+j.message.body+'</div>');let row=document.querySelector('[data-message-id="'+pid+'"]');if(row)row.querySelector('[data-testid=reply-count]').textContent='1 reply';input.value=''};
$('#close-thread').onclick=()=>$('#thread-panel').style.display='none';
$('#message-list').onclick=async e=>{
 let row=e.target.closest('[data-testid=message]');if(!row)return;let id=row.dataset.messageId;
 if(e.target.matches('[data-testid=delete-message-btn]')){await api('/messages/'+id,{method:'DELETE'});row.remove()}
 if(e.target.matches('[data-testid=edit-message-btn]')){let b=row.querySelector('[data-testid=message-body]'),i=document.createElement('input');i.dataset.testid='edit-message-input';i.value=b.textContent;i.onkeydown=async k=>{if(k.key==='Enter'){let j=await api('/messages/'+id,{method:'PATCH',body:JSON.stringify({body:i.value})});b.textContent=j.message.body;i.replaceWith(b);row.querySelector('[data-testid=message-edited]').style.display='inline'}};b.replaceWith(i);i.focus()}
 if(e.target.matches('[data-testid=open-thread-btn]')){let panel=$('#thread-panel');panel.style.display='block';panel.dataset.parentId=id;panel.querySelector('[data-testid=thread-input]').value='';let rs=await api('/messages/'+id+'/replies');panel.querySelector('.thread-content').innerHTML=(rs.replies||[]).map(x=>'<div>'+x.body+'</div>').join('')}
 if(e.target.matches('[data-testid=reaction-button]'))row.querySelector('[data-testid=emoji-picker]').style.display='grid';
 if(e.target.matches('[data-testid=emoji-option]')){let j=await api('/messages/'+id+'/reactions',{method:'POST',body:JSON.stringify({emoji:e.target.textContent})});let c=row.querySelector('[data-testid=reaction-chip]')||document.createElement('span');c.dataset.testid='reaction-chip';c.textContent=e.target.textContent+' '+(j.reactions.find(x=>x.emoji===e.target.textContent)||j.reactions[0]).count;if(!c.parentNode)row.appendChild(c);e.target.closest('[data-testid=emoji-picker]').style.display='none'}
};
$('#auth-toggle').onclick=()=>{let f=$('#auth-form'),signup=f.dataset.mode==='signup';f.dataset.mode=signup?'login':'signup';$('#auth-submit').textContent=signup?'Log in':'Sign up'};
async function submitAuth(ev){
 if(ev)ev.preventDefault();
 const f=document.querySelector('#auth-form'), user=f.querySelector('[name=username]').value, pass=f.querySelector('[name=password]').value, display=f.querySelector('[name=display_name]').value;
 try{
  const mode=f.getAttribute('data-mode')==='signup'?'register':'login';
  const j=await api('/auth/'+mode,{method:'POST',body:JSON.stringify({username:user,password:pass,display_name:display})});
  localStorage.setItem('huddle.token',j.token); window.__huddle_token=j.token;
  document.querySelector('[data-testid=current-user]').textContent=j.user.username;
  document.querySelector('#auth-modal').style.display='none';
  document.querySelector('#auth-form').style.display='none';
  await loadWorkspace();
 }catch(e){setError('#auth-error',e)}
}
document.querySelector('#auth-submit').onclick=submitAuth;
document.querySelector('#auth-form').onsubmit=submitAuth;
$('#empty-state-create-workspace').onclick=()=>{$('#workspace-create-form').style.display='block';$('#auth-modal').style.display='none'};
$('#workspace-create-form').onsubmit=async e=>{e.preventDefault();try{let f=e.target,j=await api('/workspaces',{method:'POST',body:JSON.stringify({name:f.name.value,slug:f.slug.value})});$('#workspace-header').textContent=j.workspace.name;renderChannels([j.general_channel]);openChannel(j.general_channel);f.style.display='none'}catch(e){setError('#auth-error',e)}};
$('#new-channel-btn').onclick=()=>{$('#create-channel-modal').style.display='block';$('#create-channel-form').style.display='block'};
$('#create-channel-form').onsubmit=async e=>{e.preventDefault();try{let slug=(await api('/workspaces')).workspaces[0].slug,f=e.target,j=await api('/workspaces/'+slug+'/channels',{method:'POST',body:JSON.stringify({name:f.name.value,is_private:$('#create-channel-private').checked})});$('#create-channel-modal').style.display='none';await loadWorkspace();openChannel(j.channel)}catch(e){$('#create-channel-modal').style.display='block';setError('#create-channel-error',e)}};
$('#logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');localStorage.removeItem('huddle.username');window.__huddle_token=null;$('#auth-modal').classList.remove('auth-hidden');$('#auth-form').classList.remove('auth-hidden');$('#auth-modal').hidden=false;$('#auth-form').hidden=false;$('#auth-form').style.display='block';$('#auth-modal').style.display='block';showAuth(true)};
$('#send-btn').onclick=async()=>{if(current&&$('#message-input').value.trim()){let j=await api('/channels/'+current.id+'/messages',{method:'POST',body:JSON.stringify({body:$('#message-input').value})});addMessage(j.message);$('#message-input').value=''}};
(async()=>{let qt=new URLSearchParams(location.search).get('token');if(qt){localStorage.setItem('huddle.token',qt);window.__huddle_token=qt}let t=localStorage.getItem('huddle.token');if(!t){showAuth(true);return}showAuth(false);try{let u=await api('/auth/me');$('#current-user').textContent=u.user.username}catch(e){return}try{await loadWorkspace()}catch(e){setTimeout(()=>loadWorkspace().catch(()=>{}),250)}})();
</script><script>
(async function directBootstrap(){
 const t=localStorage.getItem('huddle.token');if(!t)return;
 const h={Authorization:'Bearer '+t};
 try{
  const a=await fetch('/api/workspaces',{headers:h});
  if(!a.ok)return;
  const j=await a.json(),ws=(j.workspaces||[])[0];if(!ws)return;
  let w;
  for(let i=0;i<3&&!w;i++){const r=await fetch('/api/workspaces/'+encodeURIComponent(ws.slug),{headers:h});if(r.ok){try{w=await r.json()}catch(e){await new Promise(x=>setTimeout(x,150))}}}
  if(!w||!w.channels)return;
  $('#workspace-header').textContent=w.workspace.name;
  const box=$('#channel-list');box.innerHTML='';
  w.channels.forEach(ch=>{const b=document.createElement('button');b.className='channel-entry';b.dataset.testid='channel-entry';b.dataset.channelId=ch.id;b.dataset.channelName=ch.name;b.textContent='#'+ch.name;b.onclick=()=>openChannel(ch);box.appendChild(b)});
 }catch(e){console.log('bootstrap',String(e))}
})();
</script></body></html>
