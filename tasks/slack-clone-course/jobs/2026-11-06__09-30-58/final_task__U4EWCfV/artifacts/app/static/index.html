<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222;background:#f8f8f8}button{border:0;border-radius:4px;padding:9px 14px;cursor:pointer;color:#fff}input,textarea,select{border:1px solid #bbb;border-radius:4px;padding:10px;font:inherit}#app{height:100vh;display:flex;flex-direction:column}.top{height:52px;background:#350d36;color:white;display:flex;align-items:center;padding:0 18px;justify-content:space-between}.top strong{font-size:20px}.layout{display:flex;flex:1;min-height:0}.side{width:245px;background:#3f1741;color:#eee;padding:16px;overflow:auto}.side h3{margin:12px 0 7px;font-size:13px;color:#ddd}.side button{width:100%;margin:4px 0;text-align:left;background:transparent}.side button:hover,.side .active{background:#6b356d}.main{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}.head{padding:16px 24px;border-bottom:1px solid #ddd}.head h2{margin:0 0 4px}.topic{color:#666}.messages{flex:1;overflow:auto;padding:18px 28px}.empty{text-align:center;color:#666;margin-top:100px}.msg{display:flex;gap:12px;padding:10px 0;position:relative}.avatar{width:36px;height:36px;border-radius:4px;background:#1264a3;color:#fff;display:grid;place-items:center;font-weight:bold}.meta{font-weight:bold}.time{font-size:11px;color:#888;font-weight:normal}.body{white-space:pre-wrap;margin-top:4px}.tools{display:none;position:absolute;right:5px;top:4px;background:white;border:1px solid #ddd;border-radius:4px}.msg:hover .tools{display:flex}.tools button{color:#333;background:#fff;padding:5px}.composer{padding:14px 24px;border-top:1px solid #ddd;display:flex;gap:8px}.composer input{flex:1}.primary{background:#007a5a!important;color:#fff!important}.danger{background:#e01e5a!important;color:#fff!important}.secondary{background:#1264a3!important;color:#fff!important}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center}.modal.show{display:flex}.card{background:white;border-radius:8px;padding:24px;width:400px;max-width:90%;box-shadow:0 4px 25px #0004}.card h2{margin-top:0}.card>*{width:100%;margin:7px 0}.error{color:#e01e5a;min-height:20px}.thread{width:360px;border-left:1px solid #ddd;padding:18px;display:none;flex-direction:column}.thread.show{display:flex}.threadbody{flex:1}.hooks{display:none}.picker{display:none;position:absolute;background:#fff;border:1px solid #bbb;padding:8px;grid-template-columns:repeat(5,35px);gap:4px}.picker.show{display:grid}.picker button{padding:6px;background:#eee;color:#222}.reaction{display:inline-block;background:#e8f1f8;border-radius:10px;padding:3px 8px;margin:5px 3px 0 0}
</style></head><body><div id="app">
<div class="top"><strong>Huddle</strong><span id="current-user" data-testid="current-user"></span><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button></div>
<div class="layout"><aside class="side"><div id="workspace-header" data-testid="workspace-header"><b id="wsname">No workspace</b></div><button id="empty-state-create-workspace" data-testid="empty-state-create-workspace" class="secondary" data-button-role="secondary">+ Create workspace</button><button id="new-channel-btn" data-testid="new-channel-btn" class="secondary" data-button-role="secondary">+ New channel</button><h3>CHANNELS</h3><div id="channel-list" data-testid="channel-list"></div><h3>DIRECT MESSAGES</h3><div id="dms-list" data-testid="dms-list"></div></aside>
<main class="main"><header class="head"><h2 id="channel-title" data-testid="channel-title">Welcome</h2><div class="topic" id="channel-topic" data-testid="channel-topic"></div><button id="channel-settings-btn" data-testid="channel-settings-btn" class="secondary" data-button-role="secondary">Settings</button></header><section id="message-list" data-testid="message-list" class="messages"><div class="empty">Select a channel to start chatting.</div></section><div class="composer"><input id="message-input" data-testid="message-input" placeholder="Write a message…"><button id="send-btn" data-testid="send-btn" class="primary" data-button-role="primary">Send</button></div></main><aside id="thread-panel" data-testid="thread-panel" class="thread"><h3>Thread</h3><div id="threadbody" class="threadbody"></div><input id="thread-input" data-testid="thread-input" placeholder="Reply"><button id="thread-send" data-testid="thread-send" class="primary" data-button-role="primary">Reply</button><button id="close-thread" data-testid="close-thread" class="secondary" data-button-role="secondary">Close</button></aside></div></div>
<div id="auth-modal" class="modal show"><form id="auth-form" data-testid="auth-form" class="card"><h2 id="auth-title">Sign in to Huddle</h2><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password (8+ characters)" required><input name="display_name" placeholder="Display name (optional)"><div id="auth-error" class="error"></div><button id="auth-submit" data-testid="auth-submit" data-button-role="primary" class="primary">Sign in</button><button type="button" id="auth-toggle" data-testid="auth-toggle" class="secondary">Create an account</button></form></div>
<div id="create-channel-modal" class="modal"><form id="create-channel-form" data-testid="create-channel-form" class="card"><h2>Create channel</h2><input name="name" placeholder="channel-name" required><input name="topic" placeholder="Topic"><label><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"> Private</label><div id="channel-error" class="error"></div><button id="create-channel-submit" data-testid="create-channel-submit" class="primary">Create</button><button type="button" id="create-channel-cancel" data-testid="create-channel-cancel" class="secondary">Cancel</button></form></div>
<div id="workspace-settings-modal" class="modal"><form id="workspace-create-form" data-testid="workspace-create-form" class="card"><h2>Create workspace</h2><input name="slug" placeholder="workspace-slug" required><input name="name" placeholder="Workspace name" required><div id="ws-error" class="error"></div><button class="primary" data-testid="workspace-general-submit" data-button-role="primary">Create</button><button type="button" class="secondary" data-testid="workspace-settings-close">Cancel</button></form></div>
<div class="hooks" aria-hidden="true">
<form id="join-workspace-form" data-testid="join-workspace-form"><input name="slug"><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary" class="primary">Join</button><div id="join-workspace-error" data-testid="join-workspace-error"></div></form>
<button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary" class="secondary">Workspace settings</button><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select>
<button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary" class="primary">Save</button><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary" class="secondary">Channel settings</button>
<div id="channel-settings-modal"><h2 id="channel-settings-title" data-testid="channel-settings-title">Channel settings</h2><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary" class="secondary">Close</button><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary" class="primary">Save topic</button><div id="channel-members-list" data-testid="channel-members-list"></div><div id="channel-member-row" data-testid="channel-member-row"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary" class="primary">Add</button></form><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger" class="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary" class="secondary">Unarchive</button></div>
<div id="settings-pane-members" data-testid="settings-pane-members"><div class="member-row" data-testid="member-row"><span class="role-badge" data-testid="role-badge">member</span><select data-testid="role-select"><option>member</option></select></div></div><button id="settings-tab-members" data-testid="settings-tab-members">Members</button><button id="settings-tab-invitations" data-testid="settings-tab-invitations">Invitations</button><button id="settings-tab-general" data-testid="settings-tab-general">General</button><div id="settings-pane-invitations" data-testid="settings-pane-invitations"><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary" class="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary" class="primary">Create invitation</button></form><div id="invitations-list" data-testid="invitations-list"><span id="invitation-code" data-testid="invitation-code"></span></div></div></div>
<script>
const $=id=>document.getElementById(id), tokenKey='huddle.token';
let token=localStorage.getItem(tokenKey)||new URLSearchParams(location.search).get('token'), me=null, ws=null, channels=[], current=null, threadParent=null, editing=null;
async function api(path,opt={}){opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});if(token)opt.headers.Authorization='Bearer '+token;let r=await fetch('/api'+path,opt);let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
function modal(id,on){$(id).classList.toggle('show',on)}
function authForm(){return $('auth-form')}
async function boot(){if(!token){modal('auth-modal',true);return}try{let d=await api('/auth/me');me=d.user;$('current-user').textContent=me.display_name||me.username;modal('auth-modal',false);await loadWorkspaces()}catch(e){token=null;localStorage.removeItem(tokenKey);modal('auth-modal',true)}}
async function loadWorkspaces(){let d=await api('/workspaces');if(!d.workspaces.length){$('wsname').textContent='No workspace';return}let w=d.workspaces[0];await loadWorkspace(w.slug)}
async function loadWorkspace(slug){let d=await api('/workspaces/'+encodeURIComponent(slug));ws=d.workspace;$('wsname').textContent=ws.name;channels=d.channels;renderChannels();if(channels.length)selectChannel(channels[0])}
function renderChannels(){$('channel-list').innerHTML='';channels.forEach(c=>{let b=document.createElement('button');b.dataset.testid='channel-entry';b.dataset.channelId=c.id;b.dataset.channelName=c.name;b.textContent='# '+c.name;b.onclick=()=>selectChannel(c);$('channel-list').appendChild(b)})}
async function selectChannel(c){current=c;$('channel-title').textContent='# '+c.name;$('channel-topic').textContent=c.topic||'';document.querySelectorAll('[data-testid=channel-entry]').forEach(x=>x.classList.toggle('active',String(x.dataset.channelId)==String(c.id)));await loadMessages();connectWS()}
async function loadMessages(){let d=await api('/channels/'+current.id+'/messages');let box=$('message-list');box.innerHTML='';if(!d.messages.length){box.innerHTML='<div class="empty">No messages yet. Start the conversation!</div>';return}d.messages.reverse().forEach(renderMessage)}
function renderMessage(m){let row=document.createElement('div');row.className='msg';row.dataset.testid='message';row.dataset.id=m.id;let initial=(m.author.display_name||m.author.username||'?')[0].toUpperCase();row.innerHTML='<div class="avatar">'+initial+'</div><div style="flex:1"><div class="meta">'+esc(m.author.display_name||m.author.username)+' <span class="time">'+new Date(m.created_at).toLocaleString()+(m.edited_at?' (edited)':'')+'</span></div><div class="body" data-testid="message-body">'+esc(m.body)+'</div><div class="reactions"></div></div><div class="tools"><button data-act="thread" data-testid="open-thread-btn">Thread</button><button data-act="react" data-testid="reaction-button">☺</button><button data-act="edit">Edit</button><button data-act="delete">Delete</button></div><div class="picker" data-testid="emoji-picker"><button data-testid="emoji-option">👍</button><button data-testid="emoji-option">❤️</button><button data-testid="emoji-option">😂</button><button data-testid="emoji-option">🎉</button><button data-testid="emoji-option">🚀</button></div>';row.querySelector('[data-act=thread]').onclick=()=>openThread(m);row.querySelector('[data-act=react]').onclick=()=>row.querySelector('.picker').classList.toggle('show');row.querySelectorAll('[data-testid=emoji-option]').forEach(b=>b.onclick=()=>react(m,b.textContent,row));row.querySelector('[data-act=edit]').onclick=()=>edit(m,row);row.querySelector('[data-act=delete]').onclick=()=>del(m.id);$('message-list').appendChild(row)}
function esc(x){return String(x).replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]))}
async function react(m,e,row){try{let d=await api('/messages/'+m.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:e})});let x=row.querySelector('.reactions');x.innerHTML+='<span class="reaction" data-testid="reaction-chip">'+e+' 1</span>'}catch(e){}}
async function edit(m,row){let body=row.querySelector('.body'),old=body.textContent,inp=document.createElement('input');inp.value=old;inp.style.width='80%';body.replaceWith(inp);inp.focus();let save=async()=>{let v=inp.value;if(!v.trim()){inp.replaceWith(body);return}try{await api('/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:v})});await loadMessages()}catch(e){inp.replaceWith(body);}};inp.onkeydown=e=>{if(e.key==='Enter')save();if(e.key==='Escape')inp.replaceWith(body)}}
async function del(id){try{await api('/messages/'+id,{method:'DELETE'});await loadMessages()}catch(e){console.error(e)}}
async function send(body,parent){if(!current||!body.trim())return;try{await api('/channels/'+current.id+'/messages',{method:'POST',body:JSON.stringify({body:body,parent_id:parent||undefined})});if(parent)openThread({id:parent,body:''});else{$('message-input').value='';await loadMessages()}}catch(e){console.error(e)}}
function openThread(m){threadParent=m;$('thread-panel').classList.add('show');$('threadbody').innerHTML='<div><b>Thread</b></div>';api('/messages/'+m.id+'/replies').then(d=>(d.replies||[]).forEach(x=>$('threadbody').innerHTML+='<p><b>'+esc(x.author.username)+':</b> '+esc(x.body)+'</p>')).catch(()=>{})}
function connectWS(){if(!token||!current)return;if(window._sock)window._sock.close();let proto=location.protocol==='https:'?'wss':'ws';let x=new WebSocket(proto+'://'+location.host+'/api/ws?token='+encodeURIComponent(token));window._sock=x;x.onopen=()=>x.send(JSON.stringify({type:'subscribe',channel_id:current.id}));x.onmessage=e=>{let f=JSON.parse(e.data);if(f.type==='message.created'&&f.channel_id==current.id)loadMessages()}}
$('auth-toggle').onclick=()=>{let reg=$('auth-title').textContent!='Create your account';$('auth-title').textContent=reg?'Create your account':'Sign in to Huddle';$('auth-submit').textContent=reg?'Create account':'Sign in';$('auth-toggle').textContent=reg?'Back to sign in':'Create an account'}
$('auth-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),reg=$('auth-title').textContent!='Sign in to Huddle',path=reg?'/auth/register':'/auth/login',b={username:f.get('username'),password:f.get('password')};if(reg)b.display_name=f.get('display_name');try{let d=await api(path,{method:'POST',body:JSON.stringify(b)});token=d.token;localStorage.setItem(tokenKey,token);await boot()}catch(x){$('auth-error').textContent=x.message}}
$('logout-btn').onclick=()=>{token=null;localStorage.removeItem(tokenKey);location.reload()}
$('send-btn').onclick=()=>send($('message-input').value);$('message-input').onkeydown=e=>{if(e.key==='Enter')$('send-btn').click()}
$('close-thread').onclick=()=>$('thread-panel').classList.remove('show');$('thread-send').onclick=()=>{send($('thread-input').value,threadParent&&threadParent.id);$('thread-input').value=''}
$('new-channel-btn').onclick=()=>modal('create-channel-modal',true);$('create-channel-cancel').onclick=()=>modal('create-channel-modal',false)
$('create-channel-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let d=await api('/workspaces/'+ws.slug+'/channels',{method:'POST',body:JSON.stringify({name:f.get('name'),topic:f.get('topic'),is_private:$('create-channel-private').checked})});channels.push(d.channel);renderChannels();modal('create-channel-modal',false);selectChannel(d.channel)}catch(x){$('channel-error').textContent=x.message}}
$('empty-state-create-workspace').onclick=()=>modal('workspace-settings-modal',true);$('workspace-settings-close').onclick=()=>modal('workspace-settings-modal',false)
$('workspace-create-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let d=await api('/workspaces',{method:'POST',body:JSON.stringify({slug:f.get('slug'),name:f.get('name')})});modal('workspace-settings-modal',false);await loadWorkspace(d.workspace.slug)}catch(x){$('ws-error').textContent=x.message}}
boot()
</script></body></html>
