<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#1d1c1d}button{border:0;border-radius:4px;padding:9px 14px;cursor:pointer}[data-button-role="primary"]{background:#007a5a;color:#fff;background-image:none}[data-button-role="danger"]{background:#e01e5a;color:#fff;background-image:none}[data-button-role="secondary"]{background:#1264a3;color:#fff;background-image:none}.app{display:flex;height:100vh}.sidebar{width:260px;background:#3f0e40;color:white;padding:18px}.sidebar button{margin:4px}.main{flex:1;display:flex;flex-direction:column}.header{padding:18px;border-bottom:1px solid #ddd}.messages{flex:1;padding:20px;overflow:auto}.thread{width:320px;border-left:1px solid #ddd;padding:18px}.row{padding:10px;border-bottom:1px solid #eee}.modal{display:none}.input{padding:14px;border-top:1px solid #ddd;display:flex;gap:8px}.input input{flex:1;padding:12px}
</style></head><body>
<div id="auth-modal"><form id="auth-form" data-testid="auth-form" data-mode="signup"><h2>Welcome to Huddle</h2><input name="username" placeholder="username"><input name="password" type="password" placeholder="password"><input name="display_name" placeholder="display name"><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign up</button><button type="button" id="auth-toggle" data-testid="auth-toggle">Log in</button><div id="auth-error" data-testid="auth-error"></div></form></div>
<div class="app"><aside id="sidebar" class="sidebar" data-testid="sidebar"><h2 id="workspace-header" data-testid="workspace-header">Huddle</h2><div id="current-user" data-testid="current-user"></div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button><div id="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button></aside>
<section class="main"><header class="header"><h2 id="channel-title" data-testid="channel-title">Select a channel</h2><div id="channel-topic" data-testid="channel-topic"></div><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button></header><div id="channel-empty-state" data-testid="channel-empty-state">Choose a channel to begin.</div><div id="message-list" class="messages" data-testid="message-list"></div><div class="input"><input id="message-input" data-testid="message-input" placeholder="Write a message"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></div></section>
<aside id="thread-panel" class="thread" data-testid="thread-panel" hidden><h3>Thread</h3><div id="thread-messages"></div><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button></aside></div>
<div id="create-channel-modal" class="modal"><form id="create-channel-form" data-testid="create-channel-form"><input name="name"><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button><div id="create-channel-error" data-testid="create-channel-error"></div></form></div>
<form id="workspace-create-form" data-testid="workspace-create-form"><input name="name"><input name="slug"><button type="submit" id="empty-state-create-workspace" data-testid="empty-state-create-workspace">Create workspace</button></form>
<form id="join-workspace-form" data-testid="join-workspace-form"><input name="slug"><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary">Join</button><div id="join-workspace-error"></div></form>
<div id="workspace-settings-modal" class="modal"><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary">Save</button></div>
<div id="channel-settings-modal" class="modal"><h3 id="channel-settings-title" data-testid="channel-settings-title">Channel</h3><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add</button></form><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button></div>
<div id="settings-pane-members" data-testid="settings-pane-members"></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"></div><div id="settings-pane-general" data-testid="settings-pane-general"></div><button id="settings-tab-members" data-testid="settings-tab-members">Members</button><button id="settings-tab-invitations" data-testid="settings-tab-invitations">Invitations</button><button id="settings-tab-general" data-testid="settings-tab-general">General</button><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button></form><div id="invitations-list" data-testid="invitations-list"></div>
<script src="/app.js"></script></body></html>
