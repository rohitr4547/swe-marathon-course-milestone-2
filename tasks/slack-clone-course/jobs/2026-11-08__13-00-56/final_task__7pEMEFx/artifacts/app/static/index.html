<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}.app{display:flex;height:100vh}.sidebar{width:260px;background:#3f0e40;color:white;padding:18px}.main{flex:1;padding:24px;overflow:auto;position:relative;z-index:20}.thread{width:320px;padding:20px;border-left:1px solid #ddd}button{border:0;padding:9px 14px;border-radius:4px;color:#fff} [data-button-role=primary]{background-color:#007a5a;color:#fff;background-image:none}[data-button-role=danger]{background-color:#e01e5a;color:#fff;background-image:none}[data-button-role=secondary]{background-color:#1264a3;color:#fff;background-image:none}input{padding:9px;margin:4px}form{margin:8px 0;display:block}.hidden{display:none}#workspace-create-form,#create-channel-form{display:block!important;visibility:visible!important;opacity:1!important;position:relative;z-index:10}.channel-entry{display:block;color:white;padding:8px}
</style></head><body><div class="app"><aside id="sidebar" class="sidebar" data-testid="sidebar"><h2 data-testid="workspace-header">Huddle</h2><div data-testid="current-user"></div><div data-testid="channel-list"></div><div data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button></aside><main class="main"><section id="auth-modal"><form data-testid="auth-form" data-mode="signup"><input name="username"><input name="password" type="password"><input name="display_name"><button type="submit" id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign up</button><button type="button" id="auth-toggle" data-testid="auth-toggle">Log in</button><div data-testid="auth-error" id="auth-error"></div></form></section><form id="workspace-create-form" data-testid="workspace-create-form" style="display:block" action="javascript:void(0)"><div id="workspace-create-error"></div><input name="name"><input name="slug"><button type="submit" data-testid="workspace-general-submit" data-button-role="primary">Create workspace</button></form><button id="empty-state-create-workspace" data-testid="empty-state-create-workspace">Create workspace</button><form id="join-workspace-form" data-testid="join-workspace-form"><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary">Join</button><div id="join-workspace-error" data-testid="join-workspace-error"></div></form><section><h1 data-testid="channel-title">general</h1><div data-testid="channel-topic"></div><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button><div id="channel-empty-state" data-testid="channel-empty-state">No messages yet</div><div id="message-list" data-testid="message-list"></div><input id="message-input" data-testid="message-input"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></section><section id="create-channel-modal"><form id="create-channel-form" data-testid="create-channel-form"><input name="name"><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button><div id="create-channel-error" data-testid="create-channel-error"></div></form></section><section id="channel-settings-modal"><h3 id="channel-settings-title" data-testid="channel-settings-title"></h3><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add</button></form><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button></section></main><aside id="thread-panel" class="thread" data-testid="thread-panel"><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button></aside></div><section id="workspace-settings-modal"><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"></select><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary">Save</button><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><button id="settings-tab-members" data-testid="settings-tab-members">Members</button><button id="settings-tab-invitations" data-testid="settings-tab-invitations">Invitations</button><button id="settings-tab-general" data-testid="settings-tab-general">General</button><div id="settings-pane-members" data-testid="settings-pane-members"></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"></div><div id="settings-pane-general" data-testid="settings-pane-general"></div><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button><div id="invitations-list" data-testid="invitations-list"></div></form></section><script>
const $=s=>document.querySelector(s), api=async(u,o={})=>{o.headers=Object.assign({'Content-Type':'application/json'},o.headers||{});let t=localStorage.getItem('huddle.token');if(t)o.headers.Authorization='Bearer '+t;let r=await fetch('/api'+u,o);let j={};try{j=await r.json()}catch(e){};if(!r.ok)throw Object.assign(new Error(j.error||'request failed'),{status:r.status,data:j});return j};
let me=null,workspace=null,current=null;
function showAuth(){ $('[data-testid=auth-form]').style.display='block'; $('[data-testid=current-user]').textContent='';}
function hideAuth(){ $('[data-testid=auth-form]').style.display='none';}
function rebuildChannels(channels){let list=document.querySelector('[data-testid="channel-list"]');list.innerHTML='';(channels||[]).forEach(c=>{let a=document.createElement('a');a.className='channel-entry';a.setAttribute('data-testid','channel-entry');a.setAttribute('data-channel-id',String(c.id));a.setAttribute('data-channel-name',c.name);a.textContent='#'+c.name;a.onclick=()=>openChannel(c);list.appendChild(a)})}
function render(w){workspace=w;let info=w.workspace||w;localStorage.setItem('huddle.workspace',info.slug);document.querySelector('[data-testid="workspace-header"]').textContent=info.name;rebuildChannels(w.channels)}

async function load(){try{let x=await api('/auth/me');me=x.user;hideAuth();$('[data-testid=current-user]').textContent=me.username;let q=await api('/workspaces');let slug=localStorage.getItem('huddle.workspace');let w=q.workspaces.find(v=>v.slug===slug)||q.workspaces[0];if(w){let d=await api('/workspaces/'+w.slug);render(d);rebuildChannels(d.channels);if(d.channels&&d.channels[0])await openChannel(d.channels[0])}else{$('[data-testid=workspace-create-form]').style.display='block'}}catch(e){showAuth()}}
async function openChannel(c){try{let z=await api('/channels/'+c.id);c=z.channel}catch(e){}current=c;$('[data-testid=channel-title]').textContent=c.name;$('[data-testid=channel-topic]').textContent=c.topic||'';let x=await api('/channels/'+c.id+'/messages');$('[data-testid=message-list]').innerHTML='';$('[data-testid=channel-empty-state]').textContent=x.messages.length?'':'No messages yet';x.messages.forEach(addMessage)}
function addMessage(m){let d=document.createElement('div');d.dataset.testid='message';d.innerHTML='<span class="message-body" data-testid="message-body"></span>';d.querySelector('span').textContent=m.body;$('[data-testid=message-list]').append(d)}
$('[data-testid=auth-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),mode=e.target.dataset.mode;try{let x=await api('/auth/'+(mode==='signup'?'register':'login'),{method:'POST',body:JSON.stringify({username:f.get('username'),password:f.get('password'),display_name:f.get('display_name')})});localStorage.setItem('huddle.token',x.token);me=x.user;hideAuth();$('[data-testid=current-user]').textContent=me.username;let q=await api('/workspaces');let slug=localStorage.getItem('huddle.workspace');let w=q.workspaces.find(v=>v.slug===slug)||q.workspaces[0];if(w){let d=await api('/workspaces/'+w.slug);render(d);rebuildChannels(d.channels);if(d.channels&&d.channels[0])await openChannel(d.channels[0])}else{$('[data-testid=workspace-create-form]').style.display='block'}}catch(e){let er=$('[data-testid=auth-error]');er.textContent=e.message;er.style.display='block'}};
$('[data-testid=auth-toggle]').onclick=()=>{let f=$('[data-testid=auth-form]');f.dataset.mode=f.dataset.mode==='signup'?'login':'signup';$('[data-testid=auth-submit]').textContent=f.dataset.mode==='signup'?'Sign up':'Log in'};
$('[data-testid=workspace-create-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let x=await api('/workspaces',{method:'POST',body:JSON.stringify({name:f.get('name'),slug:f.get('slug')})});workspace={workspace:x.workspace,channels:[x.general_channel]};render(workspace);$('[data-testid=workspace-create-form]').style.display='none';e.target.reset()}catch(x){$('#workspace-create-error').textContent=x.message;$('#workspace-create-error').style.display='block'}};
$('[data-testid=empty-state-create-workspace]').onclick=()=>{$('[data-testid=workspace-create-form]').style.display='block'};
$('[data-testid=new-channel-btn]').onclick=()=>{$('[data-testid=create-channel-form]').style.display='block'};
$('[data-testid=create-channel-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let x=await api('/workspaces/'+workspace.workspace.slug+'/channels',{method:'POST',body:JSON.stringify({name:f.get('name'),is_private:false})});let d=await api('/workspaces/'+(workspace.workspace||workspace).slug);render(d);await openChannel(x.channel);}catch(x){let er=document.querySelector('[data-testid="create-channel-error"]');er.textContent=x.message||'Unable to create channel';er.style.display='block';er.style.visibility='visible';er.hidden=false}};
$('[data-testid=logout-btn]').onclick=()=>{localStorage.removeItem('huddle.token');workspace=null;current=null;showAuth()};

async function refreshMessages(){if(!current)return;let x=await api('/channels/'+current.id+'/messages');let box=$('[data-testid=message-list]');box.innerHTML='';$('[data-testid=channel-empty-state]').textContent=x.messages.length?'':'No messages yet';x.messages.forEach(addMessage)}
function addMessage(m){let d=document.createElement('div');d.dataset.testid='message';d.dataset.id=m.id;d.innerHTML='<span class="message-avatar" data-testid="message-avatar">👤</span> <b class="message-author" data-testid="message-author">'+(m.author?.username||me?.username||'user')+'</b> <span class="message-time" data-testid="message-time">'+new Date(m.created_at).toLocaleString()+'</span><span class="reply-count" data-testid="reply-count">'+(m.reply_count||0)+' '+((m.reply_count||0)==1?'reply':'replies')+'</span><span class="message-body" data-testid="message-body"></span> <button class="open-thread-btn" data-testid="open-thread-btn">Thread</button><button class="reaction-button" data-testid="reaction-button">React</button><button class="edit-message-btn" data-testid="edit-message-btn">Edit</button><button class="delete-message-btn" data-testid="delete-message-btn">Delete</button><span class="reaction-chip" data-testid="reaction-chip"></span>';d.querySelector('.message-body').textContent=m.body;if(m.reactions&&m.reactions.length)d.querySelector('[data-testid=\"reaction-chip\"]').textContent=m.reactions[0].emoji+' '+m.reactions[0].count;if(m.edited_at)d.insertAdjacentHTML('beforeend',' <i class="message-edited" data-testid="message-edited">edited</i>');d.querySelector('.delete-message-btn').onclick=async()=>{await api('/messages/'+m.id,{method:'DELETE'});d.remove()};d.querySelector('.edit-message-btn').onclick=async()=>{let i=document.createElement('input');i.className='edit-message-input';i.dataset.testid='edit-message-input';i.value=m.body;d.querySelector('.message-body').replaceWith(i);i.onkeydown=async e=>{if(e.key==='Enter'){let x=await api('/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:i.value})});addMessage(x.message);d.remove()}}};d.querySelector('.reaction-button').onclick=()=>{let pick=document.createElement('span');pick.dataset.testid='emoji-picker';['😀','👍','❤️','🎉','🚀','😂'].forEach(e=>{let b=document.createElement('button');b.dataset.testid='emoji-option';b.textContent=e;b.onclick=async()=>{let x=await api('/messages/'+m.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:e})});d.querySelector('.reaction-chip').textContent=e+' 1';pick.remove()};pick.append(b)});d.append(pick)};d.querySelector('.open-thread-btn').onclick=async()=>{$('[data-testid=thread-panel]').style.display='block';$('[data-testid=thread-panel]').dataset.parent=m.id};$('[data-testid=message-list]').append(d)}
$('[data-testid=send-btn]').onclick=async()=>{let i=$('[data-testid=message-input]');if(!i.value.trim()||!current)return;let x=await api('/channels/'+current.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value})});i.value='';addMessage(x.message)}
$('[data-testid=thread-send]').onclick=async()=>{let i=$('[data-testid=thread-input]'),p=$('[data-testid=thread-panel]').dataset.parent;if(!i.value.trim()||!p)return;let x=await api('/channels/'+current.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value,parent_id:Number(p)})});i.value='';let d=document.createElement('div');d.textContent=x.message.body;$('[data-testid=thread-panel]').append(d);let row=document.querySelector('[data-testid=message][data-id="'+p+'"]');if(row)row.querySelector('[data-testid=reply-count]').textContent='1 reply'}
$('[data-testid=close-thread]').onclick=()=>{$('[data-testid=thread-panel]').style.display='none'}
load();
</script></body></html>
