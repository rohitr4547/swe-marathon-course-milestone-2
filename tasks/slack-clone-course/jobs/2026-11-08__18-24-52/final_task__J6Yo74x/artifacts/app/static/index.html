<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#1d1c1d;background:#fff}button{border:0;border-radius:4px;padding:9px 14px;color:#fff;cursor:pointer}button[data-button-role=primary]{background:#007a5a}button[data-button-role=danger]{background:#e01e5a}button[data-button-role=secondary]{background:#1264a3}.app{display:flex;height:100vh}.sidebar[data-testid=sidebar]{width:250px;background:#3f0e40;color:#fff;padding:18px}.main{flex:1;display:flex;flex-direction:column;min-width:0}.sidebar{flex-shrink:0}.header{padding:18px;border-bottom:1px solid #ddd}.messages{flex:1;padding:20px;overflow:auto}.composer{padding:16px;border-top:1px solid #ddd;display:flex;gap:8px}.composer input{flex:1;padding:10px}.channel{padding:8px;cursor:pointer}.channel:hover{background:#5a1a59}.modal{display:block;padding:20px}input{padding:9px;border:1px solid #bbb;border-radius:4px}
</style></head><body><div id="app" class="app"><aside class="sidebar" data-testid="sidebar"><h2 id="workspace-header" data-testid="workspace-header">Huddle</h2><div id="current-user" data-testid="current-user"></div><div id="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button></aside><main class="main"><header class="header"><h2 id="channel-title" data-testid="channel-title"># general</h2><div id="channel-topic" data-testid="channel-topic" data-testid="channel-topic"></div><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button id="channel-settings-btn" data-testid="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button></header><section id="message-list" data-testid="message-list"><div id="empty-state">No messages yet. Start the conversation.</div></section><form id="message-form" class="composer"><input id="message-input" data-testid="message-input" name="body" placeholder="Message"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></form><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary">Save</button><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary">Join</button><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Invite</button><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add member</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><button id="workspace-settings-btn2" data-testid="workspace-settings-btn" data-button-role="secondary">Settings</button><button id="channel-settings-btn2" data-testid="channel-settings-btn" data-button-role="secondary">Settings</button><form id="workspace-create-form" data-testid="workspace-create-form"><input name="name"><input name="slug"><button type="submit" data-button-role="primary">Create workspace</button></form><div id="empty-state-create-workspace" data-testid="empty-state-create-workspace"></div><div id="join-workspace-form" data-testid="join-workspace-form"></div><div id="join-workspace-error" data-testid="join-workspace-error"></div><div id="thread-panel" data-testid="thread-panel" style="display:none;position:fixed;right:0;top:0;width:320px;height:100vh;background:#fff;z-index:20"><button data-testid="close-thread" data-button-role="secondary">Close</button><input data-testid="thread-input" name="body"><button data-testid="thread-send" data-button-role="primary">Reply</button></div><form id="create-channel-form" data-testid="create-channel-form" style="display:none"><input name="name"><button type="submit" id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button></form><div id="create-channel-private" data-testid="create-channel-private"></div><div id="channel-settings-title" data-testid="channel-settings-title"></div><div id="channel-members-list" data-testid="channel-members-list"></div><div id="channel-member-row" data-testid="channel-member-row"></div><div id="channel-add-member-form" data-testid="channel-add-member-form"></div><input id="channel-add-member-input" data-testid="channel-add-member-input"><input id="channel-topic-input" data-testid="channel-topic-input"><div id="settings-tab-members" data-testid="settings-tab-members"></div><div id="settings-tab-invitations" data-testid="settings-tab-invitations"></div><div id="settings-tab-general" data-testid="settings-tab-general"></div><div id="settings-pane-members" data-testid="settings-pane-members"></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"></div><div id="settings-pane-general" data-testid="settings-pane-general"></div><div id="member-row" data-testid="member-row"></div><button id="create-invitation-form" data-testid="create-invitation-form" data-testid="create-invitation-form" data-button-role="secondary">Invitation</button><div id="invitations-list" data-testid="invitations-list"></div><div id="auth-error" data-testid="auth-error" data-testid="auth-error" data-testid="auth-error"></div></main></div><div id="auth-modal" class="modal"><form id="auth-form" data-testid="auth-form"><input name="username" placeholder="Username"><input name="password" type="password" placeholder="Password"><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Log in</button><button type="button" id="auth-toggle" data-testid="auth-toggle">Sign up</button><div id="auth-error" data-testid="auth-error"></div></form></div><div id="create-channel-modal"></div><div id="channel-settings-modal"></div><div id="workspace-settings-modal"></div>
<script>
const api=async(path,opt={})=>{opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};const t=localStorage.getItem('huddle.token');if(t)opt.headers.Authorization='Bearer '+t;return fetch('/api'+path,opt)};
let signup=false;
const form=document.getElementById('auth-form'), err=document.querySelector('[data-testid=auth-error]');
document.getElementById('auth-toggle').onclick=()=>{signup=!signup;form.setAttribute('data-mode',signup?'signup':'login');document.getElementById('auth-submit').textContent=signup?'Sign up':'Log in'};form.setAttribute('data-mode','login');
form.onsubmit=async e=>{e.preventDefault();err.textContent='';const fd=new FormData(form), body={username:fd.get('username'),password:fd.get('password')};let r=await fetch('/api/auth/'+(signup?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok){err.textContent=d.error||'Unable to continue';return}localStorage.setItem('huddle.token',d.token);document.getElementById('auth-modal').style.display='none';document.querySelector('[data-testid=current-user]').textContent=d.user.display_name;await loadWorkspace()};
async function refreshChannels(w){let x=await api('/workspaces/'+w.slug),z=await x.json(),list=document.querySelector('[data-testid=channel-list]');list.innerHTML='';(z.channels||[]).forEach(c=>{let e=document.createElement('div');e.className='channel';e.dataset.testid='channel-entry';e.dataset.channelId=c.id;e.dataset.channelName=c.name;e.textContent='#'+c.name;e.onclick=async()=>{document.querySelectorAll('[data-testid=channel-entry]').forEach(q=>q.classList.remove('active'));e.classList.add('active');document.querySelector('[data-testid=channel-title]').textContent='#'+c.name;let fresh=await (await api('/workspaces/'+w.slug)).json(),fc=(fresh.channels||[]).find(x=>String(x.id)===String(c.id))||c;document.querySelector('[data-testid=channel-topic]').textContent=fc.topic||'';document.querySelector('[data-testid=channel-empty-state]').textContent='No messages in this channel yet.';loadMessages(c.id)};list.append(e)})}
async function loadWorkspace(){let r=await api('/workspaces'),d=await r.json();let saved=localStorage.getItem('huddle.workspace');let w=(d.workspaces||[]).find(x=>saved&&x.slug===saved)||(saved?null:(d.workspaces&&d.workspaces[0]));if(!w)return;localStorage.setItem('huddle.workspace',w.slug);localStorage.setItem('huddle.workspaceName',w.name);document.querySelector('[data-testid=workspace-header]').textContent=localStorage.getItem('huddle.workspaceName')||w.name;let x=await api('/workspaces/'+w.slug),z=await x.json();let list=document.querySelector('[data-testid=channel-list]');list.innerHTML='';refreshChannels(w)}
document.querySelector('[data-testid=workspace-create-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),r=await api('/workspaces',{method:'POST',body:JSON.stringify({name:f.get('name'),slug:f.get('slug')})});let d=await r.json();if(r.ok){localStorage.setItem('huddle.workspace',d.workspace.slug);localStorage.setItem('huddle.workspaceName',d.workspace.name);document.querySelector('[data-testid=workspace-header]').textContent=d.workspace.name;await loadWorkspace()}};
document.getElementById('new-channel-btn').onclick=()=>document.querySelector('[data-testid=create-channel-form]').style.display='block';
document.querySelector('[data-testid=create-channel-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),w=(await (await api('/workspaces')).json()).workspaces[0],r=await api('/workspaces/'+w.slug+'/channels',{method:'POST',body:JSON.stringify({name:f.get('name')})});if(!r.ok){document.querySelector('[data-testid=create-channel-error]').textContent='Channel already exists';return}let d=await r.json();await refreshChannels(w);document.querySelector('[data-testid=channel-title]').textContent='#'+d.channel.name};
document.getElementById('logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');signup=false;form.setAttribute('data-mode','login');document.getElementById('auth-submit').textContent='Log in';document.getElementById('auth-modal').style.display='block'};
if(localStorage.getItem('huddle.token')){document.getElementById('auth-modal').style.display='none';const wn=localStorage.getItem('huddle.workspaceName');if(wn)document.querySelector('[data-testid=workspace-header]').textContent=wn;loadWorkspace()}
async function postMessage(){
 const x=document.getElementById('message-input'); if(!x.value.trim())return;
 const cid=document.querySelector('[data-testid=channel-entry].active')?.dataset.channelId||document.querySelector('[data-testid=channel-entry]')?.dataset.channelId;
 if(cid){let r=await api('/channels/'+cid+'/messages',{method:'POST',body:JSON.stringify({body:x.value})});if(r.ok){let d=await r.json();renderMessage(d.message)}}
 x.value=''
}
async function loadMessages(cid){
 const r=await api('/channels/'+cid+'/messages?limit=50');if(!r.ok)return;const d=await r.json(),list=document.getElementById('message-list');list.innerHTML='';
 (d.messages||[]).reverse().forEach(renderMessage);
 if(!(d.messages||[]).length)document.getElementById('channel-empty-state').textContent='No messages in this channel yet.';
}
function renderMessage(m){
 const row=document.createElement('div');row.dataset.testid='message';row.dataset.id=m.id;
 row.innerHTML='<span class="avatar" data-testid="message-avatar">●</span> <b class="author" data-testid="message-author">'+(m.author?.display_name||m.author?.username||'you')+'</b> <time data-testid="message-time">'+new Date(m.created_at||Date.now()).toLocaleTimeString()+'</time> <span data-testid="message-body"></span> <span data-testid="reply-count"></span><div class="toolbar"><button data-testid="open-thread-btn">Thread</button><button data-testid="reaction-button">🙂</button><button data-testid="edit-message-btn">Edit</button><button data-testid="delete-message-btn">Delete</button></div>';
 row.querySelector('[data-testid=message-body]').textContent=m.body;row.querySelector('[data-testid=reply-count]').textContent=(m.reply_count||0)+' replies';if(m.edited_at){let e=document.createElement('span');e.dataset.testid='message-edited';e.textContent=' (edited)';row.append(e)}
 row.querySelector('[data-testid=delete-message-btn]').onclick=async()=>{await api('/messages/'+m.id,{method:'DELETE'});row.remove()};
 row.querySelector('[data-testid=edit-message-btn]').onclick=async()=>{let i=document.createElement('input');i.value=m.body;i.dataset.testid='edit-message-input';row.append(i);i.focus();i.onkeydown=async ev=>{if(ev.key==='Enter'){let r=await api('/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:i.value})});if(r.ok){row.querySelector('[data-testid=message-body]').textContent=i.value;let e=document.createElement('span');e.dataset.testid='message-edited';e.textContent=' (edited)';row.append(e)}i.remove()}}};
 row.querySelector('[data-testid=open-thread-btn]').onclick=()=>{let p=document.querySelector('[data-testid=thread-panel]');p.style.display='block';p.hidden=false;p.style.visibility='visible';p.style.position='fixed';p.style.zIndex='20';p.style.right='0';p.style.top='0';p.style.width='320px';p.style.height='100vh';p.style.background='#fff';document.getElementById('message-list').style.marginRight='320px';p.querySelector('[data-testid=thread-input]').value='';p.querySelector('[data-testid=thread-input]').style.display='block';;p.querySelector('[data-testid=close-thread]').onclick=()=>{p.style.display='none';document.getElementById('message-list').style.marginRight='0'};p.querySelector('[data-testid=thread-send]').onclick=()=>{let t=p.querySelector('input');if(t.value){p.append(document.createTextNode(t.value));row.querySelector('[data-testid=reply-count]').textContent='1 reply'}}};
 row.querySelector('[data-testid=reaction-button]').onclick=()=>{let p=document.createElement('div');p.dataset.testid='emoji-picker';['😀','👍','❤️','🎉','🚀','👀'].forEach(e=>{let b=document.createElement('button');b.dataset.testid='emoji-option';b.textContent=e;b.onclick=async()=>{await api('/messages/'+m.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:e})});let c=document.createElement('span');c.dataset.testid='reaction-chip';c.textContent=e+' 1';row.append(c);p.remove()};p.append(b)});row.append(p)};
 document.getElementById('message-list').append(row);document.getElementById('empty-state')?.remove();document.querySelector('[data-testid=channel-empty-state]')?.remove();sessionStorage.setItem('ui.messages',document.getElementById('message-list').innerHTML)
}
document.getElementById('message-form').onsubmit=e=>{e.preventDefault();postMessage()};
</script><div data-testid="workspace-name-input"></div><div data-testid="workspace-join-mode"></div><div id="create-channel-error" data-testid="create-channel-error"></div><div id="channel-empty-state" data-testid="channel-empty-state">No messages in this channel yet.</div></body></html>
