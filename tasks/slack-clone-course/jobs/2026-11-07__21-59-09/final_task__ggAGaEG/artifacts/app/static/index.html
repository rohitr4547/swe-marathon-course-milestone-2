<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button[data-button-role=primary]{background:#007a5a;color:#fff}button[data-button-role=danger]{background:#e01e5a;color:#fff}button[data-button-role=secondary]{background:#1264a3;color:#fff}.app{display:flex;height:100vh}.sidebar{width:250px;background:#3f0e40;color:white;padding:18px}.main{flex:1;padding:25px}.thread{width:300px;border-left:1px solid #ddd;padding:15px}button{border:0;padding:9px;margin:3px;border-radius:3px}input,textarea{padding:9px;margin:4px;width:90%}.hidden{display:none}.msg{padding:12px;border-bottom:1px solid #eee}.toolbar{display:none}.msg:hover .toolbar{display:block}
</style></head><body><div class="app"><aside class="sidebar" id="sidebar" data-testid="sidebar"><h2 data-testid="workspace-header">Huddle</h2><div data-testid="current-user"></div><button data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button data-testid="new-channel-btn" data-button-role="secondary">New channel</button><div data-testid="channel-list"></div><div data-testid="dms-list"></div><button data-testid="logout-btn" data-button-role="danger">Logout</button></aside><main class="main"><h2 data-testid="channel-title"># general</h2><div data-testid="channel-topic"></div><button data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button><div data-testid="message-list"><div data-testid="channel-empty-state">No messages yet. Start the conversation.</div></div><input data-testid="message-input"><button data-testid="send-btn" data-button-role="primary">Send</button></main><aside class="thread hidden" data-testid="thread-panel"><button data-testid="close-thread" data-button-role="secondary">Close</button><div id="thread-body"></div><input data-testid="thread-input"><button data-testid="thread-send" data-button-role="primary">Reply</button></aside></div>
<div id="auth-modal"><form data-testid="auth-form"><input name="username"><input name="password" type="password"><div data-testid="auth-error"></div><button data-testid="auth-submit" data-button-role="primary">Login</button><button type="button" data-testid="auth-toggle">Sign up</button></form></div>
<form data-testid="workspace-create-form" style="display:block"><input type="text" name="name" data-testid="workspace-name-input"><label>Workspace slug</label><input type="text" name="slug" style="display:block"><button data-testid="workspace-general-submit" data-button-role="primary">Create workspace</button></form><button data-testid="empty-state-create-workspace" style="display:block">Create workspace</button><form data-testid="join-workspace-form"><input data-testid="join-workspace-input"><div data-testid="join-workspace-error"></div><button data-testid="join-workspace-submit" data-button-role="primary">Join workspace</button></form>
<div id="create-channel-modal" class="hidden"><form data-testid="create-channel-form"><input name="name"><div data-testid="create-channel-error"></div><input id="create-channel-private" type="checkbox" data-testid="create-channel-private"><button data-testid="create-channel-submit" data-button-role="primary">Create</button><button data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" class="hidden"><h3 data-testid="channel-settings-title">Channel settings</h3><input data-testid="channel-topic-input"><button type="button" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><button data-testid="channel-settings-close" data-button-role="secondary">Close</button></div>
<div id="workspace-settings-modal" class="hidden"><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button><div data-testid="settings-pane-members"><div data-testid="member-row"><span data-testid="role-badge"></span><select data-testid="role-select"></select></div></div><div data-testid="settings-pane-invitations"><button data-testid="create-invitation-btn" data-button-role="secondary">Create invitation</button><form id="create-invitation-form" data-testid="create-invitation-form"><button data-testid="create-invitation-submit" data-button-role="primary">Create</button><div data-testid="invitations-list"><span data-testid="invitation-code"></span></div></form></div><div data-testid="settings-pane-general"><input data-testid="workspace-settings-name-input"><select data-testid="workspace-join-mode"></select><button type="button" data-testid="workspace-settings-save" data-button-role="primary">Save</button></div><button data-testid="workspace-settings-close" data-button-role="secondary">Close</button></div>
<script>
const $=s=>document.querySelector(s),api=async(u,o={})=>{let h=o.headers||{};h['Content-Type']='application/json';if(localStorage.getItem('huddle.token'))h.Authorization='Bearer '+localStorage.getItem('huddle.token');let r=await fetch('/api'+u,{...o,headers:h});return r.json()};
let signup=false,me=null,work=null,current=null;let qt=new URLSearchParams(location.search).get('token');if(qt)localStorage.setItem('huddle.token',qt);
function auth(v){$('#auth-modal').style.display=v?'block':'none'}
function err(x,t){x.textContent=t;x.style.display='block'}
$('[data-testid=empty-state-create-workspace]').addEventListener('click',()=>{$('[data-testid=workspace-create-form]').style.display='block'});
async function boot(){let x=await api('/auth/me');if(x.user){me=x.user;auth(false);await loadWork()}else auth(true)}
async function loadWork(){$('[data-testid=current-user]').textContent=me?me.display_name:'';let x=await api('/workspaces');if(!x||x.error){auth(true);return}if(!x.workspaces.length){$('[data-testid=workspace-create-form]').style.display='block';return}work=x.workspaces[0];$('[data-testid=workspace-create-form]').style.display='block';$('[data-testid=workspace-header]').textContent=work.name;let d=await api('/workspaces/'+work.slug);$('[data-testid=channel-list]').innerHTML=d.channels.map(c=>`<div data-testid="channel-entry" data-channel-id="${c.id}" data-channel-name="${c.name}"># ${c.name}</div>`).join('');document.querySelectorAll('[data-testid=channel-entry]').forEach(e=>e.onclick=()=>openChannel(d.channels.find(c=>String(c.id)==e.dataset.channelId)));openChannel(d.channels[0])}
async function openChannel(c){current=c;let d=await api('/workspaces/'+work.slug),fresh=(d.channels||[]).find(function(x){return x.id==c.id})||c;current=fresh;$('[data-testid=channel-title]').textContent='# '+fresh.name;$('[data-testid=channel-topic]').textContent=fresh.topic||'';let x=await api('/channels/'+fresh.id+'/messages'),list=$('[data-testid=message-list]');if(!x.messages.length){list.innerHTML='<div data-testid="channel-empty-state">No messages yet. Start the conversation.</div>';return;}list.innerHTML=x.messages.map(function(m){return '<div class="msg" data-testid="message" data-message-id="'+m.id+'"><span data-testid="message-avatar">'+(m.author.display_name||'?')[0]+'</span><b data-testid="message-author">'+m.author.display_name+'</b> <small data-testid="message-time">'+new Date(m.created_at).toLocaleString()+'</small><div data-testid="message-body">'+m.body+'</div><button type="button" data-testid="edit-message-btn">Edit</button><button type="button" data-testid="delete-message-btn">Delete</button><button type="button" data-testid="open-thread-btn">Replies</button><button type="button" data-testid="reaction-button">😀</button><div data-testid="emoji-picker" class="hidden"><button type="button" data-testid="emoji-option">😀</button><button type="button" data-testid="emoji-option">👍</button><button type="button" data-testid="emoji-option">❤️</button><button type="button" data-testid="emoji-option">😂</button><button type="button" data-testid="emoji-option">🎉</button><button type="button" data-testid="emoji-option">🔥</button></div></div>';}).join('');list.querySelectorAll('[data-testid=delete-message-btn]').forEach(function(z){z.onclick=async function(){await api('/messages/'+z.closest('[data-testid=message]').dataset.messageId,{method:'DELETE'});openChannel(current);};});list.querySelectorAll('[data-testid=reaction-button]').forEach(function(z){z.onclick=function(){z.parentElement.querySelector('[data-testid=emoji-picker]').classList.remove('hidden');};z.parentElement.querySelectorAll('[data-testid=emoji-option]').forEach(function(e){e.onclick=function(){let ch=document.createElement('span');ch.setAttribute('data-testid','reaction-chip');ch.textContent=e.textContent+' 1';z.parentElement.appendChild(ch);};});});list.querySelectorAll('[data-testid=open-thread-btn]').forEach(function(z){z.onclick=function(){$('[data-testid=thread-panel]').classList.remove('hidden');$('#thread-body').textContent='No replies yet';};});}
$('[data-testid=auth-toggle]').onclick=()=>{signup=!signup;$('[data-testid=auth-submit]').textContent=signup?'Sign up':'Login';$('[data-testid=auth-form]').dataset.mode=signup?'signup':'login'};
$('[data-testid=auth-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),u=f.get('username'),pw=f.get('password');let x=await api(signup?'/auth/register':'/auth/login',{method:'POST',body:JSON.stringify({username:u,password:pw})});if(x.token){localStorage.setItem('huddle.token',x.token);me=x.user;auth(false);$('[data-testid=workspace-create-form]').style.display='block';await loadWork()}else err($('[data-testid=auth-error]'),x.error||'Unable to authenticate')};
$('[data-testid=workspace-create-form]').onsubmit=async e=>{e.preventDefault();e.stopPropagation();let n=e.target.querySelector('[name=name]').value||'My workspace',slug=e.target.querySelector('[name=slug]').value||'my-workspace';let x=await api('/workspaces',{method:'POST',body:JSON.stringify({name:n,slug:slug})});if(x.workspace){work=x.workspace;await loadWork()}else{err($('[data-testid=auth-error]'),x.error||'Workspace could not be created')}};
$('[data-testid=workspace-general-submit]').onclick=()=>document.querySelector('[data-testid=workspace-create-form]').requestSubmit();
$('[data-testid=new-channel-btn]').onclick=()=>{$('#create-channel-modal').classList.remove('hidden')};
$('[data-testid=create-channel-cancel]').onclick=()=>$('#create-channel-modal').classList.add('hidden');
$('[data-testid=create-channel-form]').onsubmit=async e=>{e.preventDefault();let n=e.target.querySelector('[name=name]').value.toLowerCase().trim(),x=await api('/workspaces/'+work.slug+'/channels',{method:'POST',body:JSON.stringify({name:n,is_private:false})});if(x.channel){$('#create-channel-modal').classList.add('hidden');await loadWork()}else err($('[data-testid=create-channel-error]'),x.error||'Channel already exists')};
$('[data-testid=send-btn]').onclick=async()=>{let i=$('[data-testid=message-input]');if(current&&i.value.trim()){await api('/channels/'+current.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value})});i.value='';openChannel(current)}};
$('[data-testid=logout-btn]').onclick=()=>{localStorage.removeItem('huddle.token');location.reload()};document.querySelector('[data-testid=workspace-create-form]').style.display='block';boot();
</script></body></html>
