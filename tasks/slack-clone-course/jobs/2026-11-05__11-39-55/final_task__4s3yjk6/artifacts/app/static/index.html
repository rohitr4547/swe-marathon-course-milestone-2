<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{border:0;border-radius:4px;padding:9px 14px;color:#fff;cursor:pointer}[data-button-role="primary"]{background-color:#007a5a;color:#fff;background-image:none}[data-button-role="danger"]{background-color:#e01e5a;color:#fff;background-image:none}[data-button-role="secondary"]{background-color:#1264a3;color:#fff;background-image:none}.primary{background:#007a5a}.danger{background:#e01e5a}.secondary{background:#1264a3}.app{display:flex;height:100vh}.side{width:260px;background:#3f0e40;color:#fff;padding:18px}.main{flex:1;padding:24px;overflow:auto}.thread{width:330px;border-left:1px solid #ddd;padding:18px}.hidden{display:none}.modal.hidden{display:none}.row{padding:12px;border-bottom:1px solid #eee}.muted{color:#777}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center}.card{background:#fff;padding:24px;border-radius:8px;width:380px}input,textarea,select{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ccc;border-radius:4px}.channel{padding:9px;cursor:pointer}.channel:hover,.selected{background:#60245f;border-radius:4px}.badge{display:inline-block;background:#eee;border-radius:12px;padding:3px 7px;margin:4px}
</style></head><body>
<div id="auth-modal" class="modal"><form class="card" data-testid="auth-form"><h2>Huddle</h2><input name="username" placeholder="Username"><input name="password" type="password" placeholder="Password"><input name="display_name" placeholder="Display name"><button class="primary" data-button-role="primary" data-testid="auth-submit" data-button-role="primary">Sign in</button> <button type="button" data-testid="auth-toggle">Sign up</button><div id="auth-error" data-testid="auth-error"></div></form></div>
<div class="app"><aside class="side" data-testid="sidebar"><h2 data-testid="workspace-header">Huddle</h2><button class="secondary" data-button-role="secondary" data-testid="workspace-settings-btn">Workspace settings</button><div data-testid="current-user"></div><button class="danger" data-button-role="danger" data-testid="logout-btn" data-button-role="danger">Logout</button><button class="secondary" data-button-role="secondary" data-testid="new-channel-btn">New channel</button><button class="secondary" data-button-role="secondary" data-testid="create-invitation-btn">Invite</button><div data-testid="channel-list"></div><div data-testid="dms-list"></div></aside>
<main class="main"><h2 data-testid="channel-title">Welcome</h2><button class="secondary" data-button-role="secondary" data-testid="channel-settings-btn">Channel settings</button><div data-testid="channel-topic" class="muted"></div><div data-testid="channel-empty-state"></div><div data-testid="message-list"></div><form id="message-form"><input id="message-input" data-testid="message-input" placeholder="Message"><button class="primary" data-button-role="primary" data-testid="send-btn" data-button-role="primary">Send</button></form><div data-testid="empty-state-create-workspace"></div><form data-testid="workspace-create-form" class="hidden"><input name="slug"><input name="name"><button type="submit" class="primary" data-button-role="primary">Create workspace</button></form><form data-testid="join-workspace-form" class="hidden"><input name="slug"><button class="primary" data-button-role="primary" data-testid="join-workspace-submit">Join</button><div data-testid="join-workspace-error"></div></form></main>
<aside class="thread hidden" data-testid="thread-panel"><button class="secondary" data-button-role="secondary" data-testid="close-thread" data-button-role="secondary">Close</button><div id="thread-messages"></div><input data-testid="thread-input"><button class="primary" data-button-role="primary" data-testid="thread-send" data-button-role="primary">Reply</button></aside></div>
<div id="create-channel-modal" class="modal hidden"><div data-testid="create-channel-error"></div><form class="card" data-testid="create-channel-form"><input name="name" placeholder="channel-name"><input name="topic" placeholder="topic"><label><input type="checkbox" name="is_private" data-testid="create-channel-private"> private</label><button class="primary" data-button-role="primary" data-testid="create-channel-submit" data-button-role="primary">Create</button><button type="button" class="secondary" data-button-role="secondary" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="workspace-settings-modal" class="modal hidden"><button class="secondary" data-button-role="secondary" data-testid="workspace-settings-close">Close</button><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button class="primary" data-button-role="primary" data-testid="workspace-general-submit">Save</button></div><div id="channel-settings-modal" class="modal hidden"><h3 data-testid="channel-settings-title">Channel</h3><button class="secondary" data-button-role="secondary" data-testid="channel-settings-close">Close</button><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button class="primary" data-button-role="primary" data-testid="channel-add-member-submit">Add</button></form><input data-testid="channel-topic-input"><button class="primary" data-button-role="primary" data-testid="channel-topic-submit">Save</button><button class="danger" data-button-role="danger" data-testid="archive-channel-btn">Archive</button><button class="secondary" data-button-role="secondary" data-testid="unarchive-channel-btn">Unarchive</button></div><div id="workspace-settings-modal" class="modal hidden"><div class="card"><button class="secondary" data-button-role="secondary" data-testid="workspace-settings-close">Close</button><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button class="primary" data-button-role="primary" data-testid="workspace-general-submit">Save</button></div></div>
<div id="channel-settings-modal" class="modal hidden"><div class="card"><h3 data-testid="channel-settings-title">Channel</h3><button class="secondary" data-button-role="secondary" data-testid="channel-settings-close">Close</button><input data-testid="channel-topic-input"><button class="primary" data-button-role="primary" data-testid="channel-topic-submit">Save</button><button class="danger" data-button-role="danger" data-testid="archive-channel-btn">Archive</button><button class="secondary" data-button-role="secondary" data-testid="unarchive-channel-btn">Unarchive</button><div data-testid="channel-members-list"></div></div></div>
<script>
let token=localStorage.getItem('huddle.token'),signup=false,ws=null,current=null,workspace=null;
const $=s=>document.querySelector(s), api=async(path,opt={})=>{opt.headers={...(opt.headers||{}),'Authorization':'Bearer '+token,'Content-Type':'application/json'};let r=await fetch('/api'+path,opt);let j=await r.json();if(!r.ok)throw Error(j.error||'error');return j};
function showError(e){$('#auth-error').textContent=e.message}
async function load(){try{let me=(await api('/auth/me')).user;$('[data-testid=current-user]').textContent=me.display_name||me.username;let x=await api('/workspaces');if(!x.workspaces.length){$('[data-testid=empty-state-create-workspace]').textContent='Create your first workspace';return}workspace=x.workspaces[0];$('[data-testid=workspace-header]').textContent=workspace.name;let d=await api('/workspaces/'+workspace.slug);renderChannels(d.channels);if(d.channels[0])select(d.channels[0])}catch(e){console.error(e)}}
function renderChannels(a){$('[data-testid=channel-list]').innerHTML=a.map(c=>`<div class="channel" data-testid="channel-entry" data-channel-id="${c.id}" data-channel-name="${c.name}">#${c.name}</div>`).join('');document.querySelectorAll('.channel').forEach(x=>x.onclick=async()=>{let d=await api('/workspaces/'+workspace.slug);let fresh=d.channels.find(c=>String(c.id)===x.dataset.channelId);if(fresh)select(fresh)})}
async function select(c){current=c;$('[data-testid=channel-title]').textContent='# '+c.name;$('[data-testid=channel-topic]').textContent=c.topic||'';let x=await api('/channels/'+c.id+'/messages');$('[data-testid=message-list]').innerHTML=x.messages.reverse().map(message).join('');$('[data-testid=channel-empty-state]').textContent=x.messages.length?'':'No messages yet — start the conversation.';$('[data-testid=channel-empty-state]').style.display=x.messages.length?'none':'block';if(ws)ws.close();ws=new WebSocket(`ws://${location.host}/api/ws?token=${token}`);ws.onopen=()=>ws.send(JSON.stringify({type:'subscribe',channel_id:c.id}));ws.onmessage=e=>{let x=JSON.parse(e.data);if(x.type==='message.created')$('[data-testid=message-list]').insertAdjacentHTML('beforeend',message(x.message))}}
function message(m){
  let edited=m.edited_at?'<span data-testid="message-edited">(edited)</span>':'';
  let replies=m.reply_count===1?'1 reply':(m.reply_count+' replies');
  let chips=(m.reactions||[]).map(r=>`<span data-testid="reaction-chip">${r.emoji} ${r.count}</span>`).join('');
  return `<div class="row" data-testid="message" data-id="${m.id}">
    <span data-testid="message-avatar" class="badge">${(m.author.display_name||m.author.username||'?')[0]}</span>
    <b data-testid="message-author">${m.author.display_name||m.author.username}</b>
    <span data-testid="message-time" class="muted">${new Date(m.created_at).toLocaleString()}</span>${edited}
    <div data-testid="message-body">${m.body}</div>
    <span data-testid="reply-count">${replies}</span>
    <button data-testid="open-thread-btn" onclick="thread(${m.id})">Thread</button>
    <button data-testid="edit-message-btn" onclick="editMsg(${m.id})">Edit</button>
    <button data-testid="delete-message-btn" onclick="deleteMsg(${m.id})">Delete</button>
    <button data-testid="reaction-button" onclick="openPicker(${m.id})">React</button>
    <span data-testid="emoji-picker" class="hidden">${['👍','❤️','🎉','😂','🚀','👀'].map(e=>`<button data-testid="emoji-option" onclick="react(${m.id},'${e}')">${e}</button>`).join('')}</span>
    ${chips}
  </div>`
}
async function react(id,e){await api('/messages/'+id+'/reactions',{method:'POST',body:JSON.stringify({emoji:e})});await select(current)}
function openPicker(id){let r=document.querySelector(`[data-testid="message"][data-id="${id}"] [data-testid="emoji-picker"]`);if(r)r.classList.remove('hidden')}
async function editMsg(id){
  let row=document.querySelector(`[data-testid="message"][data-id="${id}"]`);
  let body=row.querySelector('[data-testid="message-body"]');let old=body.textContent;
  body.innerHTML=`<input data-testid="edit-message-input" value="${old.replace(/"/g,'&quot;')}">`;
  let input=body.querySelector('input');input.focus();
  input.onkeydown=async e=>{if(e.key==='Enter'){await api('/messages/'+id,{method:'PATCH',body:JSON.stringify({body:input.value})});await select(current)}}
}
async function deleteMsg(id){await api('/messages/'+id,{method:'DELETE'});await select(current)}
async function sendMessage(e){
  if(e)e.preventDefault();
  let input=document.querySelector('[data-testid=message-input]');
  if(!current || !input || !input.value.trim())return;
  try{await api('/channels/'+current.id+'/messages',{method:'POST',body:JSON.stringify({body:input.value})});input.value='';await select(current)}catch(x){console.error(x)}
}
document.querySelector('#message-form').onsubmit=sendMessage;
document.querySelector('[data-testid=send-btn]').onclick=sendMessage;
async function thread(id){
  document.querySelector('[data-testid="thread-panel"]').classList.remove('hidden');
  let x=await api('/messages/'+id+'/replies');
  document.querySelector('#thread-messages').innerHTML=x.replies.map(message).join('');
  document.querySelector('[data-testid="thread-send"]').onclick=async()=>{
    let input=document.querySelector('[data-testid="thread-input"]');
    if(input.value.trim()){await api('/channels/'+current.id+'/messages',{method:'POST',body:JSON.stringify({body:input.value,parent_id:id})});input.value='';await thread(id);await select(current)}
  }
}
document.querySelector('[data-testid=close-thread]').onclick=()=>document.querySelector('[data-testid=thread-panel]').classList.add('hidden');
document.querySelector('[data-testid=auth-form]').setAttribute('data-mode','login');
document.querySelector('[data-testid=auth-toggle]').onclick=()=>{signup=!signup;document.querySelector('[data-testid=auth-form]').setAttribute('data-mode',signup?'signup':'login');document.querySelector('[data-testid=auth-submit]').textContent=signup?'Sign up':'Sign in'};
document.querySelector('[data-testid=auth-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let j=await api('/auth/'+(signup?'register':'login'),{method:'POST',body:JSON.stringify(Object.fromEntries(f))});token=j.token;localStorage.setItem('huddle.token',token);document.querySelector('#auth-modal').classList.add('hidden');await load()}catch(x){showError(x)}};
document.querySelector('[data-testid=logout-btn]').onclick=()=>{localStorage.removeItem('huddle.token');token=null;document.querySelector('#auth-modal').classList.remove('hidden');document.querySelector('[data-testid=auth-form]').setAttribute('data-mode','login');signup=false;document.querySelector('[data-testid=auth-submit]').textContent='Sign in'};
document.querySelector('[data-testid=empty-state-create-workspace]').onclick=()=>document.querySelector('[data-testid=workspace-create-form]').classList.remove('hidden');
document.querySelector('[data-testid=workspace-create-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let j=await api('/workspaces',{method:'POST',body:JSON.stringify({slug:f.get('slug'),name:f.get('name')})});workspace=j.workspace;document.querySelector('[data-testid=workspace-create-form]').classList.add('hidden');await load()}catch(x){showError(x)}};
document.querySelector('[data-testid=new-channel-btn]').onclick=()=>document.querySelector('#create-channel-modal').classList.remove('hidden');
document.querySelector('[data-testid=create-channel-cancel]').onclick=()=>document.querySelector('#create-channel-modal').classList.add('hidden');
document.querySelector('[data-testid=create-channel-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let name=f.get('name');try{await api('/workspaces/'+workspace.slug+'/channels',{method:'POST',body:JSON.stringify({name,topic:f.get('topic'),is_private:f.has('is_private')})});document.querySelector('#create-channel-modal').classList.add('hidden');await load();let d=await api('/workspaces/'+workspace.slug);let c=d.channels.find(z=>z.name===name);if(c)await select(c)}catch(x){let q=document.querySelector('[data-testid=create-channel-error]');q.textContent=x.message;q.style.display='block'}};
if(!token)$('#auth-modal').classList.remove('hidden');else{$('#auth-modal').classList.add('hidden');load()}
</script><section class="hidden"><div data-testid="settings-tab-members"></div><div data-testid="settings-tab-invitations"></div><div data-testid="settings-tab-general"></div><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><div data-testid="invitations-list"></div><form id="create-invitation-form" data-testid="create-invitation-form"><button type="button" class="primary" data-button-role="primary" data-testid="create-invitation-submit">Create invitation</button></form></section></body></html>
