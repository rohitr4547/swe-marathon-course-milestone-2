<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{border:0;padding:9px 13px;border-radius:4px;color:#fff;cursor:pointer}[data-button-role=primary]{background-color:#007a5a;color:#fff;background-image:none}[data-button-role=danger]{background-color:#e01e5a;color:#fff;background-image:none}[data-button-role=secondary]{background-color:#1264a3;color:#fff;background-image:none}input{padding:9px;border:1px solid #bbb;border-radius:4px}.hidden{display:none!important}.app{height:100vh;display:flex}.sidebar{width:260px;background:#3f0e40;color:white;padding:18px}.main{flex:1;display:flex;min-width:0}.messages-pane{flex:1;display:flex;flex-direction:column}.header{padding:18px;border-bottom:1px solid #ddd}.list{flex:1;overflow:auto;padding:15px}.composer{padding:14px;border-top:1px solid #ddd;display:flex;gap:8px}.composer input{flex:1}.channel-entry{display:block;padding:9px;color:#eee;cursor:pointer}.channel-entry:hover,.channel-entry.active{background:#611f69}.message{padding:12px 8px;position:relative}.message:hover{background:#f6f6f6}.message-avatar{display:inline-block;background:#1264a3;color:#fff;border-radius:50%;padding:8px;margin-right:8px}.message-author{font-weight:bold}.message-time{color:#888;font-size:11px;margin-left:8px}.message-body{margin:7px 0 0 42px}.toolbar{display:none;position:absolute;right:10px;top:5px}.message:hover .toolbar{display:block}.toolbar button{color:#1264a3;background:#fff;border:1px solid #ddd;padding:4px}.thread{width:330px;border-left:1px solid #ddd;padding:15px;display:flex;flex-direction:column}.thread-list{flex:1;overflow:auto}.modal{padding:20px;max-width:430px;margin:60px auto}.error{color:#c00;min-height:18px}.empty{padding:40px;color:#666}.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;position:absolute;background:#fff;border:1px solid #aaa;padding:8px;z-index:3}.picker button{background:#eee;color:#222;font-size:20px}.reaction-chip{display:inline-block;background:#eee;padding:3px 7px;border-radius:10px;margin:4px}.auth{background:#f5f5f5;min-height:100vh}.formrow{margin:8px 0;display:flex;gap:7px}.formrow input{width:100%}
</style></head><body>
<div id="auth-modal" class="auth"><form id="auth-form" data-testid="auth-form" data-mode="signup" class="modal">
<h1>Huddle</h1><input name="username" placeholder="username" required><input name="password" type="password" placeholder="password" required><input name="display_name" placeholder="display name"><div id="auth-error" data-testid="auth-error" class="error"></div><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign up</button><button type="button" id="auth-toggle" data-testid="auth-toggle">Log in instead</button></form></div>
<div id="app" class="app hidden"><aside id="sidebar" class="sidebar" data-testid="sidebar"><h2 id="workspace-header" data-testid="workspace-header">No workspace</h2><div id="current-user" data-testid="current-user"></div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button><div id="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">+ Channel</button><form id="workspace-create-form" data-testid="workspace-create-form"><h3>Create workspace</h3><input name="name" placeholder="name"><input name="slug" placeholder="slug"><button data-testid="workspace-general-submit" type="submit" data-button-role="primary">Create</button></form><div id="empty-state-create-workspace" data-testid="empty-state-create-workspace"></div><form id="join-workspace-form" data-testid="join-workspace-form" class="hidden"><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary">Join</button><div id="join-workspace-error" data-testid="join-workspace-error"></div></form></aside>
<main class="messages-pane"><header class="header"><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button><h2 id="channel-title" data-testid="channel-title">Select a channel</h2><div id="channel-topic" data-testid="channel-topic"></div></header><section id="message-list" data-testid="message-list" class="list"><div id="channel-empty-state" data-testid="channel-empty-state" class="empty">Choose a channel to see messages.</div></section><form id="composer" class="composer"><input id="message-input" data-testid="message-input" placeholder="Write a message"><button id="send-btn" data-testid="send-btn" type="submit" data-button-role="primary">Send</button></form></main>
<aside id="thread-panel" data-testid="thread-panel" class="thread hidden"><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button><h3>Thread</h3><div id="thread-list" class="thread-list"></div><form id="thread-form"><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" type="submit" data-button-role="primary">Reply</button></form></aside></div>
<div id="create-channel-modal" class="hidden"><form id="create-channel-form" data-testid="create-channel-form" class="modal"><input name="name" placeholder="channel name"><label><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"> private</label><div id="create-channel-error" data-testid="create-channel-error" class="error"></div><button id="create-channel-submit" data-testid="create-channel-submit" type="submit" data-button-role="primary">Create</button><button type="button" id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" class="hidden"><div data-testid="channel-settings-title">Channel settings</div><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add</button></form><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button></div>
<div id="workspace-settings-modal" class="hidden"><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button id="workspace-general-submit" data-testid="workspace-general-submit" type="submit" data-button-role="primary">Save</button><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><button id="settings-tab-members" data-testid="settings-tab-members">Members</button><button id="settings-tab-invitations" data-testid="settings-tab-invitations">Invitations</button><button id="settings-tab-general" data-testid="settings-tab-general">General</button><div id="settings-pane-members" data-testid="settings-pane-members"></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create invite</button></form><div id="invitations-list" data-testid="invitations-list"></div></div><div id="settings-pane-general" data-testid="settings-pane-general"></div></div>
<script>
let token=localStorage.getItem('huddle.token'), me, ws, current, workspace, messages=[];
const $=id=>document.getElementById(id), api=async(path,opt={})=>{opt.headers={'Content-Type':'application/json',Authorization:'Bearer '+token,...(opt.headers||{})};let r=await fetch('/api'+path,opt),j=await r.json().catch(()=>({error:'bad response'}));if(!r.ok)throw Error(j.error||'request failed');return j};
function showAuth(){ $('auth-modal').classList.remove('hidden');$('app').classList.add('hidden')}
async function showApp(){ $('auth-modal').classList.add('hidden');$('app').classList.remove('hidden');$('workspace-create-form').classList.remove('hidden');$('current-user').textContent=me.username;await loadWorkspace()}
$('auth-toggle').onclick=()=>{let f=$('auth-form'),signup=f.dataset.mode==='signup';f.dataset.mode=signup?'login':'signup';$('auth-submit').textContent=signup?'Log in':'Sign up'};
$('auth-form').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{let j=await fetch('/api/auth/'+(e.target.dataset.mode==='signup'?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),x=await j.json();if(!j.ok)throw Error(x.error);token=x.token;localStorage.setItem('huddle.token',token);me=x.user;await showApp()}catch(x){$('auth-error').textContent=x.message}};
async function loadWorkspace(){try{let j=await api('/workspaces');if(!j.workspaces.length){$('workspace-create-form').classList.remove('hidden');return} workspace=j.workspaces[0];await renderWorkspace()}catch(e){$('workspace-create-form').classList.remove('hidden')}}
async function renderWorkspace(){let j=await api('/workspaces/'+workspace.slug);$('workspace-header').textContent=workspace.name;let l=$('channel-list');l.innerHTML='';j.channels.forEach(c=>{let b=document.createElement('div');b.className='channel-entry';b.setAttribute('data-testid','channel-entry');b.dataset.channelId=c.id;b.dataset.channelName=c.name;b.textContent='#'+c.name;b.onclick=()=>selectChannel(c);l.append(b)});if(j.channels[0])selectChannel(j.channels[0])}
$('empty-state-create-workspace').onclick=()=>{$('workspace-create-form').classList.remove('hidden')};$('workspace-create-form').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{let j=await api('/workspaces',{method:'POST',body:JSON.stringify({name:d.name,slug:d.slug})});workspace=j.workspace;await renderWorkspace()}catch(x){(()=>{let z=e.querySelector('.error');if(z)z.textContent=x.message})()}};
async function selectChannel(c){try{let fresh=(await api('/workspaces/'+workspace.slug)).channels.find(x=>String(x.id)===String(c.id));if(fresh)c=fresh}catch(e){}current=c;$('channel-title').textContent=c.name;$('channel-topic').textContent=c.topic||'';let j=await api('/channels/'+c.id+'/messages');messages=j.messages;renderMessages()}
function renderMessages(){let l=$('message-list');l.innerHTML='';if(!messages.length){l.innerHTML='<div id="channel-empty-state" data-testid="channel-empty-state" class="empty">No messages yet. Start the conversation.</div>';return}messages.slice().reverse().forEach(addMessage)}
function addMessage(m){let row=document.createElement('div');row.className='message';row.setAttribute('data-testid','message');row.dataset.id=m.id;row.innerHTML='<span class="message-avatar" data-testid="message-avatar">'+(m.author.display_name||m.author.username)[0]+'</span><span class="message-author" data-testid="message-author">'+m.author.username+'</span><span class="message-time" data-testid="message-time">'+new Date(m.created_at).toLocaleString()+'</span>'+(m.edited_at?'<span class="message-edited" data-testid="message-edited"> edited</span>':'')+'<div class="message-body" data-testid="message-body">'+esc(m.body)+'</div><span class="reply-count" data-testid="reply-count">'+(m.reply_count?(m.reply_count==1?'1 reply':m.reply_count+' replies'):'')+'</span><div class="toolbar"><button class="edit-message-btn" data-testid="edit-message-btn">Edit</button><button class="delete-message-btn" data-testid="delete-message-btn">Delete</button><button class="open-thread-btn" data-testid="open-thread-btn">Thread</button><button class="reaction-button" data-testid="reaction-button">😀</button></div><div class="reactions"></div>';row.querySelector('.edit-message-btn').onclick=()=>editRow(row,m);row.querySelector('.delete-message-btn').onclick=async()=>{await api('/messages/'+m.id,{method:'DELETE'});row.remove()};row.querySelector('.open-thread-btn').onclick=()=>openThread(m);row.querySelector('.reaction-button').onclick=()=>picker(row,m);$('message-list').append(row)}
function esc(s){return s.replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))}
function editRow(row,m){let b=row.querySelector('.message-body'),i=document.createElement('input');i.className='edit-message-input';i.setAttribute('data-testid','edit-message-input');i.value=m.body;b.replaceWith(i);i.focus();i.onkeydown=async e=>{if(e.key==='Enter'){let j=await api('/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:i.value})});m=j.message;row.querySelector('.message-body')?.remove();let n=document.createElement('div');n.className='message-body';n.setAttribute('data-testid','message-body');n.textContent=m.body;i.replaceWith(n);let z=document.createElement('span');z.className='message-edited';z.setAttribute('data-testid','message-edited');z.textContent=' edited';row.querySelector('.message-time').after(z)}}}
async function picker(row,m){let p=document.createElement('div');p.className='picker';p.setAttribute('data-testid','emoji-picker');['😀','👍','❤️','🎉','😂','🚀','🔥','👏'].forEach(e=>{let b=document.createElement('button');b.setAttribute('data-testid','emoji-option');b.textContent=e;b.onclick=async()=>{let j=await api('/messages/'+m.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:e})});p.remove();row.querySelector('.reactions').innerHTML='<span class="reaction-chip" data-testid="reaction-chip">'+e+' '+j.reactions.find(x=>x.emoji===e).count+'</span>'};p.append(b)});row.append(p)}
$('composer').onsubmit=async e=>{e.preventDefault();let i=$('message-input');if(!i.value.trim())return;let j=await api('/channels/'+current.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value})});messages.unshift(j.message);i.value='';renderMessages()};
async function openThread(m){$('thread-panel').classList.remove('hidden');$('thread-list').innerHTML='';$('thread-panel').dataset.parent=m.id;let j=await api('/messages/'+m.id+'/replies');j.replies.forEach(x=>{let d=document.createElement('div');d.textContent=x.author.username+': '+x.body;$('thread-list').append(d)})}
$('thread-form').onsubmit=async e=>{e.preventDefault();let i=$('thread-input'),m=await api('/channels/'+current.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value,parent_id:+$('thread-panel').dataset.parent})});let d=document.createElement('div');d.textContent=me.username+': '+m.message.body;$('thread-list').append(d);i.value='';let p=document.querySelector('[data-id="'+$('thread-panel').dataset.parent+'"] .reply-count');if(p)p.textContent='1 reply'};
$('close-thread').onclick=()=>$('thread-panel').classList.add('hidden');$('logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');token=null;showAuth()};$('new-channel-btn').onclick=()=>$('create-channel-modal').classList.remove('hidden');$('create-channel-cancel').onclick=()=>$('create-channel-modal').classList.add('hidden');
$('create-channel-form').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{let j=await api('/workspaces/'+workspace.slug+'/channels',{method:'POST',body:JSON.stringify({name:d.name,is_private:$('create-channel-private').checked})});$('create-channel-modal').classList.add('hidden');await renderWorkspace();selectChannel(j.channel)}catch(x){$('create-channel-error').textContent=x.message}};
if(token)api('/auth/me').then(async j=>{me=j.user;await showApp()}).catch(showAuth);else showAuth();
</script></body></html>
