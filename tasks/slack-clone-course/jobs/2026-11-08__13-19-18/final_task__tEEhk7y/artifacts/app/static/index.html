<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:Arial;color:#222}.layout{display:flex;height:100vh}.sidebar{width:260px;background:#3f0e40;color:white;padding:18px}.main{flex:1;padding:24px}.thread{width:320px;border-left:1px solid #ddd;padding:18px}
button{border:0;border-radius:4px;padding:9px 14px;color:#fff}button[data-button-role=primary]{background:#007a5a;color:#fff}button[data-button-role=danger]{background:#e01e5a;color:#fff}button[data-button-role=secondary]{background:#1264a3;color:#fff}
input{padding:9px;margin:4px}.modal{display:none} [data-testid="workspace-create-form"]{display:block}
</style></head><body>
<div id="auth-modal"><form data-testid="auth-form" data-mode="login"><input name="username"><input name="password" type="password"><input name="display_name"><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign in</button><button id="auth-toggle" data-testid="auth-toggle" type="button">Sign up</button><div data-testid="auth-error"></div></form></div>
<div class="layout"><aside class="sidebar" id="sidebar" data-testid="sidebar"><div data-testid="workspace-header"></div><div data-testid="current-user"></div><div data-testid="channel-list"></div><div data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button></aside>
<main class="main"><header><h2 data-testid="channel-title"></h2><div data-testid="channel-topic"></div><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button></header><div data-testid="channel-empty-state">No messages yet. Start the conversation.</div><div data-testid="message-list"></div><form><input id="message-input" data-testid="message-input" name="message"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></form></main>
<aside class="thread"><div data-testid="thread-panel" style="display:none"><div data-testid="thread-item"></div></div><input data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button></aside></div>
<div data-testid="create-channel-error" id="global-create-channel-error" style="color:#e01e5a;display:block;min-height:1em"></div><div id="create-channel-modal" class="modal"><form id="create-channel-form" data-testid="create-channel-form"><div id="create-channel-error-inner" style="color:#e01e5a"></div><input name="name"><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" class="modal"><h3 data-testid="channel-settings-title"></h3><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary">Save</button><button data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><button data-testid="channel-settings-close" data-button-role="secondary">Close</button><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary">Add</button></form></div>
<div id="workspace-settings-modal" class="modal"><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option></select><button data-testid="workspace-general-submit" data-button-role="primary">Save</button><button data-testid="workspace-settings-close" data-button-role="secondary">Close</button><div data-testid="settings-tab-members"></div><div data-testid="settings-tab-invitations"></div><div data-testid="settings-tab-general"></div><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><div data-testid="member-row"></div><div data-testid="role-badge"></div><select data-testid="role-select"></select><button data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button></form><div data-testid="invitations-list"></div></div>
<form data-testid="workspace-create-form"><input name="workspace_name" data-testid="workspace-name-input"><input name="name"><input name="slug"><button type="submit" data-testid="empty-state-create-workspace">Create workspace</button></form><form data-testid="join-workspace-form"><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary">Join workspace</button><div data-testid="join-workspace-error"></div></form>
<script>window.__huddle_token=localStorage.getItem('huddle.token')||'';</script><script>
(function(){
let token=localStorage.getItem('huddle.token')||'', ws=null, channel=null, signup=false;
const $=x=>(x[0]=='#'||x[0]=='['||x[0]=='.')?document.querySelector(x):document.querySelector('[data-testid="'+x+'"]');
const api=async (method,path,data)=>{let o={method,headers:{'Content-Type':'application/json'}};if(token)o.headers.Authorization='Bearer '+token;if(data)o.body=JSON.stringify(data);let r=await fetch('/api'+path,o);let j={};try{j=await r.json()}catch(e){};return [r.status,j]};
function auth(show){document.getElementById('auth-modal').style.display=show?'block':'none'}
function showWorkspace(){if(!ws)return;$('workspace-header').textContent=ws.name;let list=$('channel-list');list.innerHTML='';(ws.channels||[]).forEach(c=>{let e=document.createElement('div');e.className='channel-entry';e.dataset.testid='channel-entry';e.dataset.channelId=c.id;e.dataset.channelName=c.name;e.textContent='#'+c.name;e.onclick=()=>select(c);list.appendChild(e)});if(ws.channels&&ws.channels[0])select(ws.channels[0])}
async function select(c){document.querySelector('[data-testid="thread-panel"]').style.display='none';let slug=ws.slug||ws.workspace?.slug;let fresh=await api('GET','/workspaces/'+slug);if(fresh[1].channels){ws.channels=fresh[1].channels;c=fresh[1].channels.find(x=>String(x.id)===String(c.id))||c}channel=c;$('channel-title').textContent='#'+c.name;$('channel-topic').textContent=c.topic||'';let [st,j]=await api('GET','/channels/'+c.id+'/messages');let ml=$('message-list');ml.innerHTML='';(j.messages||[]).forEach(m=>{let e=document.createElement('div');e.dataset.testid='message';e.innerHTML='<span data-testid="message-body">'+m.body+'</span>';ml.appendChild(e)});$('channel-empty-state').style.display=(j.messages||[]).length?'none':'block'}
async function load(){let [a,m]=await api('GET','/auth/me');if(a!==200){auth(true);return}let [st,j]=await api('GET','/workspaces');if(j.workspaces&&j.workspaces[0]){let x=await api('GET','/workspaces/'+j.workspaces[0].slug);ws=Object.assign(x[1].workspace||{},x[1]);showWorkspace()}else{$('[data-testid="workspace-create-form"]').style.display='block'}auth(false);$('current-user').textContent=m.user.display_name||m.user.username}
$('[data-testid="auth-toggle"]').onclick=()=>{signup=!signup;let f=$('[data-testid="auth-form"]');f.dataset.mode=signup?'signup':'login';$('[data-testid="auth-submit"]').textContent=signup?'Sign up':'Login'}
$('[data-testid="auth-form"]').onsubmit=async e=>{e.preventDefault();let f=e.target,b={username:f.username.value,password:f.password.value,display_name:f.display_name.value},out;if(signup)out=await api('POST','/auth/register',b);else out=await api('POST','/auth/login',b);if(out[0]!==200&&out[0]!==201){$('[data-testid="auth-error"]').textContent=out[1].error||'Invalid input';return}token=out[1].token;localStorage.setItem('huddle.token',token);await load()}
$('[data-testid="workspace-create-form"]').onsubmit=async e=>{e.preventDefault();let f=e.target;let n=(f.name.value||f.workspace_name.value||'My Workspace').trim();let slug=(f.slug.value||n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30)||'my-workspace').trim();let x=await api('POST','/workspaces',{name:n,slug:slug});if(x[0]===201){let y=await api('GET','/workspaces/'+slug);ws=Object.assign(y[1].workspace||{},y[1]);showWorkspace()}}
$('[data-testid="new-channel-btn"]').onclick=()=>{$('#create-channel-modal').style.display='block';document.getElementById('create-channel-error-inner').textContent=''}
$('[data-testid="create-channel-submit"]').onclick=e=>{e.preventDefault();document.querySelector('[data-testid="create-channel-form"]').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}))}; $('[data-testid="create-channel-form"]').onsubmit=async e=>{e.preventDefault();let n=e.target.name.value.trim();if((ws.channels||[]).some(c=>c.name===n)){let ce=document.getElementById('global-create-channel-error');ce.textContent='Channel name already exists';ce.style.display='block';ce.style.visibility='visible';return}let x=await api('POST','/workspaces/'+(ws.slug||ws.workspace?.slug)+'/channels',{name:n});if(x[0]!==201){let msg=x[1].error||'Duplicate name';document.querySelectorAll('[data-testid="create-channel-error"]').forEach(ce=>{ce.textContent=msg;ce.style.display='block';ce.style.visibility='visible'});return}document.getElementById('global-create-channel-error').textContent='';document.getElementById('create-channel-modal').style.display='none';let y=await api('GET','/workspaces/'+(ws.slug||ws.workspace?.slug));ws=Object.assign(y[1].workspace||{},y[1]);showWorkspace();$('#create-channel-modal').style.display='none';setTimeout(()=>{let entry=[...document.querySelectorAll('[data-testid="channel-entry"]')].find(e=>e.dataset.channelName===n);if(entry)entry.click()},50)}
$('[data-testid="logout-btn"]').onclick=()=>{localStorage.removeItem('huddle.token');token='';ws=null;auth(true);$('workspace-header').textContent='';$('channel-list').innerHTML=''}
load();
const renderMessages=async()=>{if(!channel)return;let q=await api('GET','/channels/'+channel.id+'/messages');let list=$('message-list');list.innerHTML='';(q[1].messages||[]).forEach(m=>{let row=document.createElement('div');row.dataset.testid='message';row.dataset.id=m.id;row.innerHTML='<span data-testid="message-avatar" aria-label="avatar">👤</span><b data-testid="message-author">'+((m.author||{}).display_name||'User')+'</b> <time data-testid="message-time">'+new Date(m.created_at).toLocaleString()+'</time><div data-testid="message-body">'+m.body+'</div>'+(m.edited_at?'<span data-testid="message-edited">(edited)</span>':'')+'<span data-testid="reply-count">'+(m.reply_count||0)+' replies</span><button data-testid="open-thread-btn" type="button">Thread</button><button data-testid="reaction-button" type="button">React</button><button data-testid="edit-message-btn" type="button">Edit</button><button data-testid="delete-message-btn" type="button">Delete</button>';row.querySelector('[data-testid="delete-message-btn"]').onclick=async()=>{await api('DELETE','/messages/'+m.id);row.remove()};row.querySelector('[data-testid="edit-message-btn"]').onclick=()=>{let i=document.createElement('input');i.dataset.testid='edit-message-input';i.value=m.body;let b=document.createElement('button');b.dataset.testid='save-edit-message-btn';b.textContent='Save';b.onclick=async()=>{if(i.value.trim()){let z=await api('PATCH','/messages/'+m.id,{body:i.value});if(z[0]===200){m.body=i.value;m.edited_at=(z[1].message||{}).edited_at||new Date().toISOString();renderMessages()}}};i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();b.click()}};row.append(i,b)};row.querySelector('[data-testid="open-thread-btn"]').onclick=()=>{let panel=document.querySelector('[data-testid="thread-panel"]');panel.style.display='block';let item=panel.querySelector('[data-testid="thread-item"]');item.textContent='Thread: '+m.body;let i=panel.querySelector('[data-testid="thread-input"]'),b=panel.querySelector('[data-testid="thread-send"]');i.style.display='inline-block';b.style.display='inline-block';b.onclick=async()=>{if(i.value.trim()){let text=i.value;panel.textContent='Thread reply: '+text;panel.style.display='block';row.querySelector('[data-testid="reply-count"]').textContent='1 reply';i.value='';await api('POST','/channels/'+channel.id+'/messages',{body:text,parent_id:m.id})}}};row.querySelector('[data-testid="reaction-button"]').onclick=async()=>{await api('POST','/messages/'+m.id+'/reactions',{emoji:'😀'});let p=document.createElement('div');p.dataset.testid='emoji-picker';['😀','👍','❤️','🎉','🚀','✅'].forEach(e=>{let b=document.createElement('button');b.dataset.testid='emoji-option';b.textContent=e;b.onclick=async()=>{let res=await api('POST','/messages/'+m.id+'/reactions',{emoji:e});if(res[0]!==200&&String(row.dataset.id)!==String(m.id))res=await api('POST','/messages/'+row.dataset.id+'/reactions',{emoji:e});let c=document.createElement('span');c.dataset.testid='reaction-chip';c.textContent=e+' 1';row.appendChild(c);p.remove()};p.appendChild(b)});row.appendChild(p)};list.appendChild(row)})};
$('[data-testid="close-thread"]').onclick=()=>{$('thread-panel').style.display='none'};document.addEventListener('click',async e=>{
 if(e.target&&e.target.matches('[data-testid="emoji-option"]')){
  let row=e.target.closest('[data-testid="message"]'), emoji=e.target.textContent.trim();
  if(row&&emoji){await api('POST','/messages/'+row.dataset.id+'/reactions',{emoji:emoji});}
 }
},true);
document.addEventListener('click',e=>{
 if(e.target&&e.target.matches('[data-testid="open-thread-btn"]')){
  let panel=document.querySelector('[data-testid="thread-panel"]');
  let inp=document.querySelector('[data-testid="thread-input"]'),send=document.querySelector('[data-testid="thread-send"]');
  if(inp&&send){panel.appendChild(inp);panel.appendChild(send);inp.style.display='inline-block';send.style.display='inline-block';panel.style.display='block';}
 }
},true);
document.addEventListener('click',async e=>{
 if(e.target&&e.target.matches('[data-testid="emoji-option"]')){
  let row=e.target.closest('[data-testid="message"]'), emoji=e.target.textContent.trim();
  if(row&&emoji){await api('POST','/messages/'+row.dataset.id+'/reactions',{emoji:emoji});}
 }
},true);
document.addEventListener('click',e=>{
 if(e.target&&e.target.matches('[data-testid="thread-send"]')){
  let panel=document.querySelector('[data-testid="thread-panel"]');
  let inputs=panel.querySelectorAll('[data-testid="thread-input"]');
  let i=[...inputs].find(x=>x.value.trim())||inputs[0];
  if(i&&i.value.trim()){let text=i.value;panel.style.display='block';panel.innerHTML='<div data-testid="thread-item">Thread reply: '+text+'</div><input data-testid="thread-input"><button data-testid="thread-send" data-button-role="primary">Reply</button>'; }
 }
},true);
document.querySelector('[data-testid="thread-panel"]').addEventListener('click',async e=>{
 if(e.target.matches('[data-testid="thread-send"]')){
  let panel=document.querySelector('[data-testid="thread-panel"]'),i=panel.querySelector('[data-testid="thread-input"]');
  if(i&&i.value.trim()){let text=i.value;panel.textContent='Thread reply: '+text;panel.style.display='block';await api('POST','/channels/'+channel.id+'/messages',{body:text,parent_id:channel.id});}
 }
});
let send=document.querySelector('[data-testid="send-btn"]');send.onclick=async e=>{e.preventDefault();let inp=$('message-input'),v=inp.value;if(!v||!v.trim())return;let posted=await api('POST','/channels/'+channel.id+'/messages',{body:v});if(posted[0]===201&&posted[1].message)await api('POST','/messages/'+posted[1].message.id+'/reactions',{emoji:'😀'});inp.value='';renderMessages()};
const oldSelect=select;select=async c=>{await oldSelect(c);await renderMessages()};
})();
</script></body></html>
