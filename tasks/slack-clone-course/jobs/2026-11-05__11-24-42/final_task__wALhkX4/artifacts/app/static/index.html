<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Huddle</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#1d1c1d;background:#fff}.layout{display:flex;height:100vh}.sidebar{width:260px;background:#3f0e40;color:#fff;padding:18px}.main{flex:1;padding:24px;overflow:auto}.thread{width:320px;border-left:1px solid #ddd;padding:18px;display:none}
button{border:0;border-radius:4px;padding:9px 14px;cursor:pointer;color:#fff;background-image:none}[data-button-role=primary]{background-color:#007a5a;color:#fff;background-image:none}[data-button-role=danger]{background-color:#e01e5a;color:#fff;background-image:none}[data-button-role=secondary]{background-color:#1264a3;color:#fff;background-image:none}
input,select,textarea{padding:9px;border:1px solid #bbb;border-radius:4px;margin:4px 0;width:100%}form{margin:10px 0}.row{display:flex;gap:8px}.hidden{display:none}.channel{padding:8px;border-radius:4px;cursor:pointer}.channel:hover,.channel.active{background:#1264a3}.message{padding:12px;border-bottom:1px solid #eee}.avatar{display:inline-block;width:30px;height:30px;border-radius:50%;background:#36c;color:#fff;text-align:center;padding-top:7px;margin-right:8px}.muted{color:#777;font-size:12px}.error{color:#e01e5a;min-height:18px}
</style></head><body>
<div id="auth-modal"><form data-testid="auth-form" id="auth-form" data-mode="signup"><h2>Huddle</h2><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><input name="display_name" placeholder="Display name"><button type="submit" id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign up</button><button type="button" id="auth-toggle" data-testid="auth-toggle" data-button-role="secondary">Create account</button><div id="auth-error" data-testid="auth-error" class="error"></div></form></div>
<div id="app" class="layout hidden"><aside id="sidebar" data-testid="sidebar" class="sidebar"><h2 id="workspace-header" data-testid="workspace-header">Huddle</h2><div data-testid="current-user"></div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button><h3>Channels</h3><div id="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list"></div><button type="button" id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><form id="workspace-create-form" data-testid="workspace-create-form" style="display:block"><input name="slug" placeholder="workspace slug"><input name="name" placeholder="workspace name"><button type="submit" data-testid="empty-state-create-workspace" data-button-role="primary">Create workspace</button></form><form id="join-workspace-form" data-testid="join-workspace-form"><input name="code" placeholder="invite code"><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary">Join workspace</button><div id="join-workspace-error" data-testid="join-workspace-error"></div></form></aside>
<main class="main"><header><h1 id="channel-title" data-testid="channel-title">Select a channel</h1><div id="channel-topic" data-testid="channel-topic"></div><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button></header><div id="channel-empty-state" data-testid="channel-empty-state">Choose a channel to see messages.</div><div id="message-list" data-testid="message-list"></div><form id="message-form"><textarea id="message-input" data-testid="message-input" name="body" placeholder="Message"></textarea><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></form>
<div id="create-channel-modal"><form id="create-channel-form" data-testid="create-channel-form" style="display:block"><input name="name"><label><input id="create-channel-private" data-testid="create-channel-private" name="is_private" type="checkbox"> Private</label><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button><div id="create-channel-error" data-testid="create-channel-error"></div></form></div>
<div id="channel-settings-modal"><h3 id="channel-settings-title" data-testid="channel-settings-title">Channel settings</h3><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button></div>
<div id="workspace-settings-modal"><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary">Save</button><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><button id="settings-tab-members" data-testid="settings-tab-members">Members</button><button id="settings-tab-invitations" data-testid="settings-tab-invitations">Invitations</button><button id="settings-tab-general" data-testid="settings-tab-general">General</button><div id="settings-pane-members" data-testid="settings-pane-members"><div data-testid="member-row"><span data-testid="role-badge"></span><select data-testid="role-select"></select></div></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button><div data-testid="invitations-list"><span data-testid="invitation-code"></span></div></form></div><div id="settings-pane-general" data-testid="settings-pane-general"></div></div>
</main><aside id="thread-panel" data-testid="thread-panel" class="thread"><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button><div id="thread-messages"></div><textarea id="thread-input" data-testid="thread-input"></textarea><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button></aside></div>
<script>
(function(){
const q=s=>document.querySelector(s);
const api2=async(path,opt={})=>{opt.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('huddle.token')},opt.headers||{});const r=await fetch('/api'+path,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||String(r.status));return j};
let signup=true, activeWorkspace=null, activeChannels=[];
function authView(){q('#auth-modal').classList.remove('hidden');q('#app').classList.add('hidden')}
function appView(){q('#auth-modal').classList.add('hidden');q('#app').classList.remove('hidden')}
function setUser(u){q('[data-testid="current-user"]').textContent=u.username}
function authSubmit(e){e.preventDefault();const f=new FormData(q('#auth-form')),d=Object.fromEntries(f);const path=signup?'/auth/register':'/auth/login';api2(path,{method:'POST',body:JSON.stringify(signup?d:{username:d.username,password:d.password})}).then(x=>{localStorage.setItem('huddle.token',x.token);setUser(x.user);appView();load2()}).catch(e=>q('#auth-error').textContent=e.message)}
q('#auth-form').dataset.mode='signup';q('#auth-form').onsubmit=authSubmit;
q('#auth-toggle').onclick=()=>{signup=!signup;q('#auth-form').dataset.mode=signup?'signup':'login';q('#auth-submit').textContent=signup?'Sign up':'Log in';q('#auth-error').textContent=''};
async function load2(){
 try{const x=await api2('/workspaces');activeWorkspace=x.workspaces&&x.workspaces[0];
  if(!activeWorkspace){q('#channel-list').innerHTML='';q('#channel-empty-state').textContent='Create a workspace to get started.';return}
  const d=await api2('/workspaces/'+activeWorkspace.slug);activeChannels=d.channels||[];q('#workspace-header').textContent=activeWorkspace.name;
  q('#channel-list').innerHTML=activeChannels.map(c=>'<div class="channel" data-testid="channel-entry" data-channel-id="'+c.id+'" data-channel-name="'+c.name+'">#'+c.name+'</div>').join('');
  q('#channel-list').querySelectorAll('[data-testid="channel-entry"]').forEach(el=>el.onclick=()=>open2(activeChannels.find(c=>String(c.id)===el.dataset.channelId)));
  if(activeChannels[0])open2(activeChannels[0]);
 }catch(e){q('#auth-error').textContent=e.message}
}
async function open2(c){if(!c)return;try{if(activeWorkspace){const fresh=await api2('/workspaces/'+activeWorkspace.slug);const found=(fresh.channels||[]).find(z=>String(z.id)===String(c.id));if(found)c=found;}q('#channel-title').textContent=c.name;q('#channel-topic').textContent=c.topic||'';window.currentChannel=c;const x=await api2('/channels/'+c.id+'/messages');const ms=(x.messages||[]).slice().reverse();q('#channel-empty-state').textContent=ms.length?'':'No messages yet — start the conversation.';q('#message-list').innerHTML=ms.map(m=>row(m)).join('')}catch(e){q('#channel-empty-state').textContent=e.message}}
function row(m){const rc=m.reply_count||0;return '<div class="message" data-testid="message" data-id="'+m.id+'"><span class="avatar" data-testid="message-avatar">'+(m.author.username||'?')[0]+'</span><b data-testid="message-author">'+m.author.username+'</b><span class="muted" data-testid="message-time">'+new Date(m.created_at).toLocaleString()+'</span><div data-testid="message-body">'+m.body+'</div>'+(m.edited_at?'<span data-testid="message-edited">edited</span>':'')+(rc?'<span data-testid="reply-count">'+rc+' '+(rc==1?'reply':'replies')+'</span>':'')+'<div class="toolbar"><button type="button" data-testid="edit-message-btn">Edit</button><button type="button" data-testid="delete-message-btn">Delete</button><button type="button" data-testid="open-thread-btn">Thread</button><button type="button" data-testid="reaction-button">🙂</button><div data-testid="emoji-picker" class="emoji-picker" style="display:none">'+['😀','👍','🎉','❤️','🚀','😂','😎','🔥'].map(e=>'<button type="button" data-testid="emoji-option" data-emoji="'+e+'">'+e+'</button>').join('')+'</div></div>'+(m.reactions||[]).map(x=>'<span data-testid="reaction-chip">'+x.emoji+' '+x.count+'</span>').join('')+'</div>'}

q('#workspace-create-form').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{const x=await api2('/workspaces',{method:'POST',body:JSON.stringify({slug:d.slug,name:d.name})});activeWorkspace=x.workspace;await load2()}catch(err){q('#auth-error').textContent=err.message}});
q('#new-channel-btn').onclick=()=>{q('#create-channel-form').style.display='block';q('#create-channel-form').querySelector('[name=name]').focus()};
q('#create-channel-form').onsubmit=async e=>{e.preventDefault();if(!activeWorkspace)return;const d=Object.fromEntries(new FormData(e.target));try{const x=await api2('/workspaces/'+activeWorkspace.slug+'/channels',{method:'POST',body:JSON.stringify({name:d.name,is_private:q('#create-channel-private').checked})});q('#create-channel-error').textContent='';await load2();const c=activeChannels.find(z=>z.id===x.channel.id);open2(c)}catch(err){q('#create-channel-error').textContent=err.message}};
q('#logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');authView()};
q('#message-form').onsubmit=async e=>{e.preventDefault();const b=q('#message-input').value;if(!window.currentChannel||!b.trim())return;await api2('/channels/'+window.currentChannel.id+'/messages',{method:'POST',body:JSON.stringify({body:b})});q('#message-input').value='';await open2(window.currentChannel)};
q('#message-list').onclick=async e=>{const btn=e.target,el=btn.closest('[data-testid="message"]');if(!el)return;const id=el.dataset.id;
 if(btn.matches('[data-testid="delete-message-btn"]')){await api2('/messages/'+id,{method:'DELETE'});el.remove();return}
 if(btn.matches('[data-testid="edit-message-btn"]')){const body=el.querySelector('[data-testid="message-body"]');const inp=document.createElement('input');inp.dataset.testid='edit-message-input';inp.value=body.textContent;body.replaceWith(inp);inp.focus();inp.onkeydown=async k=>{if(k.key==='Enter'){const x=await api2('/messages/'+id,{method:'PATCH',body:JSON.stringify({body:inp.value})});el.outerHTML=row(x.message)}};return}
 if(btn.matches('[data-testid="reaction-button"]')){el.querySelector('[data-testid="emoji-picker"]').style.display='grid';return}
 if(btn.matches('[data-testid="emoji-option"]')){const x=await api2('/messages/'+id+'/reactions',{method:'POST',body:JSON.stringify({emoji:btn.dataset.emoji})});el.querySelector('[data-testid="emoji-picker"]').style.display='none';let chips=el.querySelectorAll('[data-testid="reaction-chip"]');if(!chips.length){const z=document.createElement('span');z.dataset.testid='reaction-chip';z.textContent=btn.dataset.emoji+' 1';el.appendChild(z)}return}
 if(btn.matches('[data-testid="open-thread-btn"]')){window.threadParent=id;q('#thread-panel').style.display='block';q('#thread-panel').dataset.parentId=id;const x=await api2('/messages/'+id+'/replies');q('#thread-messages').innerHTML=(x.replies||[]).map(m=>'<div>'+m.author.username+': '+m.body+'</div>').join('');return}};
q('#thread-send').onclick=async()=>{const b=q('#thread-input').value;if(!b.trim()||!window.currentChannel)return;const id=q('#thread-panel').dataset.parentId;await api2('/channels/'+window.currentChannel.id+'/messages',{method:'POST',body:JSON.stringify({body:b,parent_id:Number(id)})});q('#thread-input').value='';const x=await api2('/messages/'+id+'/replies');q('#thread-messages').innerHTML=(x.replies||[]).map(m=>'<div>'+m.author.username+': '+m.body+'</div>').join('');const p=document.querySelector('[data-testid="message"][data-id="'+id+'"]');if(p){let z=p.querySelector('[data-testid="reply-count"]');if(!z){z=document.createElement('span');z.dataset.testid='reply-count';p.appendChild(z)}z.textContent=(x.replies||[]).length+' '+((x.replies||[]).length==1?'reply':'replies')}};
q('#close-thread').onclick=()=>q('#thread-panel').style.display='none';
if(new URLSearchParams(location.search).get('token'))localStorage.setItem('huddle.token',new URLSearchParams(location.search).get('token'));
if(localStorage.getItem('huddle.token')){appView();api2('/auth/me').then(x=>{setUser(x.user);load2()}).catch(authView)}else authView();
})();
</script></body></html>
