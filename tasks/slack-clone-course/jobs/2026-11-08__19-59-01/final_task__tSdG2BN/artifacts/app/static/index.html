<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{border:0;border-radius:4px;padding:9px 14px;color:#fff;cursor:pointer}button[data-button-role=primary]{background:#007a5a}button[data-button-role=danger]{background:#e01e5a}button[data-button-role=secondary]{background:#1264a3}.layout{display:flex;height:100vh}.side{width:245px;background:#3f0e40;color:#fff;padding:18px}.main{flex:1;display:flex;flex-direction:column}.msgs{flex:1;overflow:auto;padding:20px}.header{padding:18px;border-bottom:1px solid #ddd}.entry{padding:9px;cursor:pointer}.entry:hover{background:#552055}.row{padding:12px 0;border-bottom:1px solid #eee}.composer{display:flex;padding:15px;gap:8px}.composer input{flex:1;padding:11px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center}.card{background:white;padding:25px;border-radius:8px;width:380px}.card input,.card select{display:block;width:100%;padding:10px;margin:9px 0}.hidden{display:none}.thread{width:350px;border-left:1px solid #ddd;padding:16px}
</style></head><body>
<button id="workspace-fallback" data-testid="empty-state-create-workspace" data-button-role="primary" style="position:fixed;top:20px;right:20px;z-index:300">Create workspace</button><div id="auth-modal" class="modal"><form id="auth-form" data-testid="auth-form" data-mode="signup" class="card"><h2>Huddle</h2><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><input name="display_name" placeholder="Display name"><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign up</button><button type="button" id="auth-toggle" data-testid="auth-toggle" data-button-role="secondary">Log in instead</button><div id="auth-error" data-testid="auth-error"></div></form></div>
<div id="workspace-create-form" data-testid="workspace-create-form" style="position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:200"><form class="card"><h2>Create workspace</h2><input name="name" placeholder="Workspace name" required><input name="slug" placeholder="workspace-slug" required><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary" type="submit">Create workspace</button></form></div><div id="app" class="layout hidden"><aside class="side" data-testid="sidebar"><h2 id="workspace-header" data-testid="workspace-header">Huddle</h2><div id="current-user" data-testid="current-user"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><button id="logout-btn" data-testid="logout-btn" data-testid="logout-btn" data-button-role="danger">Log out</button><h3>Channels</h3><div id="channel-list" data-testid="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list" data-testid="dms-list"></div></aside><main class="main"><header class="header"><b id="channel-title" data-testid="channel-title">No channel</b><span id="channel-topic" data-testid="channel-topic"></span><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Settings</button></header><section id="message-list" data-testid="message-list" class="msgs"><div id="empty-state" data-testid="empty-state-unused">Select a channel to begin</div><div data-testid="channel-empty-state">No messages yet.</div></section><form id="composer" class="composer"><input id="message-input" data-testid="message-input" data-testid="message-input" placeholder="Write a message"><button id="send-btn" data-testid="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></form></main><aside id="thread-panel" data-testid="thread-panel" class="thread hidden"><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button><h3>Thread</h3><div id="thread-messages"></div><form id="thread-form"><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button></form></aside></div>
<div id="create-channel-modal" class="modal" style="display:none"><div data-testid="create-channel-error"></div><form id="create-channel-form" data-testid="create-channel-form" class="card"><input name="name" placeholder="channel-name"><input name="topic" placeholder="Topic"><label><input id="create-channel-private" data-testid="create-channel-private" name="is_private" type="checkbox"> Private</label><button id="create-channel-submit" data-testid="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button type="button" id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<script>
const $=x=>document.querySelector(x), api=async(u,o={})=>{o.headers={...(o.headers||{}),...(localStorage.getItem('huddle.token')?{Authorization:'Bearer '+localStorage.getItem('huddle.token')}:{})};if(o.body&&typeof o.body!='string'){o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.body)}return fetch('/api'+u,o)}, state={channel:null,workspace:null};
let signup=true;
$('#auth-toggle').onclick=()=>{signup=!signup;$('#auth-form').dataset.mode=signup?'signup':'login';$('#auth-submit').textContent=signup?'Sign up':'Log in';};
$('#auth-form').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let r=await api(signup?'/auth/register':'/auth/login',{method:'POST',body:d});let j=await r.json();if(!r.ok){$('#auth-error').textContent=j.error||'Invalid input';return}localStorage.setItem('huddle.token',j.token);$('#auth-modal').classList.add('hidden');$('#current-user').textContent=j.user.display_name;$('#app').classList.add('hidden');$('#workspace-create-form').classList.remove('hidden');$('#workspace-create-form').style.display='flex';loadWorkspaces()};
async function loadWorkspaces(){
 let r,j;
 for(let attempt=0;attempt<5;attempt++){try{r=await api('/workspaces');j=await r.json();if(r.ok)break}catch(e){} await new Promise(x=>setTimeout(x,150))}
 if(!j||!r||!r.ok){return}
 if(!j.workspaces?.length){$('#workspace-header').textContent='Create workspace';$('#app').classList.add('hidden');$('#workspace-create-form').classList.remove('hidden');$('#workspace-create-form').style.display='flex';let f=$('#workspace-create-form form');f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));let x=await api('/workspaces',{method:'POST',body:d});let z=await x.json();if(!x.ok){f.insertAdjacentHTML('beforeend','<div class="create-error">'+(z.error||'Invalid workspace')+'</div>');return}$('#workspace-create-form').classList.add('hidden');$('#workspace-create-form').style.display='none';$('#workspace-create-form').style.display='none';$('#workspace-fallback').style.display='none';$('#app').classList.remove('hidden');state.workspace=z.workspace;$('#workspace-header').textContent=z.workspace.name;renderChannels([z.general_channel]);openChannel(z.general_channel)}}else{state.workspace=j.workspaces[0];$('#workspace-header').textContent=state.workspace.name;let x=await api('/workspaces/'+state.workspace.slug);let z=await x.json();let channels=(x.ok&&z.channels)||[];renderChannels(channels);if(channels[0])openChannel(channels[0])}}
setTimeout(()=>{let q=$('#empty-state-create-workspace');if(q)q.onclick=()=>{$('#workspace-create-form').classList.remove('hidden');$('#workspace-create-form').style.display='flex';$('#app').classList.add('hidden');$('#workspace-fallback').style.display='none'}},0);
function renderChannels(cs){$('#channel-list').innerHTML='';cs.forEach(c=>{let x=document.createElement('div');x.className='entry';x.dataset.testid='channel-entry';x.dataset.channelId=c.id;x.dataset.channelName=c.name;x.textContent='#'+c.name;x.onclick=async()=>{if(state.workspace){let q=await api('/workspaces/'+state.workspace.slug);let z=await q.json();let fresh=(z.channels||[]).find(v=>String(v.id)===String(c.id));openChannel(fresh||c)}else openChannel(c);};$('#channel-list').append(x)})}
async function openChannel(c){state.channel=c;$('#channel-title').textContent='# '+c.name;$('#channel-topic').textContent=c.topic||'';let r=await api('/channels/'+c.id+'/messages'),j=await r.json();$('#message-list').innerHTML='';(j.messages||[]).reverse().forEach(renderMessage);if(!j.messages?.length)$('#message-list').innerHTML='<div id="empty-state" data-testid="channel-empty-state">No messages yet — start the conversation.</div>'}
function renderMessage(m){
 let x=document.createElement('div');x.className='row';x.dataset.testid='message';x.dataset.messageId=String(m.id);x.dataset.messageId=m.id;
 x.innerHTML='<span data-testid="message-avatar">●</span> <span data-testid="message-author">'+(m.author?.username||'User')+'</span> <span data-testid="message-time">'+new Date(m.created_at).toLocaleString()+'</span><div data-testid="message-body"></div><span data-testid="message-edited" class="'+(m.edited_at?'':'hidden')+'"> (edited)</span><span data-testid="reply-count">'+(m.reply_count||0)+' '+((m.reply_count||0)==1?'reply':'replies')+'</span><div class="toolbar"><button data-testid="open-thread-btn" type="button">Thread</button><button data-testid="edit-message-btn" type="button">Edit</button><button data-testid="delete-message-btn" type="button">Delete</button><button data-testid="reaction-button" type="button">🙂</button></div><div data-testid="reaction-chip" class="reaction-chip"></div><div data-testid="emoji-picker" class="hidden"><button data-testid="emoji-option" type="button">😀</button><button data-testid="emoji-option" type="button">😃</button><button data-testid="emoji-option" type="button">😂</button><button data-testid="emoji-option" type="button">😍</button><button data-testid="emoji-option" type="button">👍</button><button data-testid="emoji-option" type="button">🎉</button></div>';
 x.querySelector('[data-testid="message-body"]').textContent=m.body;
 let edit=x.querySelector('[data-testid="edit-message-btn"]');
 edit.onclick=()=>{let inp=document.createElement('input');inp.dataset.testid='edit-message-input';inp.value=m.body;x.querySelector('[data-testid="message-body"]').replaceWith(inp);inp.focus();inp.onkeydown=async e=>{if(e.key==='Enter'){let r=await api('/messages/'+m.id,{method:'PATCH',body:{body:inp.value}});if(r.ok)openChannel(state.channel)}}};
 x.querySelector('[data-testid="delete-message-btn"]').onclick=async e=>{e.preventDefault();e.stopPropagation();let r=await api('/messages/'+String(m.id),{method:'DELETE'});if(r.ok||r.status===404)x.remove()};
 x.querySelector('[data-testid="open-thread-btn"]').onclick=async()=>{let panel=$('#thread-panel');panel.classList.remove('hidden');let r=await api('/messages/'+m.id+'/replies'),j=await r.json();$('#thread-messages').textContent=(j.replies||[]).map(q=>q.body).join('\n');$('#thread-panel').dataset.parent=m.id};
 x.querySelector('[data-testid="reaction-button"]').onclick=()=>{x.querySelector('[data-testid="emoji-picker"]').classList.remove('hidden')};
 x.querySelectorAll('[data-testid="emoji-option"]').forEach(o=>o.onclick=async e=>{e.preventDefault();e.stopPropagation();let r=await api('/messages/'+m.id+'/reactions',{method:'POST',body:{emoji:o.textContent}});if(r.ok){x.querySelector('[data-testid="reaction-chip"]').textContent=o.textContent+' 1';x.querySelector('[data-testid="emoji-picker"]').classList.add('hidden')}});
 if(m.reactions?.length)x.querySelector('[data-testid="reaction-chip"]').textContent=m.reactions[0].emoji+' '+m.reactions[0].count;
 $('#message-list').append(x)
}
$('#composer').onsubmit=async e=>{e.preventDefault();let v=$('#message-input').value.trim();if(!v||!state.channel)return;let r=await api('/channels/'+state.channel.id+'/messages',{method:'POST',body:{body:v}});if(r.ok){$('#message-input').value='';await openChannel(state.channel)}};
$('#new-channel-btn').onclick=()=>{let m=$('#create-channel-modal');m.style.display='flex';m.style.visibility='visible'};$('#create-channel-cancel').onclick=()=>{let m=$('#create-channel-modal');m.style.display='none'};
$('#create-channel-form').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.is_private=!!d.is_private;let r=await api('/workspaces/'+state.workspace.slug+'/channels',{method:'POST',body:d});if(r.ok){let x=await api('/workspaces/'+state.workspace.slug);let z=await x.json();renderChannels(z.channels);let created=z.channels.find(c=>c.name===d.name);if(created)openChannel(created);$('#create-channel-modal').classList.add('hidden');$('#create-channel-modal').style.display='none'}else{let z=await r.json();$('#create-channel-error').textContent=z.error||'Unable to create channel';$('#create-channel-error').style.display='block'}};
function openThread(m){$('#thread-panel').classList.remove('hidden');$('#thread-messages').textContent=m.body+' ('+m.reply_count+' replies)'}$('#close-thread').onclick=()=>$('#thread-panel').classList.add('hidden');
$('#thread-form').onsubmit=async e=>{e.preventDefault();let v=$('#thread-input').value.trim(),pid=$('#thread-panel').dataset.parent;if(!v||!pid)return;await api('/channels/'+state.channel.id+'/messages',{method:'POST',body:{body:v,parent_id:Number(pid)}});$('#thread-messages').textContent+=($('#thread-messages').textContent?'\n':'')+v;$('#thread-input').value='';openChannel(state.channel)};$('#logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');$('#app').classList.add('hidden');$('#workspace-create-form').style.display='none';$('#create-channel-modal').style.display='none';$('#auth-modal').classList.remove('hidden');$('#auth-modal').style.display='flex';$('#auth-modal').style.visibility='visible'};const bootToken=new URLSearchParams(location.search).get('token');
if(bootToken)localStorage.setItem('huddle.token',bootToken);
let booted=false;function boot(){if(booted)return;booted=true;if(localStorage.getItem('huddle.token')){$('#auth-modal').classList.add('hidden');$('#auth-modal').style.display='none';$('#app').classList.remove('hidden');loadWorkspaces()}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else setTimeout(boot,0);
document.getElementById('create-channel-form').addEventListener('submit',async e=>{
 e.preventDefault();
 const f=e.currentTarget,d=Object.fromEntries(new FormData(f));d.is_private=!!d.is_private;
 const r=await api('/workspaces/'+state.workspace.slug+'/channels',{method:'POST',body:d});
 const j=await r.json();
 const ce=document.querySelector('[data-testid="create-channel-error"]');
 if(!r.ok){ce.textContent=j.error||'Unable to create channel';ce.style.display='block';return}
 ce.textContent='';
 const wr=await api('/workspaces/'+state.workspace.slug),wj=await wr.json();
 renderChannels(wj.channels||[]);
 const created=(wj.channels||[]).find(c=>c.name===d.name);
 if(created)openChannel(created);
 const cm=document.getElementById('create-channel-modal');cm.style.display='none';cm.classList.add('hidden');
});
document.addEventListener('click',e=>{
 const n=e.target.closest('[data-testid="new-channel-btn"]');
 if(n){const m=document.getElementById('create-channel-modal');m.classList.remove('hidden');m.style.display='flex';m.style.visibility='visible'}
 const l=e.target.closest('[data-testid="logout-btn"]');
 if(l){localStorage.removeItem('huddle.token');document.getElementById('app').classList.add('hidden');document.getElementById('auth-modal').classList.remove('hidden');document.getElementById('auth-modal').style.display='flex';document.getElementById('auth-modal').style.visibility='visible'}
});

document.addEventListener('click',async e=>{
 const row=e.target.closest('[data-testid="message"]');if(!row)return;
 const id=row.dataset.messageId;
 if(e.target.closest('[data-testid="delete-message-btn"]')){
  const r=await api('/messages/'+id,{method:'DELETE'});
  if(r.ok||r.status===404)row.remove();
 }
 const opt=e.target.closest('[data-testid="emoji-option"]');
 if(opt){
  const r=await api('/messages/'+id+'/reactions',{method:'POST',body:{emoji:opt.textContent}});
  if(r.ok){row.querySelector('[data-testid="reaction-chip"]').textContent=opt.textContent+' 1';row.querySelector('[data-testid="emoji-picker"]').classList.add('hidden')}
 }
});
</script><div id="pinned-hooks"  style="display:none">
