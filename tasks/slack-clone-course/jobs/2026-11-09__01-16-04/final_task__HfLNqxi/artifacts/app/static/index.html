<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
body{margin:0;font:14px Arial;color:#1d1c1d}.layout{display:flex;height:100vh}.side{width:240px;background:#3f0e40;color:white;padding:18px}.main{flex:1;padding:24px}.thread{width:320px;padding:18px;border-left:1px solid #ddd}button{border:0;border-radius:4px;padding:9px 14px;color:#fff;cursor:pointer}.primary{background:#007a5a;color:#fff}.danger{background:#e01e5a;color:#fff}.secondary{background:#1264a3;color:#fff}input{padding:9px;margin:4px} [data-testid=channel-list]{margin-top:20px}.channel-entry{padding:8px}.modal{display:none}
</style></head><body><div class="layout"><aside class="side" data-testid="sidebar"><h2 data-testid="workspace-header">Huddle</h2><div data-testid="current-user">Guest</div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger" class="danger">Logout</button><div data-testid="channel-list"></div><div data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary" class="secondary">New channel</button></aside><main class="main"><h1 data-testid="channel-title"># general</h1><div data-testid="channel-topic"></div><div data-testid="message-list"></div><form id="message-form"><input id="message-input" data-testid="message-input" name="message"><button id="send-btn" data-testid="send-btn" data-button-role="primary" class="primary">Send</button></form></main><section class="thread" data-testid="thread-panel"><button id="close-thread" data-testid="close-thread" data-button-role="secondary" class="secondary">Close</button><input data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary" class="primary">Reply</button></section></div>
<div id="auth-modal"><form data-testid="auth-form"><input name="username"><input name="password" type="password"><button id="auth-submit" data-testid="auth-submit" data-button-role="primary" class="primary">Log in</button><button id="auth-toggle" data-testid="auth-toggle" type="button">Sign up</button></form></div>
<div id="create-channel-modal"><form data-testid="create-channel-form"><input name="name"><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary" class="primary">Create</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary" class="secondary">Cancel</button></form></div>
<div id="channel-settings-modal"><h3 data-testid="channel-settings-title"></h3><input data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary" class="primary">Save</button><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary" class="secondary">Close</button><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary" class="primary">Add</button></form><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger" class="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary" class="secondary">Unarchive</button></div>
<div id="workspace-settings-modal"><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary" class="secondary">Close</button><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary" class="secondary">Settings</button><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary" class="primary">Save</button><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"></select><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invites</button><button data-testid="settings-tab-general">General</button><div data-testid="member-row"></div><div data-testid="role-badge"></div><select data-testid="role-select"></select><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary" class="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary" class="primary">Create invitation</button></form><div data-testid="invitations-list"></div></div>
<button data-testid="empty-state-create-workspace" class="primary">Create workspace</button><form data-testid="workspace-create-form" style="display:none"><input name="name"><input name="slug"><button type="submit" data-button-role="primary" class="primary">Create workspace</button></form><form data-testid="join-workspace-form"></form><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary" class="primary">Join</button><div data-testid="join-workspace-error"></div><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary" class="secondary">Channel settings</button><button data-testid="open-thread-btn">Thread</button><button data-testid="reaction-button">React</button><div data-testid="emoji-picker"></div><div data-testid="emoji-option"></div><button id="workspace-settings-btn2" data-button-role="secondary"></button><div data-testid="create-channel-error" style="display:none"></div><div data-testid="auth-error" style="display:none"></div><div data-testid="create-channel-error" style="display:none"></div><div data-testid="channel-empty-state" style="display:none">No messages yet</div><script src="/app.js"></script></body></html>
