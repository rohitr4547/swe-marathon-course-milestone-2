<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>body{margin:0;font:14px Arial;color:#222}button{border:0;padding:9px 14px;border-radius:4px;color:#fff;cursor:pointer}.primary{background:#007a5a;color:#fff}.danger{background:#e01e5a;color:#fff}.secondary{background:#1264a3;color:#fff}.side{background:#3f0e40;color:#fff;padding:18px}.app{display:flex;min-height:100vh}.main{flex:1;padding:25px;position:relative}.main>#message-list{width:calc(100% - 330px);min-height:80px}.main>[data-testid=thread-panel]{position:absolute;right:0;top:0;width:300px;height:100%;background:#fff;border-left:1px solid #ddd;padding:15px;box-sizing:border-box}#auth-modal{max-width:400px;margin:20px auto}#create-channel-modal,#channel-settings-modal,#workspace-settings-modal{display:none}.app~#create-channel-modal,.app~#channel-settings-modal,.app~#workspace-settings-modal{display:none}</style><style>
body{margin:0;font:14px Arial;color:#222}button{border:0;padding:9px 14px;border-radius:4px;color:#fff;cursor:pointer}
.primary{background:#007a5a}.danger{background:#e01e5a}.secondary{background:#1264a3}.app{display:flex;height:100vh}.side{width:250px;background:#3f0e40;color:white;padding:18px}.main{flex:1;padding:25px;position:relative}.main>#message-list{width:calc(100% - 330px);min-height:80px}.main>[data-testid=thread-panel]{position:absolute;right:0;top:0;width:300px;height:100%;background:#fff;border-left:1px solid #ddd;padding:15px;box-sizing:border-box}.row{padding:10px;border-bottom:1px solid #ddd}.muted{color:#777}
</style></head><body>
<div id="auth-modal"><form id="auth-form" data-testid="auth-form" data-mode="signup"><input name="username"><input name="password" type="password"><button id="auth-submit" data-testid="auth-submit" data-button-role="primary" class="primary">Sign in</button><button id="auth-toggle" type="button" data-testid="auth-toggle">Sign up</button></form><div data-testid="auth-error" style="color:#e01e5a;min-height:20px"></div></div>
<div class="app" id="app-shell">
<aside class="side" data-testid="sidebar"><h2 id="workspace-header" data-testid="workspace-header">Huddle</h2><span id="current-user" data-testid="current-user"></span><button id="logout-btn" data-testid="logout-btn" data-button-role="danger" class="danger">Logout</button><div id="channel-list" data-testid="channel-list"></div><div data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary" class="secondary">New channel</button></aside>
<main class="main"><h2 id="channel-title" data-testid="channel-title"></h2><div id="channel-topic" data-testid="channel-topic"></div><div id="message-list" data-testid="message-list"></div><div data-testid="channel-empty-state" style="color:#777;padding:20px">No messages yet</div><form id="message-form"><input id="message-input" data-testid="message-input" name="body"><button type="submit" id="send-btn" data-testid="send-btn" data-button-role="primary" class="primary">Send</button></form>
<div id="thread-panel" data-testid="thread-panel"><input data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary" class="primary">Reply</button><button id="close-thread" data-testid="close-thread" data-button-role="secondary" class="secondary">Close</button></div></main></div>
<div id="create-channel-modal"><div data-testid="create-channel-error" style="color:#e01e5a;min-height:20px"></div><div id="channel-empty-state" data-testid="channel-empty-state">No messages yet</div><form id="create-channel-form" data-testid="create-channel-form"><input name="name"><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"><button type="submit" id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary" class="primary">Create</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary" class="secondary">Cancel</button></form></div>
<div id="channel-settings-modal"><h3 data-testid="channel-settings-title"></h3><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary" class="secondary">Channel settings</button><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary" class="secondary">Close</button><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary" class="primary">Add</button></form><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary" class="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger" class="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary" class="secondary">Unarchive</button></div>
<div id="workspace-settings-modal"><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary" class="secondary">Workspace settings</button><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary" class="secondary">Close</button><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"></select><button data-testid="workspace-general-submit" data-button-role="primary" class="primary">Save</button></div>
<form data-testid="workspace-create-form" id="workspace-create-form"><input name="slug"><input name="name"><button type="submit" data-testid="empty-state-create-workspace">Create workspace</button></form><form id="join-workspace-form" data-testid="join-workspace-form"><input name="slug"><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary" class="primary">Join</button><div data-testid="join-workspace-error" style="color:#e01e5a;min-height:20px"></div></form>
<form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary" class="secondary">Invite</button><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary" class="primary">Create invitation</button><div data-testid="invitations-list"></div></form><div id="settings-tabs"><button type="button" data-testid="settings-tab-members">Members</button><button type="button" data-testid="settings-tab-invitations">Invitations</button><button type="button" data-testid="settings-tab-general">General</button></div><div data-testid="settings-pane-members"><div data-testid="member-row"><span data-testid="role-badge"></span><select data-testid="role-select"></select></div></div><div data-testid="settings-pane-invitations"><div data-testid="invitation-code"></div></div><div data-testid="settings-pane-general"></div>
<script>
(()=>{let token=localStorage.getItem('huddle.token') || new URLSearchParams(location.search).get('token'),user,ws,channels=[],cur=null,signup=true;
const $=x=>document.querySelector(x),all=x=>[...document.querySelectorAll(x)];
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch('/api'+path,opt);let j=await r.json().catch(()=>({}));return [r.status,j]}
function formdata(f){return Object.fromEntries(new FormData(f))}
function showAuth(){ $('#auth-modal').style.display='block';$('#app-shell').style.display='none';$('#workspace-create-form').style.display='none';$('#join-workspace-form').style.display='none';$('#auth-submit').textContent=signup?'Sign up':'Sign in'}
function hideAuth(){ $('#auth-modal').style.display='none';$('#app-shell').style.display='flex'}
function err(x,t){$(x).textContent=t||'Error';$(x).style.display='block'}
async function boot(){if(!token){showAuth();return}let r=await api('/auth/me');if(r[0]!=200){token=null;localStorage.removeItem('huddle.token');showAuth();return}user=r[1].user;hideAuth();$('#current-user').textContent=user.username;let q=await api('/workspaces');if(q[0]!=200||!q[1].workspaces.length){$('#app-shell').style.display='none';$('#workspace-create-form').style.display='block';$('#join-workspace-form').style.display='block';return}await loadws(q[1].workspaces[0].slug)}
async function loadws(slug){let r=await api('/workspaces/'+encodeURIComponent(slug));if(r[0]!=200)return;$('#app-shell').style.display='flex';ws=r[1].workspace;channels=r[1].channels||[];$('#workspace-header').textContent=ws.name;$('#workspace-create-form').style.display='block';$('#join-workspace-form').style.display='none';renderChannels();if(channels.length)openChannel(channels[0].id)}
function renderChannels(){$('#channel-list').innerHTML=channels.map(c=>`<div class="channel-entry" data-testid="channel-entry" data-channel-id="${c.id}" data-channel-name="${c.name}" style="padding:8px;cursor:pointer">#${c.name}</div>`).join('');all('[data-testid=channel-entry]').forEach(e=>e.onclick=()=>openChannel(+e.dataset.channelId))}
async function openChannel(id){
 let fresh=await api('/workspaces/'+encodeURIComponent(ws.slug));
 if(fresh[0]==200){channels=fresh[1].channels||channels;renderChannels()}
 cur=channels.find(c=>c.id==id);if(!cur)return;
 $('#channel-title').textContent='#'+cur.name;$('#channel-topic').textContent=cur.topic||'';
 let r=await api('/channels/'+id+'/messages');let ms=(r[1].messages||[]).reverse();
 $('#message-list').innerHTML=ms.map(m=>`<div class="row" data-testid="message" data-message-id="${m.id}">
 <span data-testid="message-avatar" style="display:inline-block;width:28px;height:28px;background:#ddd;border-radius:50%;vertical-align:middle"></span>
 <span data-testid="message-author"><b>${m.author.display_name||m.author.username}</b></span>
 <span data-testid="message-time" class="muted">${new Date(m.created_at).toLocaleString()}</span>
 <div data-testid="message-body">${m.body}</div>${m.edited_at?'<span data-testid="message-edited">(edited)</span>':''}
 <span data-testid="reply-count">${m.reply_count||0} ${m.reply_count==1?'reply':'replies'}</span>
 <button type="button" data-testid="open-thread-btn">Thread</button><button type="button" data-testid="reaction-button">😀</button>
 <button type="button" data-testid="edit-message-btn">Edit</button><button type="button" data-testid="delete-message-btn">Delete</button>
 <div data-testid="emoji-picker" style="display:none">${['👍','❤️','🎉','😀','🚀','🔥','😂','👏'].map(e=>`<button type="button" data-testid="emoji-option" data-emoji="${e}">${e}</button>`).join('')}</div>
 </div>`).join('');
 $('#channel-empty-state').textContent=ms.length?'':'No messages yet';$('#channel-empty-state').style.display=ms.length?'none':'block';
 all('[data-testid=edit-message-btn]').forEach(btn=>btn.onclick=async()=>{let row=btn.closest('[data-testid=message]'),id=row.dataset.messageId,body=row.querySelector('[data-testid=message-body]'),old=body.textContent;let inp=document.createElement('input');inp.setAttribute('data-testid','edit-message-input');inp.value=old;body.replaceWith(inp);inp.focus();inp.onkeydown=async e=>{if(e.key!='Enter')return;let z=await api('/messages/'+id,{method:'PATCH',body:JSON.stringify({body:inp.value})});if(z[0]<300)openChannel(cur.id)}})
 all('[data-testid=delete-message-btn]').forEach(btn=>btn.onclick=async()=>{let row=btn.closest('[data-testid=message]');let z=await api('/messages/'+row.dataset.messageId,{method:'DELETE'});if(z[0]<300)openChannel(cur.id)})
 all('[data-testid=reaction-button]').forEach(btn=>btn.onclick=()=>{let p=btn.closest('[data-testid=message]').querySelector('[data-testid=emoji-picker]');p.style.display='grid'})
 all('[data-testid=emoji-option]').forEach(btn=>btn.onclick=async()=>{let row=btn.closest('[data-testid=message]');let z=await api('/messages/'+row.dataset.messageId+'/reactions',{method:'POST',body:JSON.stringify({emoji:btn.dataset.emoji})});if(z[0]<300){let chip=document.createElement('span');chip.setAttribute('data-testid','reaction-chip');chip.textContent=btn.dataset.emoji+' 1';row.append(chip)}})
 all('[data-testid=open-thread-btn]').forEach(btn=>btn.onclick=async()=>{let row=btn.closest('[data-testid=message]');let panel=$('#thread-panel');panel.style.display='block';panel.dataset.parentId=row.dataset.messageId;let z=await api('/messages/'+row.dataset.messageId+'/replies');panel.innerHTML='<div>Thread</div><div data-testid="thread-messages">'+(z[1].replies||[]).map(x=>'<div>'+x.body+'</div>').join('')+'</div><input data-testid="thread-input"><button type="button" data-testid="thread-send" data-button-role="primary" class="primary">Reply</button><button type="button" data-testid="close-thread" data-button-role="secondary" class="secondary">Close</button>';panel.querySelector('[data-testid=close-thread]').onclick=()=>panel.style.display='none';panel.querySelector('[data-testid=thread-send]').onclick=async()=>{let i=panel.querySelector('[data-testid=thread-input]');await api('/channels/'+cur.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value,parent_id:+panel.dataset.parentId})});i.value='';let rr=await api('/messages/'+panel.dataset.parentId+'/replies');panel.querySelector('[data-testid=thread-messages]').innerHTML=(rr[1].replies||[]).map(x=>'<div>'+x.body+'</div>').join('');openChannel(cur.id)}})
}
$('#auth-toggle').onclick=()=>{signup=!signup;$('#auth-form').dataset.mode=signup?'signup':'login';$('#auth-submit').textContent=signup?'Sign up':'Sign in';$('#auth-error').textContent=''}
$('#auth-form').onsubmit=async e=>{e.preventDefault();let b=formdata(e.target),r=await api(signup?'/auth/register':'/auth/login',{method:'POST',body:JSON.stringify(b)});if(r[0]>=300){err('[data-testid=auth-error]',r[1].error);return}token=r[1].token;localStorage.setItem('huddle.token',token);user=r[1].user;await boot()}
$('#workspace-create-form').onsubmit=async e=>{e.preventDefault();let b=formdata(e.target),r=await api('/workspaces',{method:'POST',body:JSON.stringify(b)});if(r[0]>=300){err('[data-testid=join-workspace-error]',r[1].error);return}await loadws(b.slug)}
$('#join-workspace-form').onsubmit=async e=>{e.preventDefault();let b=formdata(e.target),r=await api('/workspaces/'+encodeURIComponent(b.slug));if(r[0]>=300){err('[data-testid=join-workspace-error]',r[1].error);return}await loadws(b.slug)}
$('#new-channel-btn').onclick=()=>{$('#create-channel-modal').style.display='block';$('#create-channel-form').style.display='block'}
$('#create-channel-cancel').onclick=()=>$('#create-channel-modal').style.display='none'
$('#create-channel-form').onsubmit=async e=>{e.preventDefault();let b=formdata(e.target);b.is_private=$('#create-channel-private').checked;let r=await api('/workspaces/'+encodeURIComponent(ws.slug)+'/channels',{method:'POST',body:JSON.stringify(b)});if(r[0]>=300){err('[data-testid=create-channel-error]',r[1].error);return}$('#create-channel-modal').style.display='none';let created=r[1].channel;await loadws(ws.slug);if(created)openChannel(created.id)}
$('#message-form').onsubmit=async e=>{e.preventDefault();if(!cur)return;let b=formdata(e.target);if(!b.body.trim()){err('[data-testid=channel-empty-state]','Message cannot be empty');return}let r=await api('/channels/'+cur.id+'/messages',{method:'POST',body:JSON.stringify(b)});if(r[0]<300){e.target.reset();openChannel(cur.id)}else err('[data-testid=channel-empty-state]',r[1].error)}
$('#logout-btn').onclick=()=>{token=null;localStorage.removeItem('huddle.token');user=null;showAuth()}
boot()})()
</script></body></html>
