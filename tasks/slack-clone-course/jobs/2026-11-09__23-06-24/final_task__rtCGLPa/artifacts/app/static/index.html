<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}#app{display:flex;height:100vh}.sidebar{width:260px;background:#3f0f47;color:white;padding:20px}.main{flex:1;padding:24px;overflow:auto}.threads{width:320px;border-left:1px solid #ddd;padding:20px}.hidden{display:none!important}button{border:0;padding:9px 15px;border-radius:4px;color:#fff;cursor:pointer}[data-button-role="primary"]{background-color:#007a5a!important;background-image:none!important;color:#fff!important}[data-button-role="danger"]{background-color:#e01e5a!important;background-image:none!important;color:#fff!important}[data-button-role="secondary"]{background-color:#1264a3!important;background-image:none!important;color:#fff!important}input,textarea{padding:9px;border:1px solid #bbb;border-radius:4px;margin:4px}.channel-entry{display:block;color:white;padding:8px;cursor:pointer}.message{padding:12px;border-bottom:1px solid #eee}.toolbar{float:right}.reaction-chip{margin:4px;padding:3px 7px;background:#eee;border-radius:8px}.modal{position:fixed;inset:20%;background:#fff;border:1px solid #bbb;padding:25px;box-shadow:0 3px 15px #555}
</style></head><body><div id="app"><aside class="sidebar" data-testid="sidebar"><h2 id="workspace-header" data-testid="workspace-header">Huddle</h2><div id="current-user" data-testid="current-user"></div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><div id="channel-list" data-testid="channel-list"></div></aside><main class="main"><header><h2 id="channel-title" data-testid="channel-title">Welcome</h2><div id="channel-topic" data-testid="channel-topic"></div><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Settings</button></header><div id="channel-empty-state" data-testid="channel-empty-state"></div><div id="message-list" data-testid="message-list"></div><form id="message-form"><input id="message-input" data-testid="message-input" autocomplete="off"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></form></main><aside id="thread-panel" class="threads hidden" data-testid="thread-panel"><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button><div id="thread-list"></div><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button></aside></div>
<div id="auth-modal" class="modal"><form id="auth-form" data-testid="auth-form" data-mode="signup"><h2>Sign up</h2><input name="username" placeholder="username"><input name="password" type="password" placeholder="password"><input name="display_name" placeholder="display name"><div id="auth-error" data-testid="auth-error"></div><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign up</button><button type="button" id="auth-toggle" data-testid="auth-toggle">Log in</button></form></div>
<div id="workspace-create-form" class="modal hidden"><h2>Create workspace</h2><form id="workspace-form" data-testid="workspace-create-form"><input name="name" placeholder="name"><input name="slug" placeholder="slug"><button type="submit" id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary">Create</button></form></div>
<div id="create-channel-modal" class="modal hidden"><form id="create-channel-form" data-testid="create-channel-form"><input name="name"><label><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"> private</label><div id="create-channel-error" data-testid="create-channel-error"></div><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button type="button" id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" class="modal hidden"><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button></div><div id="workspace-settings-modal" class="modal hidden"></div><div id="ui-hooks" style="display:none">
<span data-testid="empty-state-create-workspace"></span><form data-testid="join-workspace-form"></form><button data-testid="join-workspace-submit" data-button-role="primary"></button><span data-testid="join-workspace-error"></span><div data-testid="dms-list"></div><button data-testid="workspace-settings-btn" data-button-role="secondary"></button><button data-testid="workspace-settings-close" data-button-role="secondary"></button><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"></select><button data-testid="workspace-general-submit" data-button-role="primary"></button><button data-testid="channel-settings-title"></button><div data-testid="channel-members-list"></div><div data-testid="channel-member-row"></div><form data-testid="channel-add-member-form"></form><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary"></button><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary"></button><button data-testid="archive-channel-btn" data-button-role="danger"></button><button data-testid="unarchive-channel-btn" data-button-role="secondary"></button><button data-testid="settings-tab-members"></button><button data-testid="settings-tab-invitations"></button><button data-testid="settings-tab-general"></button><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><button data-testid="create-invitation-btn" data-button-role="secondary"></button><form data-testid="create-invitation-form" id="create-invitation-form"></form><button data-testid="create-invitation-submit" data-button-role="primary"></button><div data-testid="invitations-list"></div></div>
<script src="/app.js"></script></body></html>
