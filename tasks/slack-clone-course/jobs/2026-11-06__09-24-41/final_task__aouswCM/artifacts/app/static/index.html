<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#1d1c1d;background:#fff}button{border:0;border-radius:4px;padding:9px 14px;cursor:pointer;color:#fff}.primary,[data-button-role=primary]{background:#007a5a!important;color:#fff!important}.danger,[data-button-role=danger]{background:#e01e5a!important;color:#fff!important}.secondary,[data-button-role=secondary]{background:#1264a3!important;color:#fff!important}input,select,textarea{padding:9px;border:1px solid #bbb;border-radius:4px}#app{height:100vh;display:flex;flex-direction:column}.top{height:58px;background:#3f0e40;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}.layout{display:flex;flex:1;min-height:0}.side{width:260px;background:#3f0e40;color:#eee;padding:14px;overflow:auto}.side h2{margin:4px 0 18px;color:#fff}.side h3{font-size:13px;color:#c8a8c8;margin:18px 4px 7px}.entry{display:block;width:100%;text-align:left;background:transparent;color:#eee;padding:8px;border-radius:4px}.entry:hover,.entry.active{background:#1164a3}.main{flex:1;display:flex;flex-direction:column;min-width:0}.header{height:70px;border-bottom:1px solid #ddd;padding:12px 22px}.header h2{margin:0}.topic{color:#616061;font-size:12px}.messages{flex:1;overflow:auto;padding:20px 28px}.message{padding:10px 0;display:flex;gap:10px}.avatar{width:34px;height:34px;background:#36c5f0;border-radius:4px;text-align:center;padding-top:9px;color:#fff}.msgbody{flex:1}.meta{font-weight:bold}.time{font-size:11px;color:#777;font-weight:normal;margin-left:8px}.edited{font-size:11px;color:#777}.toolbar{float:right}.toolbar button{padding:3px 6px;background:#eee;color:#333;margin-left:3px}.composer{padding:14px 24px;border-top:1px solid #ddd;display:flex;gap:8px}.composer input{flex:1}.thread{width:360px;border-left:1px solid #ddd;padding:18px;display:none;flex-direction:column}.thread.open{display:flex}.thread-msgs{flex:1;overflow:auto}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center}.modal.show{display:flex}.card{background:#fff;padding:25px;border-radius:8px;width:400px;box-shadow:0 5px 25px #0005}.card form{display:flex;flex-direction:column;gap:10px}.error{color:#e01e5a;min-height:18px}.empty{text-align:center;color:#666;padding:80px 10px}#auth-modal{display:flex;background:#f5f5f5}.hidden{display:none!important}
</style></head><body><div id="app">
<div class="top"><b>Huddle</b><span id="current-user" data-testid="current-user"></span><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button></div>
<div class="layout"><aside class="side"><h2 id="workspace-header" data-testid="workspace-header">Your workspace</h2><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">＋ New channel</button><h3>CHANNELS</h3><div id="channel-list" data-testid="channel-list"></div><h3>DIRECT MESSAGES</h3><div id="dms-list" data-testid="dms-list"></div></aside>
<main class="main"><header class="header"><h2 id="channel-title" data-testid="channel-title">Welcome</h2><div id="channel-topic" class="topic" data-testid="channel-topic"></div><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Settings</button></header><section id="message-list" class="messages" data-testid="message-list"></section><div class="composer"><input id="message-input" data-testid="message-input" placeholder="Message this channel"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></div></main>
<aside id="thread-panel" class="thread" data-testid="thread-panel"><div><b>Thread</b><button id="close-thread" data-testid="close-thread" data-button-role="secondary" style="float:right">Close</button></div><div id="thread-msgs" class="thread-msgs"></div><div class="composer"><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button></div></aside></div></div>
<div id="auth-modal" class="modal"><div class="card"><h2 id="auth-title">Sign in to Huddle</h2><form id="auth-form" data-testid="auth-form"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password (8+ characters)" required><input name="display_name" placeholder="Display name"><div id="auth-error" class="error"></div><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign in</button></form><button id="auth-toggle" data-testid="auth-toggle" class="secondary">Create an account</button></div></div>
<div id="create-channel-modal" class="modal"><div class="card"><h2>Create channel</h2><form id="create-channel-form" data-testid="create-channel-form"><input name="name" placeholder="channel-name" required><input name="topic" placeholder="Topic"><label><input id="create-channel-private" data-testid="create-channel-private" name="private" type="checkbox"> Private</label><div id="create-error" class="error"></div><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button type="button" id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div></div>
<div id="workspace-settings-modal" class="modal"><div class="card"><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><h2>Workspace settings</h2><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary">Save</button><div id="settings-tabs"><button id="settings-tab-members" data-testid="settings-tab-members">Members</button><button id="settings-tab-invitations" data-testid="settings-tab-invitations">Invitations</button><button id="settings-tab-general" data-testid="settings-tab-general">General</button></div><div id="settings-pane-members" data-testid="settings-pane-members"></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"></div><div id="settings-pane-general" data-testid="settings-pane-general"></div></div></div>
<div id="channel-settings-modal" class="modal"><div class="card"><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button><h2 id="channel-settings-title" data-testid="channel-settings-title">Channel settings</h2><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button></div></div>
<div id="create-invitation-form" class="modal"><div class="card"><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button><div id="invitations-list" data-testid="invitations-list"></div><span id="invitation-code" data-testid="invitation-code"></span></div></div>
<script>
const $=id=>document.getElementById(id), api=async(path,opt={})=>{opt.headers={...(opt.headers||{}),Authorization:'Bearer '+state.token,'Content-Type':'application/json'};let r=await fetch('/api'+path,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j};
let state={token:localStorage.getItem('huddle.token'),user:null,ws:null,workspace:null,channel:null};let registering=false;
function showAuth(){ $('auth-modal').classList.toggle('show',!state.token)}
async function load(){if(!state.token)return showAuth();try{state.user=(await api('/auth/me')).user;$('current-user').textContent=state.user.display_name||state.user.username;let x=await api('/workspaces');if(!x.workspaces.length){renderEmpty();return}state.workspace=x.workspaces[0];$('workspace-header').textContent=state.workspace.name;let d=await api('/workspaces/'+state.workspace.slug);renderChannels(d.channels);if(d.channels[0])selectChannel(d.channels[0])}catch(e){localStorage.removeItem('huddle.token');state.token=null;showAuth()}}
function renderEmpty(){ $('channel-list').innerHTML='<div class="empty">Create a workspace to start chatting.</div>'}
function renderChannels(cs){$('channel-list').innerHTML=cs.map(c=>`<button class="entry" data-testid="channel-entry" data-channel-id="${c.id}" data-channel-name="${c.name}"># ${c.name}</button>`).join('');document.querySelectorAll('.entry').forEach(x=>x.onclick=()=>selectChannel(cs.find(c=>c.id==x.dataset.channelId)))}
async function selectChannel(c){state.channel=c;$('channel-title').textContent='# '+c.name;$('channel-topic').textContent=c.topic||'';let d=await api('/channels/'+c.id+'/messages');renderMessages(d.messages);if(state.ws)state.ws.close();state.ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/api/ws?token='+state.token);state.ws.onopen=()=>state.ws.send(JSON.stringify({type:'subscribe',channel_id:c.id}));state.ws.onmessage=e=>{let f=JSON.parse(e.data);if(f.type==='message.created'||f.type==='message.reply')loadMessages()}}
async function loadMessages(){let d=await api('/channels/'+state.channel.id+'/messages');renderMessages(d.messages)}
function renderMessages(ms){$('message-list').innerHTML=ms.length?ms.map(m=>`<div class="message" data-testid="message" data-id="${m.id}"><div class="avatar">${(m.author?.display_name||'?')[0]}</div><div class="msgbody"><div><span class="meta">${m.author?.display_name||'User'}</span><span class="time">${new Date(m.created_at).toLocaleString()}</span>${m.edited_at?'<span class="edited"> (edited)</span>':''}</div><div data-testid="message-body">${esc(m.body)}</div><button class="open-thread-btn" data-testid="open-thread-btn">Thread</button><button class="reaction-button" data-testid="reaction-button">😀</button><div class="reactbox" style="display:none"><button class="emoji-option" data-testid="emoji-option">👍</button><button class="emoji-option" data-testid="emoji-option">❤️</button></div></div></div>`).join(''):'<div class="empty">No messages yet. Be the first to say hello!</div>';document.querySelectorAll('.open-thread-btn').forEach(b=>b.onclick=()=>openThread(b.closest('.message').dataset.id));document.querySelectorAll('.reaction-button').forEach(b=>b.onclick=()=>b.nextElementSibling.style.display='block');document.querySelectorAll('.emoji-option').forEach(b=>b.onclick=async()=>{await api('/messages/'+b.closest('.message').dataset.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:b.textContent})});b.parentElement.innerHTML='<span class="reaction-chip" data-testid="reaction-chip">'+b.textContent+' 1</span>'})}
function esc(x){return x.replace(/[&<>"]/g,z=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[z]))}
async function send(parent=null){let el=parent?$('thread-input'):$('message-input'),body=el.value;if(!body.trim())return;await api('/channels/'+state.channel.id+'/messages',{method:'POST',body:JSON.stringify({body,parent_id:parent})});el.value='';parent?openThread(parent):loadMessages()}
async function openThread(id){$('thread-panel').classList.add('open');let d=await api('/messages/'+id+'/replies');$('thread-msgs').innerHTML=d.replies.map(x=>'<div class="message"><b>'+x.author.display_name+'</b>: '+esc(x.body)+'</div>').join('')||'<div class="empty">No replies yet.</div>'; $('thread-send').onclick=()=>send(id)}
$('auth-toggle').onclick=()=>{registering=!registering;$('auth-title').textContent=registering?'Create your account':'Sign in to Huddle';$('auth-submit').textContent=registering?'Sign up':'Sign in';$('auth-toggle').textContent=registering?'Back to sign in':'Create an account'}
$('auth-form').onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(e.target));try{let d=await fetch('/api/auth/'+(registering?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let j=await d.json();if(!d.ok)throw Error(j.error);state.token=j.token;localStorage.setItem('huddle.token',j.token);$('auth-modal').classList.remove('show');load()}catch(x){$('auth-error').textContent=x.message}};$('send-btn').onclick=()=>send();$('close-thread').onclick=()=>$('thread-panel').classList.remove('open');$('logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');location.reload()};$('new-channel-btn').onclick=()=>$('create-channel-modal').classList.add('show');$('create-channel-cancel').onclick=()=>$('create-channel-modal').classList.remove('show');$('create-channel-form').onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(e.target));try{await api('/workspaces/'+state.workspace.slug+'/channels',{method:'POST',body:JSON.stringify({name:b.name,topic:b.topic,is_private:$('create-channel-private').checked})});$('create-channel-modal').classList.remove('show');load()}catch(x){$('create-error').textContent=x.message}};showAuth();load();
</script></body></html>
