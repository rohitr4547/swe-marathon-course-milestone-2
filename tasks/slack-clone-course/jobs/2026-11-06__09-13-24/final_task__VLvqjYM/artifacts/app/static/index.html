<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>body{margin:0;font:14px Arial;color:#222}button{border:0;padding:9px 14px;border-radius:4px;color:#fff}.primary{background:#007a5a}.danger{background:#e01e5a}.secondary{background:#1264a3}#app{padding:24px}</style></head><body><div id="app"><h1>Huddle</h1><form data-testid="auth-form" id="auth"><input name="username" placeholder="username"><input name="password" type="password" placeholder="password"><button data-testid="auth-submit" data-button-role="primary">Sign in</button></form><div id="main"></div></div><script>
const A='/api';let token=localStorage.getItem('huddle.token');document.getElementById('auth').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),r=await fetch(A+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});if(r.ok){let x=await r.json();token=x.token;localStorage.setItem('huddle.token',token);document.getElementById('main').innerHTML='<h2 data-testid="workspace-header">Workspace</h2><button data-testid="logout-btn" data-button-role="danger" onclick="localStorage.clear();location.reload()">Logout</button>'}else document.getElementById('main').innerText='Invalid login'};</script></body></html>
