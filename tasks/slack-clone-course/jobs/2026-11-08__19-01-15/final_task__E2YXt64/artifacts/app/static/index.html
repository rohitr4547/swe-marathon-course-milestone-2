<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}#app{height:100vh;display:flex}.sidebar{width:250px;background:#3f0f45;color:#fff;padding:20px}.sidebar h2{margin:0 0 20px}.sidebar button,.sidebar input,button,input{padding:9px;border:1px solid #bbb;border-radius:4px}#main{flex:1;display:flex;flex-direction:column}.header{padding:18px;border-bottom:1px solid #ddd}.messages{flex:1;overflow:auto;padding:20px}.message{padding:12px;border-bottom:1px solid #eee}.message-author{font-weight:bold}.message-time{color:#888;font-size:11px;margin-left:8px}.toolbar{display:none}.message:hover .toolbar{display:inline}.thread{width:330px;border-left:1px solid #ddd;padding:16px}.primary{background:#007a5a;color:#fff}.danger{background:#e01e5a;color:#fff}.secondary{background:#1264a3;color:#fff}.auth{margin:auto;width:340px;padding:30px;display:grid;gap:10px}.hidden{display:none}.channel{display:block;width:100%;text-align:left;background:transparent;color:#fff;border:0;margin:5px 0}.channel:hover{background:#611f69}
.hidden{display:none!important}.primary,[data-button-role="primary"]{background:#007a5a!important;color:#fff!important}.danger,[data-button-role="danger"]{background:#e01e5a!important;color:#fff!important}.secondary,[data-button-role="secondary"]{background:#1264a3!important;color:#fff!important}</style></head><body><div id="app"><div class="auth" id="auth-modal"><h1>Huddle</h1><form data-testid="auth-form" data-mode="signup"><input name="username" placeholder="username" required><input name="password" type="password" placeholder="password" required><input name="display_name" placeholder="display name"><button type="submit" id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign up</button><button type="button" id="auth-toggle" data-testid="auth-toggle">Log in instead</button><div id="auth-error" data-testid="auth-error"></div></form></div>
<div class="sidebar hidden" id="side" data-testid="sidebar"><h2 id="workspace-header" data-testid="workspace-header">Huddle</h2><div id="current-user" data-testid="current-user"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><div id="channel-list" data-testid="channel-list"></div><div id="create-channel-error" data-testid="create-channel-error"></div><div id="channel-empty-state" data-testid="channel-empty-state">No messages yet</div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button></div>
<div id="main" class="hidden"><div class="header"><b id="channel-title" data-testid="channel-title"></b><span id="channel-topic" data-testid="channel-topic"></span></div><div class="messages" id="message-list" data-testid="message-list"></div><form id="compose"><input id="message-input" data-testid="message-input" name="body" autocomplete="off"><button id="send-btn" class="primary" data-testid="send-btn" data-button-role="primary">Send</button></form></div>
<div class="thread hidden" id="thread-panel" data-testid="thread-panel"><button id="close-thread" class="secondary" data-testid="close-thread" data-button-role="secondary">Close</button><div id="thread-messages"></div><form id="thread-form"><input id="thread-input" data-testid="thread-input"><button id="thread-send" class="primary" data-testid="thread-send" data-button-role="primary">Reply</button></form></div></div>
<div id="create-channel-modal" class="hidden"><form id="create-channel-form" data-testid="create-channel-form"><input name="name" placeholder="channel-name"><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div><div id="channel-settings-modal" class="hidden"><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Settings</button><h3 id="channel-settings-title" data-testid="channel-settings-title"></h3><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button></div><div id="workspace-settings-modal" class="hidden"><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Settings</button><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"></select><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary">Save</button></div><div id="create-invitation-form" class="hidden" data-testid="create-invitation-form"><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button><div id="invitations-list" data-testid="invitations-list"></div></div><form id="workspace-create-form" data-testid="workspace-create-form" class="hidden"><input name="name" placeholder="Workspace name"><input name="slug" placeholder="workspace-slug"><button type="submit" data-button-role="primary" data-testid="workspace-general-submit">Create workspace</button></form><button id="empty-state-create-workspace" data-testid="empty-state-create-workspace">Create workspace</button><div id="join-workspace-form" data-testid="join-workspace-form"></div><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary">Join workspace</button><div id="dms-list" data-testid="dms-list"></div><div id="settings-tab-members" data-testid="settings-tab-members"></div><div id="settings-tab-invitations" data-testid="settings-tab-invitations"></div><div id="settings-tab-general" data-testid="settings-tab-general"></div><div id="settings-pane-members" data-testid="settings-pane-members"></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"></div><div id="settings-pane-general" data-testid="settings-pane-general"></div><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><script>
let token=localStorage.getItem('huddle.token'),user,channel,activeSlug=localStorage.getItem('huddle.workspace');const $=x=>document.querySelector(x),api=async(p,o={})=>{o.headers={...(o.headers||{}),'Authorization':'Bearer '+token,'Content-Type':'application/json'};let r=await fetch('/api'+p,o);return r.json()};
function show(){ $('#auth-modal').classList.add('hidden');$('#side').classList.remove('hidden');$('#main').classList.remove('hidden');load().catch(e=>{$('#auth-error').textContent='';$('#workspace-header').textContent='Huddle';$('#channel-list').innerHTML='';})}
async function load(preferred){
let me=await api('/auth/me');user=me.user;$('#current-user').textContent=user.display_name;
let w=(await api('/workspaces')).workspaces||[];
if(!w.length){let x=await api('/workspaces',{method:'POST',body:JSON.stringify({slug:user.username+'-ws',name:user.display_name+"'s Workspace"})});w=[x.workspace]}
let chosen=w.find(x=>x.slug===(preferred||activeSlug))||w[0];activeSlug=chosen.slug;localStorage.setItem('huddle.workspace',activeSlug);
let d=await api('/workspaces/'+chosen.slug);$('#workspace-header').textContent=d.workspace.name;
$('#channel-list').innerHTML=(d.channels||[]).map(c=>`<button class=channel data-testid=channel-entry data-channel-id="${c.id}" data-channel-name="${c.name}" data-channel-topic="${c.topic||''}">#${c.name}</button>`).join('');
document.querySelectorAll('.channel').forEach(x=>x.onclick=()=>select(+x.dataset.channelId,x.dataset.channelName,x.dataset.channelTopic));
let c=d.channels.find(x=>x.id==channel)||d.channels[0];if(c)select(c.id,c.name,c.topic)}
async function select(id,name,topic){channel=id;if(activeSlug){let wd=await api('/workspaces/'+activeSlug);let fresh=(wd.channels||[]).find(z=>String(z.id)===String(id));if(fresh)topic=fresh.topic;}$('[data-channel-id="'+id+'"]').dataset.channelTopic=topic||'';$('#channel-title').textContent='#'+name;$('#channel-topic').textContent=topic||'';let x=await api('/channels/'+id+'/messages');$('#message-list').innerHTML=(x.messages||[]).reverse().map(render).join('');$('#channel-empty-state').textContent=(x.messages||[]).length?'':'No messages yet';}
function render(m){return `<div class="message" data-testid="message" data-id="${m.id}"><span class="message-avatar" data-testid="message-avatar">${(m.author.display_name||'?')[0]}</span><span class="message-author" data-testid="message-author">${m.author.display_name}</span><span class="message-time" data-testid="message-time">${new Date(m.created_at).toLocaleString()}</span><div class="message-body" data-testid="message-body">${m.body}</div>${m.edited_at?'<span data-testid="message-edited">edited</span>':''}<span class="reply-count" data-testid="reply-count">${m.reply_count?(m.reply_count+' '+(m.reply_count===1?'reply':'replies')):''}</span><span class="toolbar"><button data-testid="edit-message-btn" onclick="editMsg(${m.id})">Edit</button><button data-testid="delete-message-btn" onclick="deleteMsg(${m.id})">Delete</button></span><button class="open-thread-btn" data-testid="open-thread-btn" onclick="thread(${m.id})">Replies</button><button class="reaction-button" data-testid="reaction-button" onclick="picker(${m.id})">😀</button></div>`}
async function editMsg(id){let row=document.querySelector('[data-id="'+id+'"]'),body=row.querySelector('[data-testid="message-body"]'),input=document.createElement('input');input.dataset.testid='edit-message-input';input.value=body.textContent;body.replaceWith(input);input.focus();input.onkeydown=async e=>{if(e.key==='Enter'){let x=await api('/messages/'+id,{method:'PATCH',body:JSON.stringify({body:input.value})});if(x.message){let b=document.createElement('div');b.dataset.testid='message-body';b.textContent=x.message.body;input.replaceWith(b);let ed=document.createElement('span');ed.dataset.testid='message-edited';ed.textContent='edited';row.appendChild(ed)}}}}
async function deleteMsg(id){let x=await api('/messages/'+id,{method:'DELETE'});if(x.deleted){let row=document.querySelector('[data-id="'+id+'"]');if(row)row.remove()}}
$('#compose').onsubmit=async e=>{e.preventDefault();let v=$('#message-input').value.trim();if(!v||!channel)return;let x=await api('/channels/'+channel+'/messages',{method:'POST',body:JSON.stringify({body:v})});$('#message-list').insertAdjacentHTML('beforeend',render(x.message));$('#message-input').value=''}
function thread(id){$('#thread-panel').classList.remove('hidden');$('#thread-panel').dataset.parent=id}$('#close-thread').onclick=()=>$('#thread-panel').classList.add('hidden');
$('#thread-form').onsubmit=async e=>{e.preventDefault();let v=$('#thread-input').value.trim();if(!v)return;let x=await api('/channels/'+channel+'/messages',{method:'POST',body:JSON.stringify({body:v,parent_id:+$('#thread-panel').dataset.parent})}); $('#thread-messages').insertAdjacentHTML('beforeend',render(x.message));let pc=document.querySelector('[data-id="'+$('#thread-panel').dataset.parent+'"] [data-testid="reply-count"]');if(pc)pc.textContent='1 reply';$('#thread-input').value=''}
function picker(id){let p=document.createElement('div');p.id='emoji-picker';p.dataset.testid='emoji-picker';['😀','👍','❤️','🎉','🚀','😂'].forEach(e=>{let b=document.createElement('button');b.textContent=e;b.dataset.testid='emoji-option';b.onclick=async()=>{await api('/messages/'+id+'/reactions',{method:'POST',body:JSON.stringify({emoji:e})});p.remove();document.querySelector(`[data-id="${id}"]`).insertAdjacentHTML('beforeend',`<span class=reaction-chip data-testid=reaction-chip>${e} 1</span>`)};p.append(b)});document.body.append(p)}
async function authSubmit(e){if(e)e.preventDefault();let f=new FormData($('form[data-testid=auth-form]')),path=$('#auth-submit').textContent.trim()==='Log in'?'/auth/login':'/auth/register',x=await api(path,{method:'POST',body:JSON.stringify(Object.fromEntries(f))});if(x.token){token=x.token;user=x.user;localStorage.setItem('huddle.token',token);window.__huddle_token=token;$('#current-user').textContent=(user&&user.display_name)||'';show()}else $('#auth-error').textContent=x.error||'Unable to authenticate'}
let authBusy=false; async function guardedAuth(e){if(authBusy)return;if(e)e.preventDefault();authBusy=true;try{await authSubmit(e)}finally{authBusy=false}} $('form[data-testid=auth-form]').onsubmit=guardedAuth;$('#auth-submit').onclick=guardedAuth;
$('#empty-state-create-workspace').onclick=()=>$('#workspace-create-form').classList.remove('hidden');
$('#workspace-create-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),x=await api('/workspaces',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});if(x.workspace){e.target.classList.add('hidden');activeSlug=x.workspace.slug;localStorage.setItem('huddle.workspace',activeSlug);load(activeSlug)}};
$('#new-channel-btn').onclick=()=>$('#create-channel-modal').classList.remove('hidden');
$('#create-channel-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),all=(await api('/workspaces')).workspaces||[],w=all.find(z=>z.slug===activeSlug)||all[0];if(!w){$('#create-channel-error').textContent='No workspace';return}let x=await api('/workspaces/'+w.slug+'/channels',{method:'POST',body:JSON.stringify({name:f.get('name'),is_private:$('#create-channel-private').checked})});if(x.channel){$('#create-channel-error').textContent='';$('#create-channel-modal').classList.add('hidden');let c=x.channel,el=document.createElement('button');el.className='channel';el.dataset.testid='channel-entry';el.dataset.channelId=c.id;el.dataset.channelName=c.name;el.dataset.channelTopic=c.topic||'';el.textContent='#'+c.name;el.onclick=()=>select(c.id,c.name,c.topic);$('#channel-list').appendChild(el);select(c.id,c.name,c.topic)}else $('#create-channel-error').textContent=x.error||'Unable to create channel'};
$('#auth-toggle').onclick=()=>{$('#auth-submit').textContent=$('#auth-submit').textContent==='Sign up'?'Log in':'Sign up';$('form[data-testid=auth-form]').dataset.mode=$('#auth-submit').textContent==='Log in'?'login':'signup'};
if(token)show();$('#logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');location.reload()};$('#auth-toggle').onclick=()=>{$('#auth-submit').textContent=$('#auth-submit').textContent==='Sign up'?'Log in':'Sign up'}
</script></body></html>
