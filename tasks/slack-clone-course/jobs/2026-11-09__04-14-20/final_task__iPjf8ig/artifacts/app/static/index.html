<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
body{margin:0;font:14px Arial;color:#222}.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#3f0f3f;color:white;padding:18px}.main{padding:24px}.btn{border:0;padding:9px 14px;color:#fff;border-radius:4px}.primary{background:#007a5a}.danger{background:#e01e5a}.secondary{background:#1264a3}input{padding:9px;margin:4px}#auth-modal{display:block}.hidden{display:none}.row{padding:10px;border-bottom:1px solid #ddd}</style></head><body>
<div id="auth-modal"><form data-testid="auth-form"><h1>Huddle</h1><input name="username" placeholder="Username"><input name="password" type="password" placeholder="Password"><button class="btn primary" data-button-role="primary" data-testid="auth-submit">Sign in</button><button type="button" data-testid="auth-toggle">Sign up</button><div id="auth-error"></div></form></div>
<div class="layout hidden" id="app"><aside class="side"><h2 data-testid="workspace-header">Huddle</h2><div data-testid="current-user"></div><button class="btn danger" data-button-role="danger" data-testid="logout-btn">Logout</button><div data-testid="channel-list" id="channel-list"></div><button class="btn secondary" data-button-role="secondary" data-testid="new-channel-btn">New channel</button><div data-testid="dms-list"></div></aside><main class="main"><h2 data-testid="channel-title">#general</h2><div data-testid="channel-topic"></div><div data-testid="message-list" id="message-list"></div><form id="message-form"><input data-testid="message-input" name="body"><button class="btn primary" data-button-role="primary" data-testid="send-btn">Send</button></form><aside data-testid="thread-panel" class="hidden"><button class="btn secondary" data-button-role="secondary" data-testid="close-thread">Close</button><input data-testid="thread-input"><button class="btn primary" data-button-role="primary" data-testid="thread-send">Reply</button></aside></main></div>
<div id="create-channel-modal" class="hidden"><form data-testid="create-channel-form"><input name="name"><input data-testid="create-channel-private" type="checkbox"><button class="btn primary" data-button-role="primary" data-testid="create-channel-submit">Create</button><button class="btn secondary" data-button-role="secondary" data-testid="create-channel-cancel">Cancel</button></form></div><script src="/app.js"></script></body></html>
