<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
body{margin:0;font:14px Arial;color:#222}button{border:0;padding:9px 14px;border-radius:4px;color:#fff}button[data-button-role=primary]{background:#007a5a}button[data-button-role=danger]{background:#e01e5a}button[data-button-role=secondary]{background:#1264a3}.layout{display:flex;height:100vh}.side{width:240px;background:#3f0e40;color:white;padding:18px}.main{flex:1;padding:25px;overflow:auto}.thread{width:300px;border-left:1px solid #ddd;padding:15px}.hidden{display:none}.row{padding:10px;border-bottom:1px solid #eee}.error{color:#e01e5a;margin:8px}.channel{cursor:pointer;padding:8px}.channel:before{content:'# '}.modal{padding:20px}input,textarea{padding:9px;margin:5px;border:1px solid #aaa;border-radius:4px}
</style></head><body><div class="layout"><aside class="side"><h2 data-testid="workspace-header">Huddle</h2><div data-testid="current-user"></div><button data-testid="new-channel-btn" data-button-role="secondary">New channel</button><button data-testid="logout-btn" data-button-role="danger">Logout</button><h3>Channels</h3><div data-testid="channel-list"></div><div data-testid="dms-list"></div></aside><main class="main"><h2 data-testid="channel-title">Welcome</h2><div data-testid="channel-topic"></div><div data-testid="message-list"></div><div class="empty" data-testid="empty-state-create-workspace">No messages yet</div><form id="msgform"><input data-testid="message-input" name="body" placeholder="Message"><button data-testid="send-btn" data-button-role="primary">Send</button></form></main><section class="thread hidden" data-testid="thread-panel"><button data-testid="close-thread" data-button-role="secondary">Close</button><div id="thread-list"></div><form id="threadform"><input data-testid="thread-input"><button data-testid="thread-send" data-button-role="primary">Send</button></form></section></div><div id="auth-modal" class="modal"><form data-testid="auth-form"><h2>Sign in</h2><input name="username" placeholder="Username" required><input name="password" type="password" required><input name="display_name" placeholder="Display name"><button data-testid="auth-submit" data-button-role="primary">Sign in</button><button type="button" data-testid="auth-toggle" data-button-role="secondary">Sign up</button><div class="error" id="auth-error"></div></form></div><div id="create-channel-modal" class="hidden"><form data-testid="create-channel-form"><input name="name"><input name="topic"><input id="create-channel-private" type="checkbox"><button data-testid="create-channel-submit" data-button-role="primary">Create</button><button data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div><script>
let token=localStorage.getItem('huddle.token'),me,ws,current;
const $=x=>document.querySelector(x), api=async(u,o={})=>{o.headers={...(o.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(o.body&&typeof o.body!='string'){o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.body)}let r=await fetch('/api'+u,o);let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j};
function showAuth(){ $('#auth-modal').classList.remove('hidden') } function hideAuth(){ $('#auth-modal').classList.add('hidden') }
async function load(){if(!token)return showAuth();try{me=(await api('/auth/me')).user;$('.current-user').textContent=me.display_name;let x=await api('/workspaces');if(!x.workspaces.length){let w=await api('/workspaces',{method:'POST',body:{slug:'my-workspace',name:'My Workspace'}});await openWorkspace(w.workspace.slug)}else await openWorkspace(x.workspaces[0].slug);hideAuth()}catch(e){token=null;showAuth()}}
async function openWorkspace(slug){let x=await api('/workspaces/'+slug),list=$('[data-testid=channel-list]');list.innerHTML='';x.channels.forEach(c=>{let d=document.createElement('div');d.className='channel';d.dataset.testid='channel-entry';d.dataset.channelId=c.id;d.dataset.channelName=c.name;d.textContent=c.name;d.onclick=()=>openChannel(c);list.append(d)});if(x.channels[0])openChannel(x.channels[0])}
async function openChannel(c){current=c;$('[data-testid=channel-title]').textContent='#'+c.name;$('[data-testid=channel-topic]').textContent=c.topic||'';let x=await api('/channels/'+c.id+'/messages'),box=$('[data-testid=message-list]');box.innerHTML='';x.messages.reverse().forEach(render);if(ws)ws.close();ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/api/ws?token='+token);ws.onopen=()=>ws.send(JSON.stringify({type:'subscribe',channel_id:c.id}));ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='message.created'||m.type==='message.reply')render(m.message)}}
function render(m){let d=document.createElement('div');d.className='row';d.dataset.testid='message';d.dataset.messageId=m.id;d.innerHTML='<b>'+m.author.display_name+'</b> <small>'+new Date(m.created_at).toLocaleString()+'</small><div data-testid="message-body">'+m.body+'</div><button data-testid="open-thread-btn" data-button-role="secondary">Thread</button>';d.querySelector('button').onclick=()=>openThread(m);$('[data-testid=message-list]').append(d);$('.empty').style.display='none'}
async function openThread(m){$('.thread').classList.remove('hidden');let x=await api('/messages/'+m.id+'/replies');$('#thread-list').innerHTML=x.replies.map(z=>'<div>'+z.body+'</div>').join('');$('#threadform').onsubmit=async e=>{e.preventDefault();await api('/channels/'+current.id+'/messages',{method:'POST',body:{body:$('#threadform input').value,parent_id:m.id}});$('#threadform input').value=''}}
$('[data-testid=auth-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),d=Object.fromEntries(f);try{let j=await api('/auth/'+(e.target.dataset.signup?'register':'login'),{method:'POST',body:d});token=j.token;localStorage.setItem('huddle.token',token);load()}catch(x){$('#auth-error').textContent=x.message}}; $('[data-testid=auth-toggle]').onclick=()=>{let f=$('[data-testid=auth-form');f.dataset.signup='1';f.querySelector('h2').textContent='Sign up'};$('#msgform').onsubmit=async e=>{e.preventDefault();let i=e.target.body;if(i.value.trim())await api('/channels/'+current.id+'/messages',{method:'POST',body:{body:i.value}}),i.value=''};$('.side [data-testid=logout-btn]').onclick=()=>{localStorage.removeItem('huddle.token');location.reload()};$('.thread [data-testid=close-thread]').onclick=()=>$('.thread').classList.add('hidden');load();
</script></body></html>
