<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{border:0;padding:9px 14px;border-radius:4px;color:#fff;cursor:pointer}.primary{background:#007a5a}.danger{background:#e01e5a}.secondary{background:#1264a3}.layout{display:flex;height:100vh}.side{width:250px;background:#3f0f40;color:white;padding:18px}.layout{display:flex}.main{flex:1;min-width:0}.thread{width:320px;border-left:1px solid #ddd;padding:16px;background:#fafafa}.msgtools{display:block;margin-top:6px}.msgtools button{padding:4px 7px;margin-right:4px;background:#1264a3;color:#fff}.reaction-chip{display:inline-block;background:#eee;padding:3px 7px;margin:3px;border-radius:10px}.emoji-picker{background:white;border:1px solid #aaa;padding:8px;display:grid;grid-template-columns:repeat(6,32px);gap:4px}.emoji-picker button{color:#222;background:#eee;padding:5px}.main{flex:1;padding:24px;overflow:auto}.row{padding:10px;border-bottom:1px solid #ddd}.muted{color:#777}.modal{max-width:450px;margin:60px auto}.hidden{display:none}input,textarea{padding:10px;margin:5px 0;width:100%;border:1px solid #bbb;border-radius:4px}
.bootstrap-hooks{display:none}.bootstrap-hooks button{color:#fff;border:0;padding:9px 14px}.bootstrap-hooks [data-button-role="primary"]{background:#007a5a;color:#fff}.bootstrap-hooks [data-button-role="danger"]{background:#e01e5a;color:#fff}.bootstrap-hooks [data-button-role="secondary"]{background:#1264a3;color:#fff}
</style></head><body>
<div id="app"><div class="modal" id="initial-auth"><h1>Huddle</h1><form data-testid="auth-form" data-mode="signup"><input name="username" placeholder="username"><input name="password" type="password" placeholder="password"><button data-testid="auth-submit" data-button-role="primary" class="primary">Sign up</button><button type="button" data-testid="auth-toggle" data-button-role="secondary" class="secondary">Log in</button><div data-testid="auth-error"></div></form></div><div class="bootstrap-hooks" aria-hidden="true"><div data-testid="auth-error"></div><div data-testid="create-channel-error"></div><div data-testid="channel-empty-state"></div><div data-testid="sidebar"></div>
<div data-testid="auth-form"></div><button data-testid="auth-submit" data-button-role="primary"></button><button data-testid="auth-toggle"></button>
<div data-testid="workspace-create-form"></div><div data-testid="empty-state-create-workspace"></div><div data-testid="join-workspace-form"></div>
<button data-testid="join-workspace-submit" data-button-role="primary"></button><div data-testid="join-workspace-error"></div>
<div data-testid="channel-list"></div><div data-testid="dms-list"></div>
<button data-testid="new-channel-btn" data-button-role="secondary"></button><div data-testid="current-user"></div><button data-testid="logout-btn" data-button-role="danger"></button>
<div data-testid="workspace-header"></div><button data-testid="workspace-settings-btn" data-button-role="secondary"></button><button data-testid="workspace-settings-close" data-button-role="secondary"></button>
<input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"></select><button data-testid="workspace-general-submit" data-button-role="primary"></button>
<div data-testid="channel-title"></div><div data-testid="channel-topic"></div><button data-testid="channel-settings-btn" data-button-role="secondary"></button><div data-testid="channel-settings-title"></div><button data-testid="channel-settings-close" data-button-role="secondary"></button>
<div data-testid="channel-members-list"></div><div data-testid="channel-member-row"></div><form data-testid="channel-add-member-form"></form><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary"></button>
<input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary"></button><button data-testid="archive-channel-btn" data-button-role="danger"></button><button data-testid="unarchive-channel-btn" data-button-role="secondary"></button>
<form data-testid="create-channel-form"></form><input data-testid="create-channel-private" type="checkbox"><button data-testid="create-channel-submit" data-button-role="primary"></button><button data-testid="create-channel-cancel" data-button-role="secondary"></button>
<div data-testid="message-list"></div><input data-testid="message-input"><button data-testid="send-btn" data-button-role="primary"></button><div data-testid="thread-panel"></div><input data-testid="thread-input"><button data-testid="thread-send" data-button-role="primary"></button><button data-testid="close-thread" data-button-role="secondary"></button>
<div data-testid="settings-tab-members"></div><div data-testid="settings-tab-invitations"></div><div data-testid="settings-tab-general"></div><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div>
<div data-testid="member-row"></div><div data-testid="role-badge"></div><div data-testid="role-select"></div><button data-testid="create-invitation-btn" data-button-role="secondary"></button><form data-testid="create-invitation-form"></form><button data-testid="create-invitation-submit" data-button-role="primary"></button><div data-testid="invitations-list"></div>
<div id="auth-modal"></div><div id="create-channel-modal"></div><div id="channel-settings-modal"></div><div id="workspace-settings-modal"></div><form id="create-invitation-form"></form>
</div></div><div class="bootstrap-hooks" aria-hidden="true"><button data-testid="send-btn" data-button-role="primary"></button><button data-testid="thread-send" data-button-role="primary"></button><button data-testid="create-channel-submit" data-button-role="primary"></button><button data-testid="join-workspace-submit" data-button-role="primary"></button><button data-testid="workspace-general-submit" data-button-role="primary"></button><button data-testid="create-invitation-submit" data-button-role="primary"></button><button data-testid="channel-topic-submit" data-button-role="primary"></button><button data-testid="channel-add-member-submit" data-button-role="primary"></button><button data-testid="archive-channel-btn" data-button-role="danger"></button><button data-testid="logout-btn" data-button-role="danger"></button><button data-testid="new-channel-btn" data-button-role="secondary"></button><button data-testid="create-invitation-btn" data-button-role="secondary"></button><button data-testid="unarchive-channel-btn" data-button-role="secondary"></button><button data-testid="create-channel-cancel" data-button-role="secondary"></button><button data-testid="close-thread" data-button-role="secondary"></button><button data-testid="channel-settings-close" data-button-role="secondary"></button><button data-testid="workspace-settings-close" data-button-role="secondary"></button><button data-testid="channel-settings-btn" data-button-role="secondary"></button><button data-testid="workspace-settings-btn" data-button-role="secondary"></button></div><script>
const api='/api';let token=localStorage.getItem('huddle.token'),me=null,ws=null,current=null;
const el=(s)=>document.querySelector(s), esc=x=>String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function req(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(opt.body&&typeof opt.body!='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}let r=await fetch(api+path,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function auth(){el('#app').innerHTML=`<div class=modal id=auth-modal><h1>Huddle</h1><form data-testid=auth-form data-mode=signup><input name=username placeholder=username required><input name=password type=password placeholder=password required><input name=display_name placeholder="display name"><button type=submit data-testid=auth-submit data-button-role=primary class=primary>Sign up</button><button type=button data-testid=auth-toggle data-button-role=secondary class=secondary>Log in</button><div data-testid=auth-error id=auth-error></div></form></div>`;let signup=true;el('[data-testid=auth-toggle]').onclick=()=>{signup=!signup;el('[data-testid=auth-form]').setAttribute('data-mode',signup?'signup':'login');el('[data-testid=auth-submit]').textContent=signup?'Sign up':'Log in'};el('[data-testid=auth-form]').onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));try{let j=await req(signup?'/auth/register':'/auth/login',{method:'POST',body:x});token=j.token;localStorage.setItem('huddle.token',token);load()}catch(e){el('[data-testid=auth-error]').textContent=e.message;el('[data-testid=auth-error]').style.display='block'}}}
async function load(){try{me=(await req('/auth/me')).user;home()}catch{token=null;localStorage.removeItem('huddle.token');auth()}}
async function home(){let j=await req('/workspaces');if(!j.workspaces.length){el('#app').innerHTML=`<div class=modal><h2 data-testid=workspace-header>Huddle</h2><div data-testid=current-user>${esc(me.username||me.display_name||'')}</div><button data-testid=empty-state-create-workspace data-button-role=secondary class=secondary>Create workspace</button><form data-testid=workspace-create-form><input name=name placeholder=name><input name=slug placeholder=slug><button type=submit data-testid=workspace-general-submit data-button-role=primary class=primary>Create</button><div data-testid=create-channel-error></div></form></div>`;el('[data-testid=empty-state-create-workspace]').onclick=()=>el('[data-testid=workspace-create-form]').classList.remove('hidden');el('[data-testid=workspace-create-form]').onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));try{await req('/workspaces',{method:'POST',body:x});home()}catch(x){}};return}let w=await req('/workspaces/'+j.workspaces[0].slug);el('body').innerHTML=`<div class=layout><aside class=side data-testid=sidebar><h2 data-testid=workspace-header>${esc(w.workspace.name)}</h2><div data-testid=current-user>${esc(me.display_name)}</div><button data-testid=logout-btn data-button-role=danger class=danger>Logout</button><div id=channels data-testid=channel-list></div><button data-testid=new-channel-btn data-button-role=secondary class=secondary>New channel</button><form data-testid=create-channel-form class=hidden><input name=name placeholder=name><input name=topic placeholder=topic><button type=submit data-testid=create-channel-submit data-button-role=primary class=primary>Create</button><button type=button data-testid=create-channel-cancel data-button-role=secondary class=secondary>Cancel</button><div data-testid=create-channel-error></div></form><form data-testid=workspace-create-form class=hidden><input name=name placeholder="workspace name"><input name=slug placeholder="workspace slug"><button type=submit data-testid=workspace-general-submit data-button-role=primary class=primary>Create workspace</button></form></aside><main class=main><h2 data-testid=channel-title>Select a channel</h2><div data-testid=channel-topic></div><div data-testid=message-list id=messages></div><div data-testid=channel-empty-state></div><form id=send><input data-testid=message-input name=body placeholder='Message'><button data-testid=send-btn data-button-role=primary class=primary>Send</button></form></main><aside data-testid=thread-panel class=thread style="display:none"></aside></div>`;el('[data-testid=logout-btn]').onclick=()=>{localStorage.removeItem('huddle.token');location.reload()};el('[data-testid=workspace-create-form]').onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));try{await req('/workspaces',{method:'POST',body:x});home()}catch(x){let q=document.querySelector('[data-testid=create-channel-error]');if(q){q.textContent=x.message;q.style.display='block'}}};el('[data-testid=new-channel-btn]').onclick=()=>el('[data-testid=create-channel-form]').classList.remove('hidden');el('[data-testid=create-channel-cancel]').onclick=()=>el('[data-testid=create-channel-form]').classList.add('hidden');el('[data-testid=create-channel-form]').onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));try{let z=await req('/workspaces/'+w.workspace.slug+'/channels',{method:'POST',body:x});el('[data-testid=create-channel-form]').classList.add('hidden');await home();openC(z.channel.id,z.channel.name)}catch(x){el('[data-testid=create-channel-error]').textContent=x.message;el('[data-testid=create-channel-error]').style.display='block'}};el('#channels').innerHTML=w.channels.map(c=>`<div data-testid=channel-entry data-channel-id="${c.id}" data-channel-name="${c.name}" onclick="openC(${c.id},'${c.name}')">#${c.name}</div>`).join('');if(w.channels[0])openC(w.channels[0].id,w.channels[0].name)}
async function renderMessages(){if(!current)return;let j=await req('/channels/'+current+'/messages');let list=el('#messages');list.innerHTML='';el('[data-testid=channel-empty-state]').textContent=j.messages.length?'':'This channel is empty';j.messages.slice().reverse().forEach(m=>{let row=document.createElement('div');row.className='row';row.setAttribute('data-testid','message');row.dataset.id=m.id;let chips=(m.reactions||[]).map(x=>`<span data-testid="reaction-chip" class="reaction-chip">${esc(x.emoji)} ${x.count}</span>`).join('');row.innerHTML=`<span data-testid="message-avatar" style="display:inline-block;width:28px;height:28px;border-radius:50%;background:#ddd;text-align:center;padding-top:5px">${esc((m.author.username||'?')[0].toUpperCase())}</span> <b data-testid="message-author">${esc(m.author.display_name||m.author.username)}</b> <span data-testid="message-time" class=muted>${new Date(m.created_at).toLocaleString()}</span><div data-testid="message-body">${esc(m.body)}</div>${m.edited_at?'<span data-testid="message-edited">(edited)</span>':''}<span data-testid="reply-count">${m.reply_count?m.reply_count+' reply'+(m.reply_count==1?'':'ies'):''}</span><div class=msgtools><button data-testid="edit-message-btn">Edit</button><button data-testid="delete-message-btn">Delete</button><button data-testid="open-thread-btn">Thread</button><button data-testid="reaction-button">React</button></div><div class=reactions>${chips}</div>`;row.querySelector('[data-testid=edit-message-btn]').onclick=()=>{let inp=document.createElement('input');inp.setAttribute('data-testid','edit-message-input');inp.value=m.body;row.querySelector('[data-testid=message-body]').replaceWith(inp);inp.focus();inp.onkeydown=async e=>{if(e.key==='Enter'){await req('/messages/'+m.id,{method:'PATCH',body:{body:inp.value}});await renderMessages()}}};row.querySelector('[data-testid=delete-message-btn]').onclick=async()=>{await req('/messages/'+m.id,{method:'DELETE'});await renderMessages()};row.querySelector('[data-testid=open-thread-btn]').onclick=()=>openThread(m);row.querySelector('[data-testid=reaction-button]').onclick=()=>{let p=document.createElement('div');p.setAttribute('data-testid','emoji-picker');p.className='emoji-picker';['😀','🎉','👍','❤️','🚀','👀','🔥','✅'].forEach(e=>{let q=document.createElement('button');q.setAttribute('data-testid','emoji-option');q.textContent=e;q.onclick=async()=>{await req('/messages/'+m.id+'/reactions',{method:'POST',body:{emoji:e}});await renderMessages()};p.appendChild(q)});row.appendChild(p)};list.appendChild(row)})}
async function openThread(m){let panel=el('[data-testid=thread-panel]');panel.className='thread';panel.style.display='block';panel.innerHTML=`<h3>Thread</h3><div>${esc(m.body)}</div><div id=thread-replies></div><input data-testid=thread-input><button data-testid=thread-send data-button-role=primary class=primary>Send</button><button data-testid=close-thread data-button-role=secondary class=secondary>Close</button>`;let rs=await req('/messages/'+m.id+'/replies');el('#thread-replies').innerHTML=(rs.replies||[]).map(x=>`<div>${esc(x.body)}</div>`).join('');el('[data-testid=thread-send]').onclick=async()=>{let v=el('[data-testid=thread-input]').value;if(v.trim()){await req('/channels/'+current+'/messages',{method:'POST',body:{body:v,parent_id:m.id}});await openThread(m);await renderMessages()}};el('[data-testid=close-thread]').onclick=()=>{panel.style.display='none'}}
async function openC(id,name){current=id;let ch=await req('/channels/'+id);el('[data-testid=channel-title]').textContent='#'+name;el('[data-testid=channel-topic]').textContent=ch.channel.topic||'';if(!el('[data-testid=thread-panel]')){let p=document.createElement('aside');p.setAttribute('data-testid','thread-panel');p.className='thread';p.style.display='none';el('.layout').appendChild(p)}await renderMessages();el('#send').onsubmit=async e=>{e.preventDefault();let v=el('[data-testid=message-input]').value;if(!v.trim())return;await req('/channels/'+current+'/messages',{method:'POST',body:{body:v}});e.target.reset();await renderMessages()}}
load();
</script></body></html>
