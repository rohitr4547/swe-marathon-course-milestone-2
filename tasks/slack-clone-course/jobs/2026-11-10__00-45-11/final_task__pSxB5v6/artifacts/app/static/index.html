<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#1d1c1d;background:#fff}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{background:#3f0e40;color:#fff;padding:18px}.main{display:flex;flex-direction:column}.top{height:60px;border-bottom:1px solid #ddd;padding:16px 22px;font-weight:bold}.messages{flex:1;padding:22px;overflow:auto}.composer{padding:16px;border-top:1px solid #ddd;display:flex;gap:8px}.message{padding:10px 0}.avatar{display:inline-block;background:#1264a3;color:white;border-radius:50%;padding:8px;margin-right:8px}.channel-entry{display:block;color:#eee;padding:8px;border:0;background:none;text-align:left;width:100%;cursor:pointer}.empty{padding:50px;text-align:center;color:#666}button{border:0;border-radius:4px;padding:9px 14px;cursor:pointer}.primary{background:#007a5a;color:#fff}.danger{background:#e01e5a;color:#fff}.secondary{background:#1264a3;color:#fff}.modal{display:none}input{padding:9px;border:1px solid #bbb;border-radius:4px}
</style></head><body><div class="app"><aside class="sidebar"><h2 id="workspace-header">Huddle</h2><div id="current-user"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary" class="secondary">New channel</button><div id="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list"></div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger" class="danger">Logout</button></aside><main class="main"><header class="top"><span id="channel-title" data-testid="channel-title"># general</span> <small id="channel-topic" data-testid="channel-topic"></small></header><section id="message-list" data-testid="message-list" class="messages"><div class="empty" id="empty-state">No messages yet. Start the conversation.</div></section><form id="composer" class="composer"><input id="message-input" data-testid="message-input" name="message" placeholder="Message" autocomplete="off"><button id="send-btn" data-testid="send-btn" data-button-role="primary" class="primary">Send</button></form></main></div>
<div id="auth-modal"><form id="auth-form" data-testid="auth-form"><h2>Sign in</h2><input name="username" required><input name="password" type="password" required><button id="auth-submit" data-testid="auth-submit" data-button-role="primary" class="primary">Sign in</button><button type="button" id="auth-toggle" data-testid="auth-toggle">Sign up</button><div id="auth-error"></div></form></div>
<div id="create-channel-modal" class="modal"><form id="create-channel-form" data-testid="create-channel-form"><input name="name"><label><input id="create-channel-private" data-testid="create-channel-private" type="checkbox">Private</label><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary" class="primary">Create</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary" class="secondary">Cancel</button></form></div>
<div id="thread-panel" data-testid="thread-panel" class="modal"><button id="close-thread" data-testid="close-thread" data-button-role="secondary" class="secondary">Close</button><div id="thread-messages"></div><form><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary" class="primary">Send</button></form></div>
<button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary" class="secondary">Workspace settings</button><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary" class="secondary">Channel settings</button><script src="/app.js"></script></body></html>
