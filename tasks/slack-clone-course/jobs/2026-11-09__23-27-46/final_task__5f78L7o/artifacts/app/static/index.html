<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{border:0;border-radius:4px;padding:9px 14px;color:#fff;cursor:pointer}[data-button-role=primary]{background:#007a5a;color:#fff}[data-button-role=danger]{background:#e01e5a;color:#fff}[data-button-role=secondary]{background:#1264a3;color:#fff}.layout{display:flex;height:100vh}.sidebar{width:260px;background:#3f0e40;color:#fff;padding:18px}.main{flex:1;padding:20px}.modal{display:block}.toolbar{display:none}.message:hover .toolbar{display:block}.toolbar button{background:#1264a3;color:#fff;padding:4px 7px}.message{padding:10px;border-bottom:1px solid #ddd}.thread-panel{display:none;position:fixed;right:0;top:0;width:28%;height:100vh;background:#fff;border-left:1px solid #ccc;padding:18px;z-index:5}.main{position:relative}.main>[data-testid="message-list"]{width:50%;min-height:120px}
</style></head><body><div class="layout"><aside class="sidebar" data-testid="sidebar"><h2 data-testid="workspace-header">Huddle</h2><div data-testid="current-user"></div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><div data-testid="channel-list"></div><div data-testid="dms-list"></div></aside><main class="main"><h2 data-testid="channel-title"># general</h2><div data-testid="channel-topic"></div><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button><div id="message-list" data-testid="message-list"><div data-testid="channel-empty-state">No messages yet. Start the conversation.</div></div><input id="message-input" data-testid="message-input" name="message"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></main></div>

<div id="workspace-settings-modal"><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"></select><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary">Save</button><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><div data-testid="member-row"></div><div data-testid="role-badge"></div><select data-testid="role-select"></select><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button><div data-testid="invitations-list"></div><span data-testid="invitation-code"></span></form></div>
