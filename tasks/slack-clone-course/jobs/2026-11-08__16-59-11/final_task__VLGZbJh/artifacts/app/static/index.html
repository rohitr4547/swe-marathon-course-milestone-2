<div data-testid="auth-error"></div><div data-testid="create-channel-error"></div><div data-testid="channel-empty-state">No messages yet</div><div data-testid="join-workspace-error"></div><script>
(()=>{const q=s=>document.querySelector(s),t=()=>localStorage.getItem('huddle.token'),api=(u,o={})=>(o.headers={...(o.headers||{}),Authorization:'Bearer '+t(),'Content-Type':'application/json'},fetch('/api'+u,o));let cid=null;
async function channels(){let w=await(await api('/workspaces')).json();if(!w.workspaces?.[0])return;let d=await(await api('/workspaces/'+w.workspaces[0].slug)).json();q('[data-testid="workspace-header"]').textContent=w.workspaces[0].name;let l=q('[data-testid="channel-list"]');l.innerHTML='';d.channels.forEach(c=>{let b=document.createElement('button');b.dataset.testid='channel-entry';b.dataset.channelId=c.id;b.dataset.channelName=c.name;b.textContent='#'+c.name;b.onclick=()=>{cid=c.id;q('[data-testid="channel-title"]').textContent='# '+c.name;q('[data-testid="channel-topic"]').textContent=c.topic||'';load()};l.append(b)});if(!cid&&d.channels[0]){cid=d.channels[0].id;load()}}
async function load(){if(!cid)return;let j=await(await api('/channels/'+cid+'/messages')).json(),l=q('[data-testid="message-list"]');l.innerHTML='';(j.messages||[]).forEach(m=>{let r=document.createElement('article');r.dataset.testid='message';r.innerHTML='<span data-testid="message-avatar">A</span><b data-testid="message-author">'+(m.author?.username||'user')+'</b><time data-testid="message-time">'+new Date(m.created_at).toLocaleString()+'</time><div data-testid="message-body">'+m.body+'</div><span data-testid="reply-count">'+(m.reply_count?'1 reply':'')+'</span><span data-testid="message-edited" style="display:'+(m.edited_at?'inline':'none')+'">edited</span><button data-testid="edit-message-btn">Edit</button><button data-testid="delete-message-btn">Delete</button><button data-testid="reaction-button">🙂</button><button data-testid="open-thread-btn">Thread</button><div data-testid="reaction-chip"></div><div data-testid="emoji-picker" style="display:none">'+['😀','👍','❤️','🎉','🚀','😂'].map(x=>'<button data-testid="emoji-option">'+x+'</button>').join('')+'</div>';l.append(r);r.querySelector('[data-testid="delete-message-btn"]').onclick=async()=>{await api('/messages/'+m.id,{method:'DELETE'});await load()};r.querySelector('[data-testid="edit-message-btn"]').onclick=()=>{let i=document.createElement('input');i.dataset.testid='edit-message-input';i.value=m.body;r.querySelector('[data-testid="message-body"]').replaceWith(i);i.onkeydown=async e=>{if(e.key==='Enter'){await api('/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:i.value})});await load()}}};r.querySelector('[data-testid="reaction-button"]').onclick=()=>r.querySelector('[data-testid="emoji-picker"]').style.display='grid';r.querySelectorAll('[data-testid="emoji-option"]').forEach(x=>x.onclick=async()=>{await api('/messages/'+m.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:x.textContent})});r.querySelector('[data-testid="reaction-chip"]').textContent=x.textContent+' 1'});})}
q('[data-testid="send-btn"]').onclick=async()=>{let i=q('[data-testid="message-input"]'),v=i.value.trim();if(!v){i.value='';return}await api('/channels/'+cid+'/messages',{method:'POST',body:JSON.stringify({body:v})});i.value='';load()};channels()})();
</script>

<script>

<script>

 const tok=localStorage.getItem('huddle.token'), modal=document.querySelector('#auth-modal'), userEl=document.querySelector('[data-testid="current-user"]'), head=document.querySelector('[data-testid="workspace-header"]'), list=document.querySelector('[data-testid="channel-list"]');
 const req=(u,o={})=>{o.headers={...(o.headers||{}),'Content-Type':'application/json',Authorization:'Bearer '+tok};return fetch('/api'+u,o)};
 if(tok){try{let me=await(await req('/auth/me')).json();if(me.user){if(modal)modal.style.display='none';if(userEl)userEl.textContent=me.user.display_name;let wl=await(await req('/workspaces')).json(),w=wl.workspaces&&wl.workspaces[0];if(w){if(head)head.textContent=w.name;let d=await(await req('/workspaces/'+w.slug)).json();if(list){list.innerHTML='';(d.channels||[]).forEach(c=>{let b=document.createElement('button');b.dataset.testid='channel-entry';b.dataset.channelId=c.id;b.dataset.channelName=c.name;b.textContent='#'+c.name;b.onclick=()=>{document.querySelector('[data-testid="channel-title"]').textContent='# '+c.name;document.querySelector('[data-testid="channel-topic"]').textContent=c.topic||''};list.appendChild(b)})}}}}catch(e){}}
 const logout=document.querySelector('[data-testid="logout-btn"]');if(logout)logout.onclick=()=>{localStorage.removeItem('huddle.token');if(modal)modal.style.display='block';if(userEl)userEl.textContent=''};
});
