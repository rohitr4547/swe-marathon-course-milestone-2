<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{border:0;padding:9px 14px;border-radius:4px;color:#fff;cursor:pointer}.primary{background:#007a5a}.danger{background:#e01e5a}.secondary{background:#1264a3}.app{display:flex;height:100vh}.sidebar{width:250px;background:#3f0e40;color:white;padding:18px}.main{flex:1;display:flex;min-width:0}.messages{flex:1;padding:20px;overflow:auto}.thread{width:330px;border-left:1px solid #ddd;padding:15px;overflow:auto}.hidden{display:none}.auth{max-width:380px;margin:70px auto;padding:25px;border:1px solid #ddd;border-radius:8px}input,textarea,select{width:100%;padding:9px;margin:6px 0;border:1px solid #bbb;border-radius:4px}.channel-entry{padding:9px;border-radius:4px;cursor:pointer}.channel-entry:hover,.selected{background:#6b2b68}.msg{padding:12px 4px;border-bottom:1px solid #eee}.avatar{display:inline-block;background:#1264a3;color:#fff;border-radius:50%;width:30px;height:30px;text-align:center;padding-top:7px;margin-right:8px}.toolbar{display:block;float:right}.reaction-chip{display:inline-block;background:#eee;padding:4px 8px;border-radius:10px;margin:3px}.emoji-picker{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;background:#fff;border:1px solid #aaa;padding:8px;position:absolute}.emoji-option{font-size:20px;background:#eee;color:#222;padding:5px}.top{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:12px 20px}.compose{display:flex;gap:8px;position:sticky;bottom:0;background:#fff;padding-top:10px}.compose input{flex:1}.empty{padding:80px 10px;text-align:center;color:#777}
</style></head><body>
<div id="auth-modal" class="auth"><form id="auth-form" data-testid="auth-form" data-mode="signup"><h2>Huddle</h2><div id="auth-error" data-testid="auth-error"></div><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><input name="display_name" placeholder="Display name"><button id="auth-submit" data-testid="auth-submit" data-button-role="primary" class="primary">Sign up</button><button type="button" id="auth-toggle" data-testid="auth-toggle" class="secondary" data-button-role="secondary">Log in instead</button></form></div>
<div id="workspace-create-form" data-testid="workspace-create-form" class="auth hidden"><button id="empty-state-create-workspace" data-testid="empty-state-create-workspace" class="primary" data-button-role="primary">Create workspace</button><h2>Create a workspace</h2><form><input name="slug" placeholder="workspace-slug"><input name="name" placeholder="Workspace name"><button class="primary" data-button-role="primary" type="submit">Create workspace</button></form></div>
<div id="join-workspace-form" data-testid="join-workspace-form" class="hidden"><input name="workspace"><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary" class="primary">Join</button><div id="join-workspace-error" data-testid="join-workspace-error"></div></div><div id="app" class="app hidden"><aside class="sidebar" id="sidebar" data-testid="sidebar"><h2 id="workspace-header" data-testid="workspace-header">Huddle</h2><div id="current-user" data-testid="current-user"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary" class="secondary">+ Channel</button><div id="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list"></div><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary" class="secondary">Workspace</button><button id="logout-btn" data-testid="logout-btn" data-button-role="danger" class="danger">Logout</button></aside><section class="main"><div class="messages"><div class="top"><div><b id="channel-title" data-testid="channel-title"># general</b><div id="channel-topic" data-testid="channel-topic"></div></div><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary" class="secondary">Settings</button></div><div id="message-list" data-testid="message-list"><div id="rendered-messages"></div><div id="channel-empty-state" data-testid="channel-empty-state" class="empty hidden">No messages yet</div><div class="empty" id="empty-state">No messages yet. Start the conversation!</div><div id="global-emoji-picker" data-testid="emoji-picker" class="emoji-picker hidden"></div></div><form class="compose" id="compose"><input id="message-input" data-testid="message-input" autocomplete="off" placeholder="Message"><button id="send-btn" data-testid="send-btn" data-button-role="primary" class="primary">Send</button></form></div><aside id="thread-panel" data-testid="thread-panel" class="thread hidden"><button id="close-thread" data-testid="close-thread" data-button-role="secondary" class="secondary">Close</button><h3>Thread</h3><div id="thread-list"></div><form id="thread-form"><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary" class="primary">Reply</button></form></aside></section></div>
<div id="create-channel-modal" class="auth hidden"><form id="create-channel-form" data-testid="create-channel-form"><input name="name" placeholder="channel-name"><div id="create-channel-error" data-testid="create-channel-error"></div><input name="topic" placeholder="topic"><label><input id="create-channel-private" data-testid="create-channel-private" name="is_private" type="checkbox"> Private</label><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary" class="primary">Create</button><button type="button" id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary" class="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" class="auth hidden"><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary" class="primary">Add member</button></form><h3 id="channel-settings-title" data-testid="channel-settings-title">Channel settings</h3><div id="channel-members-list" data-testid="channel-members-list"></div><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary" class="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger" class="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary" class="secondary">Unarchive</button><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary" class="secondary">Close</button></div>
<div id="workspace-settings-modal" class="auth hidden"><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary" class="secondary">Close</button><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary" class="primary">Save</button><button id="settings-tab-members" data-testid="settings-tab-members">Members</button><button id="settings-tab-invitations" data-testid="settings-tab-invitations">Invitations</button><button id="settings-tab-general" data-testid="settings-tab-general">General</button><div id="settings-pane-members" data-testid="settings-pane-members"></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"></div><div id="settings-pane-general" data-testid="settings-pane-general"></div><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary" class="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary" class="primary">Create invitation</button></form><div id="invitations-list" data-testid="invitations-list"></div></div>
<script>
let token=localStorage.getItem('huddle.token'),user=null,ws=null,current=null,workspace=null,channels=[],loadSeq=0;
const $=id=>document.getElementById(id), api=async(url,opt={})=>{opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};return fetch('/api'+url,opt)}, show=(x,v)=>$(x).classList.toggle('hidden',!v);
function formData(f){return Object.fromEntries(new FormData(f).entries())}
async function login(e){e.preventDefault();let b=formData($('auth-form')),r=await api($('auth-form').dataset.mode==='login'?'/auth/login':'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),x=await r.json();if(!r.ok){$('auth-error').textContent=x.error||'Invalid input';return}token=x.token;localStorage.setItem('huddle.token',token);user=x.user;await boot()}
async function boot(){show('auth-modal',false);show('workspace-create-form',false);show('app',true);$('current-user').textContent=user.display_name;let r=await api('/workspaces'),x=await r.json();if(!x.workspaces.length){show('workspace-create-form',true);show('app',false);return}workspace=x.workspaces[0];await loadWorkspace()}
async function loadWorkspace(){let r=await api('/workspaces/'+workspace.slug),x=await r.json();channels=x.channels; $('workspace-header').textContent=workspace.name;renderChannels();await selectChannel(channels[0])}
function renderChannels(){$('channel-list').innerHTML=channels.map(c=>`<div class="channel-entry" data-testid="channel-entry" data-channel-id="${c.id}" data-channel-name="${c.name}" onclick="selectChannel(channels.find(x=>x.id==${c.id}))">#${c.name}</div>`).join('')}
async function refreshCurrent(){if(current)await selectChannel(current)}
async function selectChannel(c){if(!c)return;let seq=++loadSeq;let rr=await api('/channels/'+c.id),xx=await rr.json();let fresh=xx.channel;if(fresh)c=fresh;current=c;$('channel-title').textContent='#'+c.name;$('channel-topic').textContent=c.topic||'';let r=await api('/channels/'+c.id+'/messages'),x=await r.json();$('channel-empty-state').classList.toggle('hidden',!!x.messages.length);$('rendered-messages').innerHTML=x.messages.length?x.messages.map(renderMessage).join(''):'';$('channel-empty-state').classList.toggle('hidden',!!x.messages.length)}
function renderMessage(m){return `<div class="msg" data-testid="message" data-id="${m.id}"><span class="avatar" data-testid="message-avatar">${(m.author.display_name||'?')[0]}</span><b data-testid="message-author">${m.author.display_name}</b> <small data-testid="message-time">${new Date(m.created_at).toLocaleString()}</small><div class="message-body" data-testid="message-body">${esc(m.body)}</div>${m.edited_at?'<i data-testid="message-edited">(edited)</i>':''}<div class="toolbar"><span class="reply-count" data-testid="reply-count">${m.reply_count==1?"1 reply":(m.reply_count||0)+" replies"}</span><button class="open-thread-btn" data-testid="open-thread-btn" onclick="thread(${m.id})">Thread</button><button class="reaction-button" data-testid="reaction-button" data-reaction-id="${m.id}" onclick="window.picker(${m.id},this)">😀</button><button class="edit-message-btn" data-testid="edit-message-btn" onclick="editMsg(${m.id})">Edit</button><button class="delete-message-btn" data-testid="delete-message-btn" onclick="deleteMsg(${m.id})">Delete</button></div>${(m.reactions||[]).map(x=>`<span class="reaction-chip" data-testid="reaction-chip">${x.emoji} ${x.count}</span>`).join('')}</div>`}
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
document.addEventListener('click',e=>{
 let b=e.target.closest('[data-testid="edit-message-btn"]');if(b){editMsg(b.closest('[data-testid="message"]').dataset.id);return}
 b=e.target.closest('[data-testid="delete-message-btn"]');if(b){deleteMsg(b.closest('[data-testid="message"]').dataset.id);return}
 b=e.target.closest('[data-testid="open-thread-btn"]');if(b){thread(b.closest('[data-testid="message"]').dataset.id);return}
 b=e.target.closest('[data-testid="reaction-button"]');if(b){picker(b.dataset.reactionId||b.closest('[data-testid="message"]').dataset.id,b);return}
});
$('auth-form').onsubmit=login;$('auth-toggle').onclick=()=>{let f=$('auth-form');f.dataset.mode=f.dataset.mode==='signup'?'login':'signup';$('auth-submit').textContent=f.dataset.mode==='signup'?'Sign up':'Log in'}
$('logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');token=null;show('app',false);show('auth-modal',true)}
$('workspace-create-form').querySelector('form').onsubmit=async e=>{e.preventDefault();let b=formData(e.target),r=await api('/workspaces',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(r.ok){workspace=(await r.json()).workspace;await boot()}}
$('compose').onsubmit=async e=>{e.preventDefault();let i=$('message-input');if(!i.value.trim())return;await api('/channels/'+current.id+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:i.value})});i.value='';await selectChannel(current)}
$('new-channel-btn').onclick=()=>show('create-channel-modal',true);$('create-channel-cancel').onclick=()=>show('create-channel-modal',false)
$('create-channel-form').onsubmit=async e=>{e.preventDefault();let b=formData(e.target);b.is_private=!!b.is_private;let r=await api('/workspaces/'+workspace.slug+'/channels',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(r.ok){let nc=(await r.json()).channel;channels.push(nc);renderChannels();show('create-channel-modal',false);await selectChannel(nc)}else $('create-channel-error').textContent='Channel could not be created'}
async function editMsg(id){let row=document.querySelector('[data-testid="message"][data-id="'+id+'"]');if(!row)return;let input=document.createElement('input');input.setAttribute('data-testid','edit-message-input');input.value=row.querySelector('[data-testid="message-body"]').innerText;row.querySelector('[data-testid="message-body"]').replaceWith(input);input.focus();input.onkeydown=async e=>{if(e.key==='Enter'){let rr=await api('/messages/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:input.value})});if(rr.ok){let row2=document.querySelector('[data-testid="message"][data-id="'+id+'"]');row2.querySelector('[data-testid="edit-message-input"]').outerHTML='<div class="message-body" data-testid="message-body">'+esc(input.value)+'</div><i data-testid="message-edited">(edited)</i>'}}}}
async function deleteMsg(id){let r=await api('/messages/'+encodeURIComponent(id),{method:'DELETE'});if(r.ok){let row=document.querySelector('[data-testid="message"][data-id="'+id+'"]');if(row)row.remove()}}
async function thread(id){show('thread-panel',true);let r=await api('/messages/'+id+'/replies'),x=await r.json();$('thread-list').innerHTML=x.replies.map(renderMessage).join('');$('thread-form').onsubmit=async e=>{e.preventDefault();let rr=await api('/channels/'+current.id+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:$('thread-input').value,parent_id:id})});if(rr.ok){await thread(id);let row=document.querySelector('[data-testid="message"][data-id="'+id+'"]');let rc=row.querySelector('[data-testid="reply-count"]');if(rc)rc.textContent='1 reply'}}}
$('close-thread').onclick=()=>show('thread-panel',false)
window.picker=function picker(id,el){let p=$('global-emoji-picker');p.innerHTML='';p.classList.remove('hidden');p.hidden=false;p.style.display='grid';p.style.position='fixed';p.style.left='700px';p.style.top='500px';['😀','🎉','👍','❤️','🚀','😂','🔥','👏'].forEach(e=>{let b=document.createElement('button');b.className='emoji-option';b.setAttribute('data-testid','emoji-option');b.type='button';b.textContent=e;b.onclick=async()=>{let rr=await api('/messages/'+id+'/reactions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({emoji:e})});if(rr.ok){p.classList.add('hidden');let row=document.querySelector('[data-testid="message"][data-id="'+id+'"]');let chip=document.createElement('span');chip.className='reaction-chip';chip.dataset.testid='reaction-chip';chip.textContent=e+' 1';row.appendChild(chip)}};p.appendChild(b)});p.style.display='grid'}
if(token)api('/auth/me').then(r=>r.ok?r.json():null).then(x=>{if(x){user=x.user;boot()}else{token=null;show('auth-modal',true)}});else show('auth-modal',true)
</script></body></html>
