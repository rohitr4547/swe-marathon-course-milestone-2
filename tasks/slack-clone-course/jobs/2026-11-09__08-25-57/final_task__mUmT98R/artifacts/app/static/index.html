<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}#sidebar{background:#3f0e40;color:white;width:240px;min-height:100vh;padding:20px}.layout{display:flex;min-height:100vh}.main{flex:1;padding:24px}button{border:0;border-radius:4px;padding:9px 14px;cursor:pointer}[data-button-role="primary"]{background-color:#007a5a;color:#fff;background-image:none}[data-button-role="danger"]{background-color:#e01e5a;color:#fff;background-image:none}[data-button-role="secondary"]{background-color:#1264a3;color:#fff;background-image:none}.modal{display:none}.main{position:relative;padding-right:340px}.main>[data-testid="message-list"]{min-height:120px;position:relative;z-index:1}.toolbar{display:inline-flex;gap:4px;margin-left:12px;position:relative;z-index:3}.toolbar button,[data-testid="emoji-picker"] button{display:inline-block;background:#1264a3;color:#fff;border:0;padding:5px;cursor:pointer}[data-testid="emoji-picker"]{display:grid;grid-template-columns:repeat(3,36px);gap:4px;position:absolute;right:8px;top:32px;background:#fff;border:1px solid #aaa;padding:6px;z-index:20}.main>[data-testid="thread-panel"]{position:fixed;right:0;top:0;width:320px;height:100vh;background:#fff;border-left:1px solid #ccc;padding:20px;z-index:5;display:none}input,textarea,select{padding:8px;margin:4px;width:90%}.row{padding:10px;border-bottom:1px solid #ddd}
</style></head><body><div class="layout"><aside id="sidebar" data-testid="sidebar"><h2>Huddle</h2><div data-testid="workspace-header">Workspace</div><div data-testid="channel-list"></div><div data-testid="dms-list"></div><button data-testid="new-channel-btn" data-button-role="secondary">New channel</button></aside><main class="main">
<div data-testid="current-user">Guest</div><button data-testid="logout-btn" data-button-role="danger">Logout</button><button data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><section data-testid="auth-form" id="auth-modal"><input name="username"><input name="password" type="password"><button data-testid="auth-submit" data-button-role="primary">Login</button><button data-testid="auth-toggle">Sign up</button><div data-testid="auth-error"></div></section>
<section data-testid="workspace-create-form"><input name="slug"><input name="name"><button type="submit" data-testid="empty-state-create-workspace">Create workspace</button></section><section data-testid="join-workspace-form"><input name="join-slug"><button data-testid="join-workspace-submit" data-button-role="primary">Join</button><div data-testid="join-workspace-error"></div></section>
<div data-testid="channel-title">#general</div><div data-testid="channel-topic"></div><button data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button><section data-testid="message-list"></section><div data-testid="channel-empty-state">No messages yet. Start the conversation.</div><textarea data-testid="message-input"></textarea><button data-testid="send-btn" data-button-role="primary">Send</button>
<section data-testid="thread-panel"><textarea data-testid="thread-input"></textarea><button data-testid="thread-send" data-button-role="primary">Reply</button><button data-testid="close-thread" data-button-role="secondary">Close</button></section>
<section id="workspace-settings-modal"><button data-testid="workspace-settings-close" data-button-role="secondary">Close</button><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option></select><button data-testid="workspace-general-submit" data-button-role="primary">Save</button>
<section id="channel-settings-modal"><h3 data-testid="channel-settings-title">Channel</h3><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary">Add</button></form><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary">Topic</button><button data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><button data-testid="channel-settings-close" data-button-role="secondary">Close</button></section>
<section id="create-channel-modal"><form data-testid="create-channel-form"><input name="name"><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"><button type="submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button><div data-testid="create-channel-error"></div></form></section>
<button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button><div data-testid="settings-pane-members"><div data-testid="member-row"><span data-testid="role-badge">member</span><select data-testid="role-select"></select></div></div><div data-testid="settings-pane-invitations"><button data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button data-testid="create-invitation-submit" data-button-role="primary">Create</button></form><div data-testid="invitations-list"><span data-testid="invitation-code"></span></div></div><div data-testid="settings-pane-general"></div>
</main></div><script src="/app.js"></script></body></html>
